<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tactical Desert - Shinobi vs Baraka</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #c2b280; font-family: sans-serif; color: #fff; }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* HUD Superior */
        #hud { position: absolute; top: 0; left: 0; width: 100%; z-index: 5; pointer-events: none; display: none; justify-content: space-between; padding: 15px; }
        .panel { background: rgba(45, 35, 25, 0.85); border: 2px solid #ff6600; padding: 8px 14px; border-radius: 6px; font-size: 13px; font-weight: bold; color: #ffdfba; }

        /* Mira Dinâmica */
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 22px; height: 22px; z-index: 4; pointer-events: none; display: none; }
        .cross-line { position: absolute; background: #ffffff; box-shadow: 0 0 4px rgba(0,0,0,0.9); transition: background 0.1s; }
        #c-top { top: 0; left: 10px; width: 2px; height: 8px; }
        #c-bottom { bottom: 0; left: 10px; width: 2px; height: 8px; }
        #c-left { top: 10px; left: 0; width: 8px; height: 2px; }
        #c-right { top: 10px; right: 0; width: 8px; height: 2px; }
        #crosshair.locked .cross-line { background: #ff1e1e; box-shadow: 0 0 8px #ff1e1e; }

        /* Camada de Controles Mobile */
        #controls { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: none; }
        .zone-left { position: absolute; bottom: 0; left: 0; width: 50%; height: 100%; pointer-events: auto; }
        .zone-right { position: absolute; bottom: 0; right: 0; width: 50%; height: 100%; pointer-events: auto; }

        #joystick { position: absolute; bottom: 40px; left: 40px; width: 100px; height: 100px; background: rgba(255,255,255,0.12); border: 2px solid #ff6600; border-radius: 50%; display: none; }
        #stick { position: absolute; top: 25px; left: 25px; width: 50px; height: 50px; background: #ff6600; border-radius: 50%; }

        .btn-action { position: absolute; border-radius: 50%; color: #fff; font-weight: bold; display: flex; align-items: center; justify-content: center; pointer-events: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }
        #btn-fire { right: 30px; bottom: 35px; width: 78px; height: 78px; background: rgba(255, 50, 50, 0.45); border: 3px solid #ff3333; font-size: 13px; }
        #btn-ads { right: 120px; bottom: 45px; width: 58px; height: 58px; background: rgba(255, 102, 0, 0.4); border: 2px solid #ff6600; font-size: 11px; }

        /* Tela Inicial com ponteiro ativo garantido */
        #menu { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #261d18; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; pointer-events: auto; }
        h1 { color: #ff6600; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 2px; font-size: 26px; }
        p { color: #d6b885; margin-bottom: 25px; font-size: 13px; }
        .btn-play { background: #ff6600; color: #fff; border: none; padding: 18px 45px; font-size: 18px; font-weight: bold; border-radius: 6px; cursor: pointer; text-transform: uppercase; box-shadow: 0 4px 15px rgba(255, 102, 0, 0.4); z-index: 10000; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>
    
    <div id="crosshair">
        <div id="c-top" class="cross-line"></div>
        <div id="c-bottom" class="cross-line"></div>
        <div id="c-left" class="cross-line"></div>
        <div id="c-right" class="cross-line"></div>
