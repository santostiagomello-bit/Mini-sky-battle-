<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VANGUARD: STRIKE - Tactical FPS</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #07090e; font-family: system-ui, -apple-system, sans-serif; color: #fff; }
        #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        /* MENU INICIAL COMPETITIVO */
        #menu-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 20;
            background: radial-gradient(circle at center, #111827 0%, #030712 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: 15px; overflow-y: auto;
        }
        .menu-card {
            background: rgba(17, 24, 39, 0.95); border: 1px solid rgba(59, 130, 246, 0.4);
            border-radius: 16px; padding: 20px; width: 100%; max-width: 550px; text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7); backdrop-filter: blur(12px);
        }
        h1 { font-size: 1.6rem; font-weight: 900; letter-spacing: 2px; color: #3b82f6; margin-bottom: 4px; text-transform: uppercase; }
        .subtitle { font-size: 0.75rem; color: #9ca3af; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px; }
        
        .section-title { font-size: 0.8rem; font-weight: bold; color: #60a5fa; margin-bottom: 8px; text-align: left; text-transform: uppercase; }
        
        .options-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 15px; }
        .option-card {
            background: rgba(31, 41, 55, 0.8); border: 2px solid rgba(75, 85, 99, 0.4);
            border-radius: 8px; padding: 10px 6px; cursor: pointer; transition: all 0.2s;
        }
        .option-card.selected { border-color: #3b82f6; background: rgba(59, 130, 246, 0.2); }
        .option-card h3 { font-size: 0.85rem; color: #fff; margin-bottom: 2px; }
        .option-card span { font-size: 0.65rem; color: #9ca3af; }

        #start-btn {
            width: 100%; background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: white; border: none; padding: 14px; font-size: 1rem; font-weight: bold;
            border-radius: 8px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4); transition: transform 0.1s;
        }
        #start-btn:active { transform: scale(0.98); }

        /* HUD DE JOGO */
        #hud { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none; display: none; }
        .hud-element { pointer-events: auto; }
        
        #crosshair {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 6px; height: 6px; border: 2px solid rgba(255,255,255,0.9); border-radius: 50%;
        }
        
        #top-bar {
            position: absolute; top: 12px; left: 15px; right: 15px; display: flex; justify-content: space-between; align-items: center;
        }
        .stat-box { background: rgba(0,0,0,0.7); border: 1px solid rgba(255,255,255,0.15); padding: 6px 12px; border-radius: 6px; font-weight: bold; font-size: 0.8rem; backdrop-filter: blur(4px); }
        
        /* CONTROLES MOBILE */
        #joystick-zone {
            position: absolute; bottom: 20px; left: 20px; width: 110px; height: 110px;
            background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.15); border-radius: 50%;
        }
        #joystick-knob {
            position: absolute; top: 30px; left: 30px; width: 50px; height: 50px;
            background: rgba(255,255,255,0.35); border-radius: 50%; pointer-events: none;
        }
        
        #action-buttons {
            position: absolute; bottom: 20px; right: 20px; display: flex; gap: 12px; align-items: flex-end;
        }
        .action-btn {
            width: 55px; height: 55px; background: rgba(0,0,0,0.6); border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%; color: white; font-weight: bold; font-size: 0.75rem; display: flex;
            align-items: center; justify-content: center; backdrop-filter: blur(4px);
        }
        #btn-fire { width: 75px; height: 75px; background: rgba(220, 38, 38, 0.7); border-color: #ef4444; font-size: 0.85rem; }
    </style>
    <!-- Three.js Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- MENU INICIAL -->
    <div id="menu-overlay">
        <div class="menu-card">
            <h1>VANG
