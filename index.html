<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Free Fire Mobile - Fixed Start Button</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030712;color:#fff;font-family:Arial,sans-serif;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:1}

/* Lobby */
#lobby{position:fixed;inset:0;z-index:999999;background:radial-gradient(circle at center, #1e293b 0%, #090d16 100%);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:25px}
.lobby-header{font-size:clamp(22px, 4vw, 36px);font-weight:900;color:#facc15;text-shadow:3px 3px 0 #b91c1c;letter-spacing:2px;margin-top:10px;text-align:center}
.char-container{display:flex;gap:12px;margin:15px 0}
.char-card{padding:14px 22px;background:rgba(255,255,255,0.08);border:2px solid #facc15;border-radius:12px;font-weight:bold;font-size:15px;cursor:pointer}
.char-card.active{background:#facc15;color:#000;box-shadow:0 0 15px rgba(250,204,21,0.6)}

.settings-panel{background:rgba(15,23,42,0.85);border:2px solid rgba(250,204,21,0.4);padding:15px 20px;border-radius:14px;width:100%;max-width:320px;display:flex;flex-direction:column;gap:10px}
.settings-panel label{font-size:13px;font-weight:bold;color:#facc15;display:flex;justify-content:space-between}
.settings-panel input[type=range]{width:100%;accent-color:#facc15;cursor:pointer}

#playButton{width:100%;max-width:300px;padding:18px;background:linear-gradient(180deg,#f97316,#b91c1c);border:none;border-radius:14px;color:#fff;font-size:22px;font-weight:900;cursor:pointer;text-transform:uppercase;box-shadow:0 6px 0 #7f1d1d;outline:none;touch-action:manipulation;pointer-events:auto;z-index:1000000;}
#playButton:active{transform:translateY(4px);box-shadow:0 2px 0 #7f1d1d}

/* HUD */
#gameHUD{display:none;position:fixed;inset:0;z-index:50;pointer-events:none}
#topBar{position:absolute;top:15px;left:15px;display:flex;gap:8px;pointer-events:auto}
.badge{background:rgba(0,0,0,0.7);border:1px solid rgba(255,255,255,0.3);padding:6px 12px;border-radius:6px;font-size:12px;font-weight:bold}
#killCount{color:#ef4444}
#aliveCount{color:#facc15}

/* Minimapa */
#minimap{position:absolute;top:15px;right:15px;width:100px;height:100px;border-radius:50%;background:rgba(15,23,42,0.85);border:2px solid #facc15;overflow:hidden;pointer-events:auto;box-shadow:0 4px 10px rgba(0,0,0,0.5)}
#minimapCanvas{width:100%;height:100%;display:block}

/* Joystick */
#joystick{position:absolute;bottom:35px;left:35px;width:125px;height:125px;border:2px solid rgba(255,255,255,0.3);border-radius:50%;background:rgba(0,0,0,0.3);pointer-events:auto;touch-action:none}
#stick{position:absolute;left:50%;top:50%;width:55px;height:55px;margin:-27px;border:2px solid #fff;border-radius:50%;background:rgba(255,255,255,0.7)}

/* Área de Câmera Direita */
#cameraTouchArea{position:absolute;right:0;top:0;width:55%;height:100%;pointer-events:auto;z-index:40}

/* Botões de Ação */
#freelookButton{position:absolute;right:230px;bottom:45px;width:60px;height:60px;border:2px solid #38bdf8;border-radius:50%;background:rgba(56,189,248,0.3);pointer-events:auto;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:10px;z-index:45;touch-action:manipulation}
#fireButton{position:absolute;right:40px;bottom:30px;width:95px;height:95px;border:4px solid #ef4444;border-radius:50%;background:rgba(239,68,68,0.5);pointer-events:auto;z-index:45;display:flex;align-items:center;justify-content:center}
.fire-inner{width:35px;height:35px;background:#fff;border-radius:50%;opacity:0.8}

#aimButton{position:absolute;right:155px;bottom:130px;width:60px;height:60px;border:2px solid #fff;border-radius:50%;background:rgba(0,0,0,0.5);pointer-events:auto;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:11px;z-index:45;touch-action:manipulation}
#sprintButton{position:absolute;right:155px;bottom:45px;width:60px;height:60px;border:2px solid #facc15;border-radius:50%;background:rgba(234,179,8,0.4);pointer-events:auto;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:11px;z-index:45;touch-action:manipulation}
#jumpButtonHud{position:absolute;right:65px;bottom:145px;width:65px;height:65px;border:2px solid #38bdf8;border-radius:50%;background:rgba(56,189,248,0.4);pointer-events:auto;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:11px;z-index:45;touch-action:manipulation}

/* Painel de Loot Coletado */
#lootNotification{position:absolute;top:70px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.8);border:1px solid #facc15;padding:6px 16px;border-radius:8px;font-size:13px;font-weight:bold;color:#facc15;display:none;z-index:60;pointer-events:none}

/* Mira FPS */
#crosshair{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:18px;height:18px;border:2px solid rgba(255,255,255,0.85);border-radius:50%;pointer-events:none;z-index:45;display:flex;align-items:center;justify-content:center}
.cross-dot{width:2px;height:2px;background:#fff;border-radius:50%}

/* Avião */
#planeOverlay{position:fixed;inset:0;z-index:999;display:none;pointer-events:none}
#planeNotice{position:absolute;top:18%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.85);border:2px solid #facc15;padding:10px 24px;border-radius:20px;font-weight:bold;font-size:15px}
#jumpButtonPlane{position:absolute;left:50%;top:28%;transform:translateX(-50%);padding:14px 34px;background:linear-gradient(180deg,#facc15,#f97316);border:none;border-radius:14px;color:#000;font-size:18px;font-weight:900;pointer-events:auto;z-index:1000;box-shadow:0 6px 0 #b45309;touch-action:manipulation}
</style>
</head>
<body>

<div id="lobby">
  <div class="lobby-header">🔥 FREE FIRE - BATTLE ROYALE 🔥</div>
  
  <div class="char-container">
    <div class="char-card active" onclick="selectChar(this, 'Alok')">ALOK</div>
    <div class="char-card" onclick="selectChar(this, 'Kelly')">KELLY</div>
    <div class="char-card" onclick="selectChar(this, 'Moco')">MOCO</div>
  </div>

  <div class="settings-panel">
    <label>SENSIBILIDADE: <span id="sensVal">50</span>%</label>
    <input type="range" id="sensRange" min="1" max="100" value="50">
  </div>

  <button id="playButton">INICIAR PARTIDA</button>
</div>

<div id="gameHUD">
  <div id="topBar">
    <div class="badge">VIVOS: <span id="aliveCount">50</span></div>
    <div class="badge">KILLS: <span id="killCount">0</span></div>
  </div>
  <div id="minimap"><canvas id="minimapCanvas" width="100" height="100"></canvas></div>
  <div id="lootNotification">📦 COLETOU: <span id="lootText">Colete Nível 2</span></div>
  
  <div id="joystick"><div id="stick"></div></div>
  <div id="cameraTouchArea"></div>
  
  <div id="crosshair"><div class="cross-dot"></div></div>

  <div id="freelookButton">👁️ OLHAR</div>
  <div id="sprintButton">CORRER</div>
  <div id="aimButton">MIRA</div>
  <div id="jumpButtonHud">PULAR</div>
  <button id="fireButton"><div class="fire-inner"></div></button>
</div>

<div id="planeOverlay">
  <div id="planeNotice">✈️ ROTA DO AVIÃO — MAPA BERMUDA</div>
  <button id="jumpButtonPlane">SALTAR</button>
</div>

<script>
let selectedCharacter = "Alok";
function selectChar(el, name) {
  document.querySelectorAll('.char-card').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  selectedCharacter = name;
}

let sensitivity = 50;
const sensRange = document.getElementById("sensRange");
const sensVal = document.getElementById("sensVal");
sensRange.addEventListener("input", (e) => {
  sensitivity = parseInt(e.target.value);
  sensVal.innerText = sensitivity;
});

let scene, camera, renderer;
let world, player, plane;
let bots = [];
let loots = [];
let bullets = [];
let gameStarted = false;
let phase = "lobby"; 
let planeTime = 0, moveX = 0, moveY = 0, diveY = 60;
let playerAngleY = 0, lookOffsetAngleY = 0, cameraAngleX = 0;
let isFreeLooking = false, isAiming = false, isSprinting = false;
let killCount = 0, aliveCount = 50;

function initEngine() {
  try {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x60a5fa);
    scene.fog = new THREE.Fog(0x60a5fa, 80, 280);

    camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 400);
    
    renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "default" });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1));
    document.body.appendChild(renderer.domElement);

    window.addEventListener('resize', () => {
      if(!camera || !renderer) return;
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    scene.add(new THREE.HemisphereLight(0xffffff, 0x334155, 1.5));
    const sun = new THREE.DirectionalLight(0xfffaed, 1.7);
    sun.position.set(60, 100, 60);
    scene.add(sun);

    const mat = (c) => new THREE.MeshBasicMaterial({ color: c });
    world = new THREE.Group();
    scene.add(world);

    const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), mat(0x22c55e));
    ground.rotation.x = -Math.PI / 2;
    world.add(ground);

    function makeBuilding(x, z, w, h, d, color) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(color));
      m.position.set(x, h/2, z);
      world.add(m);
    }
    makeBuilding(-35, -35, 12, 7, 12, 0x475569);
    makeBuilding(35, 35, 10, 9, 10, 0x991b1b);
    makeBuilding(-40, 35, 14, 5, 14, 0x334155);
    makeBuilding(35, -35, 10, 6, 10, 0x0f172a);

    player = new THREE.Group();
    player.position.set(0, 0, 0);
    scene.add(player);

    const weaponGroup = new THREE.Group();
    const gunBody = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.15, 0.9), mat(0x1e293b));
    gunBody.position.set(0.3, -0.25, -0.5);
    weaponGroup.add(gunBody);
    camera.add(weaponGroup);
    scene.add(camera);

    plane = new THREE.Mesh(new THREE.BoxGeometry(8, 2.2, 3), mat(0x334155));
    plane.visible = false;
    scene.add(plane);

    for(let i = 0; i < 6; i++) {
      const bGroup = new THREE.Group();
      const bTorso = new THREE.Mesh(new THREE.BoxGeometry(0.75, 1.1, 0.45), mat(0xdc2626));
      bTorso.position.y = 0.55; bGroup.add(bTorso);
      const bHead = new THREE.Mesh(new THREE.SphereGeometry(0.35, 16, 16), mat(0xfde047));
      bHead.position.y = 1.35; bGroup.add(bHead);
      
      bGroup.position.set((Math.random() - 0.5) * 100, 0, (Math.random() - 0.5) * 100);
      scene.add(bGroup);
      bots.push({ group: bGroup, speed: 0.12 });
    }

    for(let i = 0; i < 10; i++) {
      const lMesh = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.4, 0.8), mat(0xfacc15));
      lMesh.position.set((Math.random() - 0.5) * 100, 0.2, (Math.random() - 0.5) * 100);
      scene.add(lMesh);
      loots.push({ mesh: lMesh, type: "Colete / Arma" });
    }
  } catch(err) {
    console.error("Erro crítico WebGL:", err);
  }
}

// Joystick
const joystick = document.getElementById("joystick"), stick = document.getElementById("stick");
let joyId = null, joyCenter = { x: 0, y: 0 };

joystick.addEventListener("pointerdown", e => {
  joyId = e.pointerId;
  const r = joystick.getBoundingClientRect();
  joyCenter = { x: r.left + r.width/2, y: r.top + r.height/2 };
  updateJoy(e);
  joystick.setPointerCapture(joyId);
});
joystick.addEventListener("pointermove", e => { if(e.pointerId === joyId) updateJoy(e); });
joystick.addEventListener("pointerup", e => {
  if(e.pointerId === joyId) {
    joyId = null; moveX = 0; moveY = 0;
    stick.style.transform = `translate(0px, 0px)`;
  }
});

function updateJoy(e) {
  const dx = e.clientX - joyCenter.x, dy = e.clientY - joyCenter.y;
  const dist = Math.hypot(dx, dy), maxR = 40;
  const nx = dist > maxR ? (dx/dist) * maxR : dx;
  const ny = dist > maxR ? (dy/dist) * maxR : dy;
  stick.style.transform = `translate(${nx}px, ${ny}px)`;
  moveX = nx / maxR; moveY = ny / maxR;
}

function getSensMultiplier() {
  return (sensitivity / 50) * 0.0035;
}

// Olhadinha (Free Look)
const freelookBtn = document.getElementById("freelookButton");
freelookBtn.addEventListener("pointerdown", e => { e.stopPropagation(); isFreeLooking = true; });
window.addEventListener("pointerup", () => { isFreeLooking = false; });

// Câmera Touch
const cameraArea = document.getElementById("cameraTouchArea");
let camTouchId = null, lastCamX = 0, lastCamY = 0;

cameraArea.addEventListener("pointerdown", e => {
  camTouchId = e.pointerId;
  lastCamX = e.clientX;
  lastCamY = e.clientY;
  cameraArea.setPointerCapture(camTouchId);
});
cameraArea.addEventListener("pointermove", e => {
  if(e.pointerId === camTouchId) {
    let deltaX = e.clientX - lastCamX;
    let deltaY = e.clientY - lastCamY;
    const sens = getSensMultiplier();

    if (isFreeLooking) {
      lookOffsetAngleY -= deltaX * sens;
      lookOffsetAngleY = Math.max(-1.5, Math.min(1.5, lookOffsetAngleY));
    } else {
      playerAngleY -= deltaX * sens;
    }

    cameraAngleX -= deltaY * sens;
    cameraAngleX = Math.max(-1.4, Math.min(1.4, cameraAngleX));

    lastCamX = e.clientX;
    lastCamY = e.clientY;
  }
});
cameraArea.addEventListener("pointerup", e => { if(e.pointerId === camTouchId) camTouchId = null; });

// Tiro
const fireBtn = document.getElementById("fireButton");
fireBtn.addEventListener("pointerdown", e => {
  e.stopPropagation();
  if(phase !== "ground") return;
  const bMesh = new THREE.Mesh(new THREE.SphereGeometry(0.22), new THREE.MeshBasicMaterial({ color: 0xfacc15 }));
  bMesh.position.set(camera.position.x, camera.position.y - 0.1, camera.position.z);
  scene.add(bMesh);

  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  bullets.push({ mesh: bMesh, dir: dir.clone(), life: 60 });
});

document.getElementById("sprintButton").addEventListener("click", () => { isSprinting = !isSprinting; });
document.getElementById("aimButton").addEventListener("click", () => { isAiming = !isAiming; });

// Botão de Iniciar com Disparo Garantido
function startGame(e) {
  if(e) { e.preventDefault(); e.stopPropagation(); }
  
  const lobby = document.getElementById("lobby");
  lobby.style.display = 'none';
  lobby.remove();

  initEngine();

  document.getElementById("planeOverlay").style.display = "block";
  gameStarted = true;
  phase = "plane";
  if(plane) plane.visible = true;

  animate();
}

const playBtn = document.getElementById("playButton");
playBtn.addEventListener("click", startGame);
playBtn.addEventListener("touchend", startGame);

function jumpPlane(e) {
  if(e) { e.preventDefault(); e.stopPropagation(); }
  if (phase !== "plane") return;
  phase = "diving";
  player.position.set(plane.position.x, 1.6, plane.position.z);
  diveY = 60;
  plane.visible = false;
  document.getElementById("planeOverlay").style.display = "none";
  document.getElementById("gameHUD").style.display = "block";
}

const jumpBtn = document.getElementById("jumpButtonPlane");
jumpBtn.addEventListener("click", jumpPlane);
jumpBtn.addEventListener("touchend", jumpPlane);

function drawMinimap() {
  const canvas = document.getElementById("minimapCanvas");
  if(!canvas) return;
  const ctx = canvas.getContext("2d");
  if(!ctx) return;
  
  ctx.clearRect(0, 0, 100, 100);
  ctx.fillStyle = "rgba(15, 23, 42, 0.9)";
  ctx.fillRect(0, 0, 100, 100);

  ctx.fillStyle = "#3b82f6";
  ctx.beginPath();
  ctx.arc(50, 50, 4, 0, Math.PI * 2);
  ctx.fill();

  bots.forEach(bot => {
    const dx = (bot.group.position.x - player.position.x) * 1.2;
    const dz = (bot.group.position.z - player.position.z) * 1.2;
    const rx = 50 + dx;
    const rz = 50 + dz;
    if (rx >= 0 && rx <= 100 && rz >= 0 && rz <= 100) {
      ctx.fillStyle = "#ef4444";
      ctx.beginPath();
      ctx.arc(rx, rz, 3, 0, Math.PI * 2);
      ctx.fill();
    }
  });
}

function showLootNotification(text) {
  const notif = document.getElementById("lootNotification");
  document.getElementById("lootText").innerText = text;
  notif.style.display = "block";
  setTimeout(() => { notif.style.display = "none"; }, 2000);
}

function animate() {
  requestAnimationFrame(animate);
  
  if (renderer && scene && camera) {
    camera.fov += ((isAiming ? 45 : 75) - camera.fov) * 0.15;
    camera.updateProjectionMatrix();
    renderer.render(scene, camera);
  }
  if (!gameStarted) return;

  drawMinimap();

  if (phase === "plane") {
    planeTime += 0.008;
    plane.position.set(Math.sin(planeTime) * 110, 60, Math.cos(planeTime * 0.6) * 110);
    camera.position.set(plane.position.x, plane.position.y + 4, plane.position.z + 10);
    camera.lookAt(plane.position);
  }
  else if (phase === "diving") {
    player.position.x += moveX * 0.8;
    player.position.z += moveY * 0.8;
    diveY -= 0.5;
    player.position.y = Math.max(1.6, diveY);

    camera.position.set(player.position.x, player.position.y + 1.6, player.position.z);
    camera.rotation.set(0, 0, 0);
    camera.rotation.order = 'YXZ';
    camera.rotation.y = playerAngleY;
    camera.rotation.x = cameraAngleX;

    if (player.position.y <= 1.6) phase = "ground";
  }
  else if (phase === "ground") {
    if(moveX !== 0 || moveY !== 0) {
      const moveAngle = Math.atan2(moveX, moveY) + playerAngleY;
      const speed = isSprinting ? 0.45 : (selectedCharacter === 'Kelly' ? 0.35 : 0.28);
      player.position.x += Math.sin(moveAngle) * speed;
      player.position.z += Math.cos(moveAngle) * speed;
    }

    if (!isFreeLooking) lookOffsetAngleY += (0 - lookOffsetAngleY) * 0.15;

    camera.position.set(player.position.x, player.position.y + 1.6, player.position.z);
    camera.rotation.set(0, 0, 0);
    camera.rotation.order = 'YXZ';
    camera.rotation.y = playerAngleY + lookOffsetAngleY;
    camera.rotation.x = cameraAngleX;

    for(let i = loots.length - 1; i >= 0; i--) {
      if(player.position.distanceTo(loots[i].mesh.position) < 2.5) {
        showLootNotification(loots[i].type);
        scene.remove(loots[i].mesh);
        loots.splice(i, 1);
      }
    }

    let enemyInSight = false;
    const camDir = new THREE.Vector3();
    camera.getWorldDirection(camDir);

    bots.forEach(bot => {
      if(player.position.distanceTo(bot.group.position) < 35) {
        const toBot = bot.group.position.clone().sub(camera.position).normalize();
        if (camDir.dot(toBot) > 0.85) enemyInSight = true;
      }
    });

    document.getElementById("crosshair").style.borderColor = enemyInSight ? "#ef4444" : "rgba(255,255,255,0.85)";

    bots.forEach(bot => {
      const dx = player.position.x - bot.group.position.x;
      const dz = player.position.z - bot.group.position.z;
      const dist = Math.hypot(dx, dz);
      if(dist > 1.2) {
        bot.group.position.x += (dx / dist) * bot.speed;
        bot.group.position.z += (dz / dist) * bot.speed;
        bot.group.rotation.y = Math.atan2(dx, dz);
      }
    });

    for(let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.mesh.position.addScaledVector(b.dir, 3.0);
      b.life--;

      bots.forEach((bot, bIdx) => {
        if(b.mesh.position.distanceTo(bot.group.position) < 1.8) {
          scene.remove(b.mesh);
          bullets.splice(i, 1);
          scene.remove(bot.group);
          bots.splice(bIdx, 1);
          killCount++;
          aliveCount = Math.max(1, aliveCount - 1);
          document.getElementById("killCount").innerText = killCount;
          document.getElementById("aliveCount").innerText = aliveCount;
        }
      });

      if(b.life <= 0 && b.mesh.parent) {
        scene.remove(b.mesh);
        bullets.splice(i, 1);
      }
    }
  }
}
</script>
</body>
</html>
