<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>MINI ROYALE — Cartoon Edition</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#38b6ff;font-family:Arial,sans-serif;color:#fff;touch-action:none}
#game{position:fixed;inset:0}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
.panel{background:rgba(20,35,45,.9);border:3px solid #ff9100;border-radius:12px;padding:8px 12px;font-weight:900;text-shadow:0 2px 0 #000;box-shadow:0 4px 0 rgba(0,0,0,.5)}
#topbar{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px}
#topbar .panel{font-size:14px;border-color:#36c7ef}
#jumpInfo{position:absolute;top:12%;left:50%;transform:translateX(-50%);min-width:65%;text-align:center;font-size:18px;border-color:#ffb52e}
#speed{position:absolute;bottom:12%;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:15px;background:rgba(20,35,45,.9);padding:8px 12px;border-radius:10px;border:2px solid #ff9100}

/* Mira Reativa Estilo Cartoon */
#crosshair{display:none;position:absolute;left:50%;top:50%;width:28px;height:28px;transform:translate(-50%,-50%);pointer-events:none}
#crosshair:before,#crosshair:after{content:"";position:absolute;background:#fff;border:1px solid #000}
#crosshair:before{width:4px;height:26px;left:12px;top:1px}
#crosshair:after{height:4px;width:26px;top:12px;left:1px}
#crosshair.locked:before,#crosshair.locked:after{background:#ff2828;box-shadow:0 0 10px #ff2828}

#controls{position:fixed;inset:0;z-index:8;pointer-events:none}
#lookZone{position:absolute;right:0;top:0;width:58%;height:100%;pointer-events:auto;touch-action:none}
#moveZone{position:absolute;left:0;bottom:0;width:48%;height:52%;pointer-events:auto;touch-action:none}
#joystick{display:none;position:absolute;width:120px;height:120px;border:3px solid rgba(255,255,255,.9);background:rgba(30,45,60,.3);border-radius:50%;pointer-events:none}
#stick{position:absolute;width:52px;height:52px;left:34px;top:34px;border-radius:50%;background:#ff9100;border:3px solid #ffe0a0;box-shadow:0 3px 0 #000}

.btn{position:absolute;pointer-events:auto;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:1000;color:white;background:#ff8400;border:4px solid #ffd06c;box-shadow:0 6px 0 rgba(0,0,0,.6);text-shadow:0 2px 0 #000}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.6)}
#action{right:22px;bottom:7%;width:110px;height:110px;font-size:16px}
#fire{display:none;right:22px;bottom:7%;width:90px;height:90px;background:#e63946;border-color:#ff8177;font-size:14px}
#aim{display:none;right:126px;bottom:9%;width:68px;height:68px;font-size:13px;background:#1d3557;border-color:#457b9d}
#jump{display:none;right:22px;bottom:27%;width:74px;height:74px;font-size:13px;background:#1d70b8;border-color:#83caff}

#mapButton{position:absolute;right:14px;top:68px;pointer-events:auto;border:3px solid #ff9100;background:#14232a;border-radius:10px;padding:9px 12px;font-weight:900;color:white;box-shadow:0 4px 0 #000}
#mapPanel{display:none;position:fixed;z-index:20;inset:8% 5%;background:#14232ae8;border:3px solid #ff9100;border-radius:16px;padding:12px;pointer-events:auto;box-shadow:0 15px 40px #000}
#mapPanel h3{margin:0 0 8px;text-align:center;color:#ffc15c}
#mapCanvas{width:100%;height:calc(100% - 40px);background:#6eaa68;border-radius:10px;border:2px solid #35533f}
#mapClose{position:absolute;right:12px;top:10px;background:#e63946;color:white;border:2px solid #ff8177;border-radius:8px;padding:7px 12px;font-weight:900}
#message{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);padding:12px 18px;background:#14232af8;border:3px solid #ff9100;border-radius:12px;display:none;text-align:center;font-weight:900;font-size:16px;box-shadow:0 6px 0 #000}

/* Lobby Estilizado Cartoon */
#lobby{position:fixed;inset:0;z-index:30;overflow:hidden;color:#fff;background:radial-gradient(circle at 50% 40%,#1d3557 0%,#0b131e 100%);font-family:Arial,sans-serif}
.lobby-wrap{width:100%;height:100%;max-width:1500px;margin:auto;padding:12px;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:10px}
.lobby-header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;background:#0f1e2de8;border:3px solid #2e4a68;border-radius:14px}
.brand{font-weight:1000;letter-spacing:2px;color:#ffb34d;font-size:clamp(16px,2.2vw,26px);text-shadow:0 3px 0 #000}
.header-right{display:flex;align-items:center;gap:6px}
.currency,.head-btn,.level{background:#1a2b40;border:2px solid #3b506a;border-radius:10px;padding:6px 10px;font-weight:900;font-size:clamp(10px,1.1vw,13px)}
.currency b{color:#ffc15c}
.head-btn{color:#fff;cursor:pointer;background:#243b55}
.level{min-width:100px}.level small{display:block;color:#aebdd0;margin-bottom:2px;font-size:9px}
.level-bar{height:6px;background:#101924;border-radius:6px;overflow:hidden;border:1px solid #3b506a}.level-bar i{display:block;width:62%;height:100%;background:#ff9100}
.lobby-layout{display:grid;grid-template-columns:150px minmax(0,1fr) 220px;gap:10px;min-height:0}
.lobby-nav,.lobby-character,.weapon-card,.lobby-content{background:#0f1e2de8;border:3px solid #2e4a68;border-radius:14px;box-shadow:0 8px 0 #0005}
.lobby-nav{padding:8px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.nav-btn{width:100%;padding:11px 8px;border:2px solid transparent;border-radius:10px;text-align:left;color:#c6d4e5;background:#172538;font-weight:900;font-size:11px;cursor:pointer}

<div id="game"></div>
<div id="hud">
  <div id="topbar" style="display:none">
    <div class="panel">HP: <span id="hp" style="color:#39c78a">100</span></div>
    <div class="panel">ABATES: <span id="kills" style="color:#ffc15c">0</span></div>
    <div class="panel">CARTOON ROYALE</div>
  </div>
  <div id="jumpInfo" class="panel">ALTITUDE: 150m</div>
  <div id="speed">VELOCIDADE: 190 km/h</div>
  <div id="crosshair"></div>
  <button id="mapButton">MAPA</button>
  <div id="message"></div>
  <div id="matchInfo" style="display:none; position:absolute; left:12px; top:68px; flex-direction:column; gap:6px;">
    <div class="panel" style="font-size:11px;">REGIÃO: <span id="regionName">CIDADE CENTRAL</span></div>
    <div class="panel" style="font-size:11px;">CRÉDITOS: <span id="credits">0</span> • MOCHILA: <span id="bagLoad">0/8</span></div>
    <div class="panel" style="font-size:11px;">ZONA: <span id="zoneTimer">Preparando</span></div>
  </div>
  <div id="zoneNotice" style="display:none; position:absolute; top:56px; left:50%; transform:translateX(-50%); background:#172435; border:2px solid #36c7ef; border-radius:8px; padding:7px 12px; font-size:11px; font-weight:900;">A ZONA SEGURA ESTÁ DIMINUINDO</div>
  <div id="lootHint" style="display:none; position:absolute; left:50%; bottom:22%; transform:translateX(-50%); background:#122436; border:2px solid #ffc15c; border-radius:8px; padding:8px 12px; font-size:12px; font-weight:900;">LOOT RECOLHIDO</div>
</div>

<div id="controls">
  <div id="moveZone"></div>
  <div id="lookZone"></div>
  <div id="joystick"><div id="stick"></div></div>
  <div id="action" class="btn">SALTAR</div>
  <div id="fire" class="btn">ATIRAR</div>
  <div id="aim" class="btn">MIRA</div>
  <div id="jump" class="btn">PULAR</div>
  <button id="bagButton" style="display:none;position:absolute;left:12px;top:150px;pointer-events:auto;border:3px solid #ff9100;background:#14232a;border-radius:10px;padding:8px 12px;color:white;font-weight:900;box-shadow:0 4px 0 #000">MOCHILA</button>
  <button id="interactButton" style="display:none;position:absolute;left:50%;bottom:14%;transform:translateX(-50%);pointer-events:auto;border:3px solid #ffe0a0;background:#ff9100;color:#201407;border-radius:10px;padding:10px 16px;font-weight:1000;box-shadow:0 4px 0 #000">INTERAGIR</button>
</div>

<div id="mapPanel"><h3>MAPA DO ARQUIPÉLAGO</h3><button id="mapClose">FECHAR</button><canvas id="mapCanvas"></canvas></div>
<div id="inventoryPanel" style="display:none;position:fixed;z-index:22;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,500px);max-height:80vh;overflow:auto;background:#101c2bee;border:3px solid #ff9100;border-radius:14px;padding:14px;color:#fff;box-shadow:0 15px 40px #000"><button class="panel-close" id="inventoryClose" style="float:right;background:#e63946;color:#fff;border:0;border-radius:6px;padding:6px 10px;font-weight:900">X</button><h3 style="margin:0 0 10px;color:#ffc15c">MOCHILA</h3><p id="inventorySummary" style="font-size:12px">0/8 slots</p><div id="inventoryList" style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const $=id=>document.getElementById(id);
let scene,camera,renderer,clock;
let activeSkinKey='detective';
try{activeSkinKey=localStorage.getItem('miniRoyaleEquippedSkin')||'detective';}catch(e){}
let state='plane', player={x:-540,y:150,z:-500,yaw:0,pitch:0,hp:100,kills:0,ads:false,vy:0,grounded:false};
let move={x:0,z:0},bots=[],airAvatar=null,airplane=null,flightPath=null,mapOpen=false;
const MAP=1200, HALF=MAP/2;
const FLIGHT_START={x:-540,z:-500},FLIGHT_END={x:540,z:500};let flightProgress=0;
const worldColliders=[];
const lootDrops=[];

function mat(color){return new THREE.MeshLambertMaterial({color,roughness:1});}
function addBoxCollider(x,z,w,d){worldColliders.push({x,z,halfW:w/2,halfD:d/2});}
function resolveWorldCollision(x,z,radius=0.85){
  let px=x,pz=z;
  for(let pass=0;pass<3;pass++){
    for(const c of worldColliders){
      const dx=px-c.x,dz=pz-c.z;
      const qx=Math.max(-c.halfW,Math.min(c.halfW,dx));
      const qz=Math.max(-c.halfD,Math.min(c.halfD,dz));
      let ox=dx-qx,oz=dz-qz,dist=Math.hypot(ox,oz);
      if(dist<radius){
        if(dist<0.0001){ox=1;oz=0;dist=1;}
        const push=radius-dist;
        px+=(ox/dist)*push;pz+=(oz/dist)*push;
      }
    }
  }
  return {x:px,z:pz};
}
function terrainHeight(x,z){ return Math.sin(x*.01)*3+Math.cos(z*.012)*2.5; }
 <script>
function box(w,h,d,material,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);m.position.set(x,y,z);scene.add(m);return m;}

function spawnLoot(x,z){
  const group=new THREE.Group();
  const gem=new THREE.Mesh(new THREE.OctahedronGeometry(.8,0),new THREE.MeshBasicMaterial({color:0xffc342}));
  gem.position.y=1.0;group.add(gem);
  group.position.set(x,terrainHeight(x,z),z);scene.add(group);
  lootDrops.push({mesh:group,active:true});
}

function buildMap(){
  const groundGeo=new THREE.PlaneGeometry(MAP,MAP,32,32);
  const ground=new THREE.Mesh(groundGeo,new THREE.MeshLambertMaterial({color:0x55aa33}));
  ground.rotation.x=-Math.PI/2;scene.add(ground);

  const colors=[0xff595e,0xffca3a,0x8ac926,0x1982c4,0x6a4c93];
  for(let i=-2;i<=2;i++){
    for(let j=-2;j<=2;j++){
      const x=i*35,z=j*35,w=14,d=14,h=15+Math.random()*20;
      const col=colors[Math.abs(i+j)%colors.length];
      box(w,h,d,mat(col),x,h/2,z);
      addBoxCollider(x,z,w+1,d+1);
      spawnLoot(x+(Math.random()-.5)*10,z+(Math.random()-.5)*10);
    }
  }
}

function buildBots(){
  for(let i=0;i<8;i++){
    const g=new THREE.Group();
    const body=new THREE.Mesh(new THREE.BoxGeometry(.8,1.2,.4),mat(0xd90429));body.position.y=1.1;g.add(body);
    const head=new THREE.Mesh(new THREE.BoxGeometry(.5,.5,.5),mat(0xffb703));head.position.y=1.9;g.add(head);
    let x=(Math.random()-.5)*300,z=(Math.random()-.5)*300;
    g.position.set(x,terrainHeight(x,z),z);scene.add(g);
    bots.push({mesh:g,hp:100,phase:Math.random()*5});
  }
}

function createAirAvatar(){
  if(airAvatar)scene.remove(airAvatar);
  airAvatar=new THREE.Group();
  const body=new THREE.Mesh(new THREE.BoxGeometry(1,1.2,.5),mat(0x3a86ff));body.position.y=1.5;airAvatar.add(body);
  const head=new THREE.Mesh(new THREE.BoxGeometry(.5,.5,.5),mat(0xffb703));head.position.y=2.3;airAvatar.add(head);
  scene.add(airAvatar);
}

function placeOrbitCamera(distance,targetHeight){
  const pitch=Math.max(-1.05,Math.min(1.05,player.pitch));
  const cp=Math.cos(pitch),sp=Math.sin(pitch);
  const sy=Math.sin(player.yaw),cy=Math.cos(player.yaw);
  const tx=player.x,ty=player.y+targetHeight,tz=player.z;
  camera.up.set(0,1,0);
  camera.position.set(tx+sy*cp*distance,ty-sp*distance,tz+cy*cp*distance);
  camera.lookAt(tx,ty,tz);
}

function init(){
  scene=new THREE.Scene();scene.background=new THREE.Color(0x38b6ff);
  camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,1000);scene.add(camera);
  renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.25));renderer.setSize(innerWidth,innerHeight);
  $('game').appendChild(renderer.domElement);clock=new THREE.Clock();

  scene.add(new THREE.AmbientLight(0xffffff,0.9));
  const sun=new THREE.DirectionalLight(0xffffff,0.8);sun.position.set(100,200,100);scene.add(sun);

  buildMap();
  buildBots();
  createAirAvatar();

  const pts=[new THREE.Vector3(FLIGHT_START.x,120,FLIGHT_START.z),new THREE.Vector3(FLIGHT_END.x,120,FLIGHT_END.z)];
  flightPath=new THREE.Line(pts,new THREE.LineBasicMaterial({color:0xff9100,linewidth:5}));
  scene.add(flightPath);
  airplane=new THREE.Mesh(new THREE.BoxGeometry(3,2,10),mat(0xffb703));
  airplane.position.set(FLIGHT_START.x,120,FLIGHT_START.z);scene.add(airplane);

  setupControls();
  window.addEventListener('resize',()=> {
    camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);
  });
  animate();
}

function setupControls(){
  $('startMatch').onclick=()=>{
    $('lobby').style.display='none';
    $('topbar').style.display='flex';
    $('crosshair').style.display='block';
    $('bagButton').style.display='block';
    $('matchInfo').style.display='flex';
    $('action').style.display='flex';
    state='plane';
  };
  $('mapButton').onclick=()=>{ mapOpen=true;$('mapPanel').style.display='block'; };
  $('mapClose').onclick=()=>{ mapOpen=false;$('mapPanel').style.display='none'; };

  $('action').onclick=()=>{
    if(state==='plane'){
      state='freefall';
      player.x=airplane.position.x;player.y=110;player.z=airplane.position.z;
      $('jumpInfo').textContent='QUEDA LIVRE';
      $('action').textContent='PARAQUEDAS';
    }else if(state==='freefall'){
      state='parachute';
      $('jumpInfo').textContent='PLANEIO';
      $('action').style.display='none';
      $('joystick').style.display='block';
      $('fire').style.display='flex';
      $('aim').style.display='flex';
      $('jump').style.display='flex';
    }
  };

  $('fire').onclick=()=>{
    let hitBot=null,minDist=Infinity;
    for(const b of bots){
      const d=Math.hypot(player.x-b.mesh.position.x,player.z-b.mesh.position.z);
      if(d<40&&d<minDist){minDist=d;hitBot=b;}
    }
    if(hitBot){
      hitBot.hp-=50;
      if(hitBot.hp<=0){
        hitBot.mesh.position.set(0,-100,0);
        player.kills++;$('kills').textContent=player.kills;
        $('message').textContent='INIMIGO ELIMINADO!';$('message').style.display='block';setTimeout(()=>$('message').style.display='none',1200);
      }
    }
  };

  $('aim').onclick=()=>{
    player.ads=!player.ads;
    $('aim').style.background=player.ads?'#3a86ff':'#ff8400';
  };

  let lookTouch=null,moveTouch=null,lastLook={x:0,y:0};
  const lookZone=$('lookZone'),moveZone=$('moveZone'),joystick=$('joystick'),stick=$('stick');
  
  lookZone.ontouchstart=e=>{const t=e.changedTouches[0];lookTouch=t.identifier;lastLook.x=t.clientX;lastLook.y=t.clientY;};
  lookZone.ontouchmove=e=>{
    for(const t of e.changedTouches){
      if(t.identifier===lookTouch){
        const dx=t.clientX-lastLook.x,dy=t.clientY-lastLook.y;
        lastLook.x=t.clientX;lastLook.y=t.clientY;
        player.yaw-=dx*0.005;
        player.pitch=Math.max(-1.1,Math.min(1.1,player.pitch+dy*0.005));
      }
    }
  };
  lookZone.ontouchend=e=>{for(const t of e.changedTouches){if(t.identifier===lookTouch)lookTouch=null;}};

  moveZone.ontouchstart=e=>{
    const t=e.changedTouches[0];moveTouch=t.identifier;
    const rect=moveZone.getBoundingClientRect();
    joystick.style.display='block';joystick.style.left=(t.clientX-rect.left-60)+'px';joystick.style.top=(t.clientY-rect.top-60)+'px';
    stick.style.left='34px';stick.style.top='34px';
    move.x=0;move.z=0;
  };
  moveZone.ontouchmove=e=>{
    for(const t of e.changedTouches){
      if(t.identifier===moveTouch){
        const rect=moveZone.getBoundingClientRect();
        const jx=parseFloat(joystick.style.left)+60,jy=parseFloat(joystick.style.top)+60;
        let dx=t.clientX-rect.left-jx,dy=t.clientY-rect.top-jy,dist=Math.hypot(dx,dy),maxR=45;
        if(dist>maxR){dx=(dx/dist)*maxR;dy=(dy/dist)*maxR;}
        stick.style.left=(34+dx)+'px';stick.style.top=(34+dy)+'px';
        move.x=dx/maxR;move.z=dy/maxR;
      }
    }
  };
  moveZone.ontouchend=e=>{for(const t of e.changedTouches){if(t.identifier===moveTouch){moveTouch=null;joystick.style.display='none';move.x=0;move.z=0;}}};
}

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(.1,clock.getDelta());

  if(state==='plane'){
    flightProgress+=dt*.05;if(flightProgress>1)flightProgress=0;
    airplane.position.lerpVectors(new THREE.Vector3(FLIGHT_START.x,120,FLIGHT_START.z),new THREE.Vector3(FLIGHT_END.x,120,FLIGHT_END.z),flightProgress);
    player.x=airplane.position.x;player.y=airplane.position.y;player.z=airplane.position.z;
    placeOrbitCamera(20,10);
  }else if(state==='freefall'||state==='parachute'){
    const spd=state==='freefall'?120:35;
    player.x+=Math.sin(player.yaw)*spd*dt;
    player.z+=Math.cos(player.yaw)*spd*dt;
    player.y-= (state==='freefall'?20:6)*dt;
    $('jumpInfo').textContent='ALTITUDE: '+Math.round(player.y)+'m';
    placeOrbitCamera(22,player.y);
    if(player.y<=0){player.y=0;state='ground';$('jumpInfo').style.display='none';$('speed').style.display='none';}
  }else if(state==='ground'){
    const spd=player.ads?4:7;
    const fwd=new THREE.Vector3(Math.sin(player.yaw),0,Math.cos(player.yaw));
    const right=new THREE.Vector3(Math.cos(player.yaw),0,-Math.sin(player.yaw));
    const dx=(-move.x*right.x+move.z*fwd.x)*spd*dt;
    const dz=(-move.x*right.z+move.z*fwd.z)*spd*dt;
    const resolved=resolveWorldCollision(player.x+dx,player.z+dz,0.8);
    player.x=resolved.x;player.z=resolved.z;
    player.y=0;

    placeOrbitCamera(player.ads?3.5:6.5,player.ads?2.0:2.5);

    let aimedAtEnemy=false;
    for(const b of bots){
      if(Math.hypot(player.x-b.mesh.position.x,player.z-b.mesh.position.z)<35){aimedAtEnemy=true;break;}
    }
    const cross=$('crosshair');
    if(aimedAtEnemy)cross.classList.add('locked');else cross.classList.remove('locked');
  }

  if(airAvatar){
    airAvatar.visible=(state!=='ground');
    airAvatar.position.set(player.x,player.y,player.z);
    airAvatar.rotation.y=player.yaw;
  }

  renderer.render(scene,camera);
}

window.onload=init;
})();
</script>
