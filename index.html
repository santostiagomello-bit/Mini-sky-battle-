<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VANGUARD: STRIKE - Tactical FPS</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #07090e; font-family: system-ui, -apple-system, sans-serif; color: #fff; }
        #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        /* MENU INICIAL COMPETITIVO */
        #menu-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 999;
            background: radial-gradient(circle at center, #111827 0%, #030712 100%);
            display: flex; justify-content: center; align-items: center;
            padding: 10px; overflow-y: auto;
        }
        .menu-card {
            background: rgba(17, 24, 39, 0.98); border: 1px solid rgba(59, 130, 246, 0.5);
            border-radius: 12px; padding: 15px; width: 100%; max-width: 480px; text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8); backdrop-filter: blur(12px);
        }
        h1 { font-size: 1.3rem; font-weight: 900; letter-spacing: 1px; color: #3b82f6; margin-bottom: 2px; text-transform: uppercase; }
        .subtitle { font-size: 0.65rem; color: #9ca3af; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
        
        .section-title { font-size: 0.7rem; font-weight: bold; color: #60a5fa; margin-bottom: 4px; text-align: left; text-transform: uppercase; }
        
        .options-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 10px; }
        .option-card {
            background: rgba(31, 41, 55, 0.9); border: 2px solid rgba(75, 85, 99, 0.5);
            border-radius: 6px; padding: 6px 4px; cursor: pointer;
        }
        .option-card.selected { border-color: #3b82f6; background: rgba(59, 130, 246, 0.3); }
        .option-card h3 { font-size: 0.75rem; color: #fff; margin-bottom: 1px; }
        .option-card span { font-size: 0.55rem; color: #9ca3af; }

        #start-btn {
            width: 100%; background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: white; border: none; padding: 12px; font-size: 0.95rem; font-weight: bold;
            border-radius: 6px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.5);
        }

        /* HUD DE JOGO */
        #hud { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none; display: none; }
        .hud-element { pointer-events: auto; }
        
        #crosshair {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 6px; height: 6px; border: 2px solid rgba(255,255,255,0.9); border-radius: 50%;
        }
        
        #top-bar {
            position: absolute; top: 10px; left: 15px; right: 15px; display: flex; justify-content: space-between; align-items: center;
        }
        .stat-box { background: rgba(0,0,0,0.7); border: 1px solid rgba(255,255,255,0.15); padding: 4px 10px; border-radius: 6px; font-weight: bold; font-size: 0.75rem; }
        
        #joystick-zone {
            position: absolute; bottom: 15px; left: 15px; width: 100px; height: 100px;
            background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.15); border-radius: 50%;
        }
        #joystick-knob {
            position: absolute; top: 25px; left: 25px; width: 50px; height: 50px;
            background: rgba(255,255,255,0.35); border-radius: 50%; pointer-events: none;
        }
        
        #action-buttons {
            position: absolute; bottom: 15px; right: 15px; display: flex; gap: 10px; align-items: flex-end;
        }
        .action-btn {
            width: 50px; height: 50px; background: rgba(0,0,0,0.6); border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%; color: white; font-weight: bold; font-size: 0.7rem; display: flex;
            align-items: center; justify-content: center;
        }
        #btn-fire { width: 70px; height: 70px; background: rgba(220, 38, 38, 0.7); border-color: #ef4444; font-size: 0.8rem; }
    </style>
    <!-- Three.js Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- MENU INICIAL -->
    <div id="menu-overlay">
        <div class="menu-card">
            <h1>VANGUARD: STRIKE</h1>
            <p class="subtitle">Arena Tática Competitiva 3D</p>
            
            <div class="section-title">Escolha sua Arma</div>
            <div class="options-grid" id="weapon-grid">
                <div class="option-card selected" onclick="selectWeapon('m4', this)">
                    <h3>M4A1</h3><span>Assalto</span>
                </div>
                <div class="option-card" onclick="selectWeapon('mp5', this)">
                    <h3>MP5-SD</h3><span>SMG</span>
                </div>
                <div class="option-card" onclick="selectWeapon('awp', this)">
                    <h3>AWP</h3><span>Sniper</span>
                </div>
            </div>

            <div class="section-title">Dificuldade dos Bots (IA)</div>
            <div class="options-grid" id="diff-grid">
                <div class="option-card" onclick="selectDifficulty('easy', this)">
                    <h3>Fácil</h3><span>Básico</span>
                </div>
                <div class="option-card selected" onclick="selectDifficulty('normal', this)">
                    <h3>Normal</h3><span>Tático</span>
                </div>
                <div class="option-card" onclick="selectDifficulty('hard', this)">
                    <h3>Difícil</h3><span>Avançado</span>
                </div>
            </div>

            <button id="start-btn" ontouchstart="startGame()" onclick="startGame()">▶ INICIAR PARTIDA</button>
        </div>
    </div>

    <!-- HUD -->
    <div id="hud">
        <div id="crosshair"></div>
        <div id="top-bar">
            <div class="stat-box" id="hp-display">HP: 100</div>
            <div class="stat-box" id="ammo-display">MUNIÇÃO: 30/90</div>
            <div class="stat-box" id="kills-display">ALVOS: 0</div>
        </div>
        
        <div id="joystick-zone" class="hud-element">
            <div id="joystick-knob"></div>
        </div>
        
        <div id="action-buttons">
            <div class="action-btn hud-element" onclick="reloadWeapon()">REC</div>
            <div class="action-btn hud-element" onclick="playerJump()">PUL</div>
            <div class="action-btn hud-element" id="btn-fire" ontouchstart="shootWeapon()" onmousedown="shootWeapon()">FOGO</div>
        </div>
    </div>

    <script>
        let scene, camera, renderer, clock;
        let player = {
            pos: new THREE.Vector3(0, 1.7, 22),
            dir: new THREE.Vector3(0, 0, -1),
            speed: 0.085,
            hp: 100,
            ammo: 30,
            maxAmmo: 90,
            isJumping: false,
            vy: 0
        };
        let selectedWeapon = 'm4';
        let botDifficulty = 'normal';
        let gameStarted = false;
        let bots = [];
        let obstacles = [];
        let kills = 0;

        function selectWeapon(type, el) {
            selectedWeapon = type;
            document.querySelectorAll('#weapon-grid .option-card').forEach(o => o.classList.remove('selected'));
            el.classList.add('selected');
            if(type === 'awp') { player.ammo = 10; player.maxAmmo = 30; }
            else if(type === 'mp5') { player.ammo = 30; player.maxAmmo = 120; }
            else { player.ammo = 30; player.maxAmmo = 90; }
        }

        function selectDifficulty(diff, el) {
            botDifficulty = diff;
            document.querySelectorAll('#diff-grid .option-card').forEach(o => o.classList.remove('selected'));
            el.classList.add('selected');
        }

        function startGame() {
            if (gameStarted) return;
            gameStarted = true;

            const menu = document.getElementById('menu-overlay');
            if (menu) menu.style.display = 'none';
            
            const hud = document.getElementById('hud');
            if (hud) hud.style.display = 'block';
            
            initMap();
            animate();
        }

        function initMap() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x07090e);
            scene.fog = new THREE.FogExp2(0x07090e, 0.012);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.copy(player.pos);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            clock = new THREE.Clock();

            const ambientLight = new THREE.AmbientLight(0xdbeafe, 0.45);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xffedd5, 0.85);
            sunLight.position.set(30, 50, 20);
            sunLight.castShadow = true;
            scene.add(sunLight);

            const floorGeo = new THREE.PlaneGeometry(120, 120);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.85 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            const wallMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.6 });
            
            function addObstacle(x, y, z, w, h, d) {
                const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
                mesh.position.set(x, y + h/2, z);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                scene.add(mesh);
                obstacles.push({ minX: x - w/2, maxX: x + w/2, minZ: z - d/2, maxZ: z + d/2 });
            }

            addObstacle(0, 0, 0, 6, 4, 6);
            addObstacle(-15, 0, -10, 8, 3, 4);
            addObstacle(15, 0, -10, 4, 3, 8);
            addObstacle(-25, 0, 10, 5, 5, 5);
            addObstacle(25, 0, 10, 5, 5, 5);
            addObstacle(0, 0, -25, 20, 4, 3);

            let botCount = botDifficulty === 'easy' ? 4 : botDifficulty === 'normal' ? 6 : 8;
            for (let i = 0; i < botCount; i++) {
                createBot();
            }

            let isDragging = false;
            let prevX = 0, prevY = 0;
            let yaw = 0, pitch = 0;

            window.addEventListener('touchstart', (e) => {
                if (e.touches[0].clientX > window.innerWidth / 2) {
                    isDragging = true;
                    prevX = e.touches[0].clientX;
                    prevY = e.touches[0].clientY;
                }
            });

            window.addEventListener('touchmove', (e) => {
                if (!isDragging) return;
                let clientX = e.touches[0].clientX;
                let clientY = e.touches[0].clientY;
                if (clientX > window.innerWidth / 2) {
                    let dx = clientX - prevX;
                    let dy = clientY - prevY;
                    yaw -= dx * 0.003;
                    pitch -= dy * 0.003;
                    pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));

                    let qY = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
                    let qX = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), pitch);
                    camera.quaternion.multiplyQuaternions(qY, qX);

                    prevX = clientX;
                    prevY = clientY;
                }
            });

            window.addEventListener('touchend', () => { isDragging = false; });

            let joystickActive = false;
            let moveVector = { x: 0, z: 0 };
            const joyZone = document.getElementById('joystick-zone');
            const joyKnob = document.getElementById('joystick-knob');

            joyZone.addEventListener('touchstart', () => { joystickActive = true; });
            window.addEventListener('touchmove', (e) => {
                if (!joystickActive) return;
                let touch = e.touches[0];
                let rect = joyZone.getBoundingClientRect();
                let cx = rect.left + rect.width / 2;
                let cy = rect.top + rect.height / 2;
                let dx = touch.clientX - cx;
                let dy = touch.clientY - cy;
                let dist = Math.hypot(dx, dy);
                let maxDist = 35;
                if (dist > maxDist) { dx = (dx / dist) * maxDist; dy = (dy / dist) * maxDist; }
                joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;
                moveVector.x = dx / maxDist;
                moveVector.z = dy / maxDist;
            });
            window.addEventListener('touchend', () => {
                joystickActive = false;
                joyKnob.style.transform = `translate(0px, 0px)`;
                moveVector.x = 0; moveVector.z = 0;
            });

            window.playerMove = moveVector;
        }

        function createBot() {
            const botGeo = new THREE.CapsuleGeometry(0.4, 1.2, 4, 8);
            let botColor = botDifficulty === 'easy' ? 0xf59e0b : botDifficulty === 'normal' ? 0xef4444 : 0x9333ea;
            const botMat = new THREE.MeshStandardMaterial({ color: botColor });
            const bot = new THREE.Mesh(botGeo, botMat);
            
            bot.position.set((Math.random() - 0.5) * 45, 1, -20 - Math.random() * 15);
            bot.castShadow = true;
            
            let speed = botDifficulty === 'easy' ? 0.025 : botDifficulty === 'normal' ? 0.04 : 0.055;
            let hp = botDifficulty === 'easy' ? 80 : botDifficulty === 'normal' ? 100 : 130;
            bot.userData = { hp: hp, speed: speed };
            
            scene.add(bot);
            bots.push(bot);
        }

        function checkCollision(nextPos) {
            for (let obs of obstacles) {
                if (nextPos.x > obs.minX - 0.5 && nextPos.x < obs.maxX + 0.5 &&
                    nextPos.z > obs.minZ - 0.5 && nextPos.z < obs.maxZ + 0.5) {
                    return true;
                }
            }
            return false;
        }

        function shootWeapon() {
            if (player.ammo <= 0) return;
            player.ammo--;
            document.getElementById('ammo-display').innerText = `MUNIÇÃO: ${player.ammo}/${player.maxAmmo}`;

            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            let intersects = raycaster.intersectObjects(bots);

            if (intersects.length > 0) {
                let hitBot = intersects.object;
                let damage = selectedWeapon === 'awp' ? 120 : selectedWeapon === 'm4' ? 35 : 20;
                hitBot.userData.hp -= damage;
                
                if (hitBot.userData.hp <= 0) {
                    scene.remove(hitBot);
                    bots = bots.filter(b => b !== hitBot);
                    kills++;
                    document.getElementById('kills-display').innerText = `ALVOS: ${kills}`;
                    setTimeout(() => createBot(), 1500);
                }
            }
        }

        function reloadWeapon() {
            player.ammo = player.maxAmmo;
            document.getElementById('ammo-display').innerText = `MUNIÇÃO: ${player.ammo}/${player.maxAmmo}`;
        }

        function playerJump() {
            if (!player.isJumping) {
                player.isJumping = true;
                player.vy = 0.12;
            }
        }

        function animate() {
            if (!gameStarted) return;
            requestAnimationFrame(animate);

            if (window.playerMove && (window.playerMove.x !== 0 || window.playerMove.z !== 0)) {
                let forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
                forward.y = 0; forward.normalize();
                let right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
                right.y = 0; right.normalize();

                let moveDir = new THREE.Vector3();
                moveDir.addScaledVector(forward, -window.playerMove.z);
                moveDir.addScaledVector(right, window.playerMove.x);
                moveDir.normalize();

                let nextPos = player.pos.clone().addScaledVector(moveDir, player.speed);
                if (!checkCollision(nextPos)) {
                    player.pos.copy(nextPos);
                }
            }

            if (player.isJumping) {
                player.pos.y += player.vy;
                player.vy -= 0.008;
                if (player.pos.y <= 1.7) {
                    player.pos.y = 1.7;
                    player.isJumping = false;
                }
            }
            camera.position.copy(player.pos);

            bots.forEach(bot => {
                bot.lookAt(player.pos.x, bot.position.y, player.pos.z);
                let distToPlayer = bot.position.distanceTo(player.pos);
                if (distToPlayer > 3) {
                    bot.translateZ(bot.userData.speed);
                }

                if (distToPlayer < 2.2 && Math.random() < 0.03) {
                    let botDamage = botDifficulty === 'easy' ? 5 : botDifficulty === 'normal' ? 10 : 18;
                    player.hp -= botDamage;
                    document.getElementById('hp-display').innerText = `HP: ${Math.max(0, player.hp)}`;
                    if (player.hp <= 0) {
                        alert('Missão Falhou! Você foi eliminado.');
                        window.location.reload();
                    }
                }
            });

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            if (!gameStarted) return;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
