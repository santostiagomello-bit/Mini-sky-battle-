<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Free Fire - First Person & Ultra Blinded</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030712;color:#fff;font-family:'Segoe UI',Arial,sans-serif;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:1}

/* Lobby */
#lobby{position:fixed;inset:0;z-index:9999;background:radial-gradient(circle at center, #1e293b 0%, #090d16 100%);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:25px}
.lobby-header{font-size:clamp(20px, 4vw, 34px);font-weight:900;color:#facc15;text-shadow:3px 3px 0 #b91c1c;letter-spacing:2px;margin-top:10px;text-align:center}
.char-container{display:flex;gap:12px;margin:10px 0}
.char-card{padding:12px 20px;background:rgba(255,255,255,0.08);border:2px solid #facc15;border-radius:12px;font-weight:bold;font-size:15px;cursor:pointer}
.char-card.active{background:#facc15;color:#000;box-shadow:0 0 15px rgba(250,204,21,0.6)}

.settings-panel{background:rgba(15,23,42,0.85);border:2px solid rgba(250,204,21,0.4);padding:15px 20px;border-radius:14px;width:100%;max-width:320px;display:flex;flex-direction:column;gap:10px}
.settings-panel label{font-size:13px;font-weight:bold;color:#facc15;display:flex;justify-content:space-between}
.settings-panel input[type=range]{width:100%;accent-color:#facc15;cursor:pointer}

#playButton{width:100%;max-width:300px;padding:16px;border:none;border-radius:14px;background:linear-gradient(180deg,#f97316,#b91c1c);color:#fff;font-size:22px;font-weight:900;box-shadow:0 6px 0 #7f1d1d;cursor:pointer;text-transform:uppercase;letter-spacing:1px;pointer-events:auto;}
#playButton:active{transform:translateY(4px);box-shadow:0 2px 0 #7f1d1d}

/* Mensagem de Erro Blindada */
#errorMsg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(15,23,42,0.95);border:2px solid #ef4444;padding:20px;border-radius:10px;color:#fff;text-align:center;display:none;z-index:99999;max-width:85%}

/* HUD */
#gameHUD{display:none;position:fixed;inset:0;z-index:50;pointer-events:none}
#topBar{position:absolute;top:15px;left:15px;display:flex;gap:8px;pointer-events:auto}
.badge{background:rgba(0,0,0,0.65);border:1px solid rgba(255,255,255,0.2);padding:6px 12px;border-radius:6px;font-size:12px;font-weight:bold}
#killCount{color:#ef4444}
#aliveCount{color:#facc15}

/* Minimapa */
#minimap{position:absolute;top:15px;right:15px;width:95px;height:95px;border-radius:50%;background:rgba(15,23,42,0.8);border:2px solid #facc15;overflow:hidden;pointer-events:auto;box-shadow:0 4px 10px rgba(0,0,0,0.5)}
#minimapPlayer{position:absolute;top:50%;left:50%;width:8px;height:8px;margin:-4px;background:#3b82f6;border-radius:50%;border:1px solid #fff}

/* Joystick */
#joystick{position:absolute;bottom:35px;left:35px;width:125px;height:125px;border:2px solid rgba(255,255,255,0.25);border-radius:50%;background:rgba(0,0,0,0.25);pointer-events:auto;touch-action:none}
#stick{position:absolute;left:50%;top:50%;width:55px;height:55px;margin:-27px;border:2px solid #fff;border-radius:50%;background:rgba(255,255,255,0.65);box-shadow:0 2px 5px rgba(0,0,0,0.3)}

/* Área de Toque Direita para Câmera Livre 360° */
#cameraTouchArea{position:absolute;right:0;top:0;width:55%;height:100%;pointer-events:auto;z-index:40}

/* Botão de Atirar (Com Drag Headshot) */
#fireButton{position:absolute;right:40px;bottom:30px;width:95px;height:95px;border:4px solid #ef4444;border-radius:50%;background:rgba(239,68,68,0.5);pointer-events:auto;box-shadow:0 4px 15px rgba(0,0,0,0.5);z-index:45;touch-action:none;display:flex;align-items:center;justify-content:center}
.fire-inner{width:35px;height:35px;background:#fff;border-radius:50%;opacity:0.8}

#aimButton{position:absolute;right:155px;bottom:130px;width:60px;height:60px;border:2px solid #fff;border-radius:50%;background:rgba(0,0,0,0.5);pointer-events:auto;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:11px;z-index:45}
#sprintButton{position:absolute;right:155px;bottom:45px;width:60px;height:60px;border:2px solid #facc15;border-radius:50%;background:rgba(234,179,8,0.4);pointer-events:auto;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:11px;z-index:45}
#jumpButtonHud{position:absolute;right:65px;bottom:145px;width:65px;height:65px;border:2px solid #38bdf8;border-radius:50%;background:rgba(56,189,248,0.4);pointer-events:auto;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:11px;z-index:45}

/* Mira Centralizada de FPS */
#crosshair{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:16px;height:16px;border:2px solid rgba(255,255,255,0.85);border-radius:50%;pointer-events:none;z-index:45;display:flex;align-items:center;justify-content:center;box-shadow:0 0 4px rgba(0,0,0,0.5)}
.cross-dot{width:2px;height:2px;background:#fff;border-radius:50%}

/* Avião */
#planeOverlay{position:fixed;inset:0;z-index:999;display:none;pointer-events:none}
#planeNotice{position:absolute;top:18%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.85);border:2px solid #facc15;padding:10px 24px;border-radius:20px;font-weight:bold;font-size:15px;letter-spacing:1px}
#jumpButtonPlane{position:absolute;left:50%;top:28%;transform:translateX(-50%);padding:14px 34px;background:linear-gradient(180deg,#facc15,#f97316);border:none;border-radius:14px;color:#000;font-size:18px;font-weight:900;pointer-events:auto;z-index:1000;box-shadow:0 6px 0 #b45309}
#jumpButtonPlane:active{transform:translateX(-50%) translateY(4px);box-shadow:0 2px 0 #b45309}
</style>
</head>
<body>

<div id="lobby">
  <div class="lobby-header">🔥 FREE FIRE - FIRST PERSON 🔥</div>
  
  <div class="char-container">
    <div class="char-card active">ALOK</div>
    <div class="char-card">KELLY</div>
    <div class="char-card">MOCO</div>
  </div>

  <div class="settings-panel">
    <label>SENSIBILIDADE GERAL: <span id="sensVal">50</span>%</label>
    <input type="range" id="sensRange" min="1" max="100" value="50">
  </div>

  <button id="playButton">INICIAR PARTIDA</button>
</div>

<div id="errorMsg">
  <h3>⚠️ Erro de Inicialização Gráfica</h3>
  <p>Não foi possível carregar o motor gráfico no seu navegador. Tente abrir em aba anônima.</p>
</div>

<div id="gameHUD">
  <div id="topBar">
    <div class="badge">VIVOS: <span id="aliveCount">50</span></div>
    <div class="badge">KILLS: <span id="killCount">0</span></div>
  </div>
  <div id="minimap"><div id="minimapPlayer"></div></div>
  <div id="joystick"><div id="stick"></div></div>
  <div id="cameraTouchArea"></div>
  
  <div id="crosshair"><div class="cross-dot"></div></div>

  <div id="sprintButton">CORRER</div>
  <div id="aimButton">MIRA</div>
  <div id="jumpButtonHud">PULAR</div>
  <button id="fireButton"><div class="fire-inner"></div></button>
</div>

<div id="planeOverlay">
  <div id="planeNotice">✈️ ROTA DO AVIÃO — MAPA BERMUDA</div>
  <button id="jumpButtonPlane">SALTAR</button>
</div>

<script type="module">
let THREE;
try {
  THREE = await import("https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.js");
} catch(e1) {
  try {
    THREE = await import("https://unpkg.com/three@0.128.0/build/three.module.js");
  } catch(e2) {
    document.getElementById("errorMsg").style.display = "block";
    throw new Error("Falha crítica ao carregar a biblioteca Three.js");
  }
}

let sensitivity = 50;
const sensRange = document.getElementById("sensRange");
const sensVal = document.getElementById("sensVal");

sensRange.addEventListener("input", (e) => {
  sensitivity = parseInt(e.target.value);
  sensVal.innerText = sensitivity;
});

let scene, camera, renderer;
let world, player, plane, weaponGroup;
let bots = [];
let bullets = [];
let gameStarted = false;
let phase = "lobby"; 
let planeTime = 0, moveX = 0, moveY = 0, diveY = 60;
let cameraAngleY = 0, cameraAngleX = 0;
let isAiming = false, isSprinting = false;
let killCount = 0, aliveCount = 50;

function initEngine() {
  try {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x60a5fa);
    scene.fog = new THREE.Fog(0x60a5fa, 80, 280);

    // FOV Aberto para Primeira Pessoa
    camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 400);
    
    renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance", failIfMajorPerformanceCaveat: false });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    document.body.appendChild(renderer.domElement);

    window.addEventListener('resize', () => {
      if(!camera || !renderer) return;
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    scene.add(new THREE.HemisphereLight(0xffffff, 0x334155, 1.5));
    const sun = new THREE.DirectionalLight(0xfffaed, 1.7);
    sun.position.set(60, 100, 60);
    scene.add(sun);

    const mat = (c) => new THREE.MeshBasicMaterial({ color: c });
    world = new THREE.Group();
    scene.add(world);

    const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), mat(0x22c55e));
    ground.rotation.x = -Math.PI / 2;
    world.add(ground);

    function makeBuilding(x, z, w, h, d, color) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(color));
      m.position.set(x, h/2, z);
      world.add(m);
    }
    makeBuilding(-35, -35, 12, 7, 12, 0x475569);
    makeBuilding(35, 35, 10, 9, 10, 0x991b1b);
    makeBuilding(-40, 35, 14, 5, 14, 0x334155);
    makeBuilding(35, -35, 10, 6, 10, 0x0f172a);

    player = new THREE.Group();
    player.position.set(0, 0, 0);
    scene.add(player);

    // Criação da Arma e Mão em Primeira Pessoa (fixada na câmera)
    weaponGroup = new THREE.Group();
    const gunBody = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.15, 0.9), mat(0x1e293b));
    gunBody.position.set(0.3, -0.25, -0.5);
    weaponGroup.add(gunBody);

    const gunBarrel = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.6), mat(0x0f172a));
    gunBarrel.rotation.x = Math.PI / 2;
    gunBarrel.position.set(0.3, -0.23, -0.9);
    weaponGroup.add(gunBarrel);

    camera.add(weaponGroup);
    scene.add(camera);

    plane = new THREE.Mesh(new THREE.BoxGeometry(8, 2.2, 3), mat(0x334155));
    plane.visible = false;
    scene.add(plane);

    for(let i = 0; i < 6; i++) {
      const bGroup = new THREE.Group();
      const bTorso = new THREE.Mesh(new THREE.BoxGeometry(0.75, 1.1, 0.45), mat(0xdc2626));
      bTorso.position.y = 0.55; bGroup.add(bTorso);
      const bHead = new THREE.Mesh(new THREE.SphereGeometry(0.35, 16, 16), mat(0xfde047));
      bHead.position.y = 1.35; bGroup.add(bHead);
      
      bGroup.position.set((Math.random() - 0.5) * 120, 0, (Math.random() - 0.5) * 120);
      scene.add(bGroup);
      bots.push({ group: bGroup, speed: 0.14, isHeadshot: false });
    }
  } catch(err) {
    console.error("Erro ao iniciar WebGL:", err);
    document.getElementById("errorMsg").style.display = "block";
  }
}

// Joystick
const joystick = document.getElementById("joystick"), stick = document.getElementById("stick");
let joyId = null, joyCenter = { x: 0, y: 0 };

joystick.addEventListener("pointerdown", e => {
  joyId = e.pointerId;
  const r = joystick.getBoundingClientRect();
  joyCenter = { x: r.left + r.width/2, y: r.top + r.height/2 };
  updateJoy(e);
  joystick.setPointerCapture(joyId);
});
joystick.addEventListener("pointermove", e => { if(e.pointerId === joyId) updateJoy(e); });
joystick.addEventListener("pointerup", e => {
  if(e.pointerId === joyId) {
    joyId = null; moveX = 0; moveY = 0;
    stick.style.transform = `translate(0px, 0px)`;
  }
});

function updateJoy(e) {
  const dx = e.clientX - joyCenter.x, dy = e.clientY - joyCenter.y;
  const dist = Math.hypot(dx, dy), maxR = 40;
  const nx = dist > maxR ? (dx/dist) * maxR : dx;
  const ny = dist > maxR ? (dy/dist) * maxR : dy;
  stick.style.transform = `translate(${nx}px, ${ny}px)`;
  moveX = nx / maxR; moveY = ny / maxR;
}

function getSensMultiplier() {
  return (sensitivity / 50) * 0.0035;
}

// Câmera Direita (Visão FPS)
const cameraArea = document.getElementById("cameraTouchArea");
let camTouchId = null, lastCamX = 0, lastCamY = 0;

cameraArea.addEventListener("pointerdown", e => {
  camTouchId = e.pointerId;
  lastCamX = e.clientX;
  lastCamY = e.clientY;
  cameraArea.setPointerCapture(camTouchId);
});
cameraArea.addEventListener("pointermove", e => {
  if(e.pointerId === camTouchId) {
    let deltaX = e.clientX - lastCamX;
    let deltaY = e.clientY - lastCamY;
    const sensFactor = getSensMultiplier();
    cameraAngleY -= deltaX * sensFactor;
    cameraAngleX = Math.max(-1.2, Math.min(1.2, cameraAngleX - (deltaY * sensFactor)));
    lastCamX = e.clientX;
    lastCamY = e.clientY;
  }
});
cameraArea.addEventListener("pointerup", e => { if(e.pointerId === camTouchId) camTouchId = null; });

// Sistema Drag Headshot (Primeira Pessoa)
const fireBtn = document.getElementById("fireButton");
let fireTouchId = null, fireStartX = 0, fireStartY = 0, totalDragY = 0;

fireBtn.addEventListener("pointerdown", e => {
  fireTouchId = e.pointerId;
  fireStartX = e.clientX;
  fireStartY = e.clientY;
  totalDragY = 0;
  fireBtn.setPointerCapture(fireTouchId);
  fireAction();
});

fireBtn.addEventListener("pointermove", e => {
  if(e.pointerId === fireTouchId) {
    const moveX = e.clientX - fireStartX;
    const moveY = e.clientY - fireStartY;
    totalDragY += moveY;

    const sensFactor = getSensMultiplier();
    cameraAngleY -= moveX * sensFactor * 0.8;
    cameraAngleX = Math.max(-1.2, Math.min(1.2, cameraAngleX - (moveY * sensFactor * 1.8)));

    fireStartX = e.clientX;
    fireStartY = e.clientY;
  }
});

fireBtn.addEventListener("pointerup", e => {
  if(e.pointerId === fireTouchId) {
    if (totalDragY < -15) {
      bots.forEach(bot => {
        if(player.position.distanceTo(bot.group.position) < 25) {
          bot.isHeadshot = true;
        }
      });
    }
    fireTouchId = null;
  }
});

function fireAction() {
  if(phase !== "ground") return;
  const mat = (c) => new THREE.MeshBasicMaterial({ color: c });
  const bMesh = new THREE.Mesh(new THREE.SphereGeometry(0.22), mat(0xfacc15));
  bMesh.position.set(player.position.x, player.position.y + 1.6, player.position.z);
  scene.add(bMesh);

  const dirX = Math.sin(cameraAngleY);
  const dirZ = Math.cos(cameraAngleY);
  bullets.push({ mesh: bMesh, dx: -dirX, dz: -dirZ, life: 50 });
}

const sprintBtn = document.getElementById("sprintButton");
sprintBtn.addEventListener("click", () => {
  isSprinting = !isSprinting;
  sprintBtn.style.background = isSprinting ? "rgba(234,179,8,0.85)" : "rgba(234,179,8,0.4)";
});

const aimButton = document.getElementById("aimButton");
aimButton.addEventListener("click", () => {
  isAiming = !isAiming;
  aimButton.style.background = isAiming ? "rgba(250,204,21,0.85)" : "rgba(0,0,0,0.5)";
  document.getElementById("crosshair").style.transform = isAiming ? "translate(-50%, -50%) scale(1.6)" : "translate(-50%, -50%) scale(1)";
});

// Transição Segura
const startGame = (e) => {
  if(e) e.stopPropagation();
  if(!scene) { initEngine(); }
  document.getElementById("lobby").style
