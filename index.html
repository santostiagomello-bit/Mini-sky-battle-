<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tactical Desert - Skydiving Battle Royale</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #c2b280; font-family: sans-serif; color: #fff; }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; display: block; }
        
        /* HUD Geral */
        #hud { position: absolute; top: 0; left: 0; width: 100%; z-index: 5; pointer-events: none; display: none; justify-content: space-between; padding: 15px; }
        .panel { background: rgba(45, 35, 25, 0.85); border: 2px solid #ff6600; padding: 8px 14px; border-radius: 6px; font-size: 13px; font-weight: bold; color: #ffdfba; }

        /* HUD Específico do Salto (Avião / Queda / Paraquedas) */
        #skydive-hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 8; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 25px; }
        .skydive-info { background: rgba(0,0,0,0.6); border: 1px solid #ff6600; padding: 10px 18px; border-radius: 8px; font-size: 15px; font-weight: bold; text-align: center; width: 220px; margin: 0 auto; color: #fff; }
        
        /* Mira Estilo FF */
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 22px; height: 22px; z-index: 4; pointer-events: none; display: none; }
        .cross-line { position: absolute; background: #ffffff; box-shadow: 0 0 4px rgba(0,0,0,0.9); transition: background 0.1s; }
        #c-top { top: 0; left: 10px; width: 2px; height: 8px; }
        #c-bottom { bottom: 0; left: 10px; width: 2px; height: 8px; }
        #c-left { top: 10px; left: 0; width: 8px; height: 2px; }
        #c-right { top: 10px; right: 0; width: 8px; height: 2px; }
        #crosshair.locked .cross-line { background: #ff1e1e; box-shadow: 0 0 8px #ff1e1e; }

        /* Controles Mobile */
        #controls { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        .zone-left { position: absolute; bottom: 0; left: 0; width: 50%; height: 100%; pointer-events: auto; }
        .zone-right { position: absolute; bottom: 0; right: 0; width: 50%; height: 100%; pointer-events: auto; }

        #joystick { position: absolute; bottom: 40px; left: 40px; width: 100px; height: 100px; background: rgba(255,255,255,0.15); border: 2px solid #ff6600; border-radius: 50%; display: none; }
        #stick { position: absolute; top: 25px; left: 25px; width: 50px; height: 50px; background: #ff6600; border-radius: 50%; }

        .btn-action { position: absolute; border-radius: 50%; color: #fff; font-weight: bold; display: flex; align-items: center; justify-content: center; pointer-events: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.4); text-transform: uppercase; }
        #btn-jump { right: 40px; bottom: 40px; width: 95px; height: 95px; background: rgba(255, 130, 0, 0.7); border: 4px solid #ffaa00; font-size: 16px; z-index: 12; }
        #btn-fire { right: 30px; bottom: 35px; width: 78px; height: 78px; background: rgba(255, 50, 50, 0.5); border: 3px solid #ff3333; font-size: 13px; display: none; }
        #btn-ads { right: 120px; bottom: 45px; width: 58px; height: 58px; background: rgba(255, 102, 0, 0.45); border: 2px solid #ff6600; font-size: 11px; display: none; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>
    
    <div id="crosshair">
        <div id="c-top" class="cross-line"></div>
        <div id="c-bottom" class="cross-line"></div>
        <div id="c-left" class="cross-line"></div>
        <div id="c-right" class="cross-line"></div>
    </div>

    <!-- HUD em Jogo (Tiro) -->
    <div id="hud" style="display:none;">
        <div class="panel">HP: <span id="hp">100</span></div>
        <div class="panel">ABATES: <span id="kills">0</span></div>
    </div>

    <!-- HUD do Salto de Paraquedas -->
    <div id="skydive-hud">
        <div class="skydive-info" id="altitude-display">ALTITUDE: 500m</div>
        <div style="text-align: center; width: 100%;">
            <div id="speed-display" style="font-size: 14px; color: #ffaa00; font-weight: bold; margin-bottom: 10px;">VELOCIDADE: 180 km/h</div>
        </div>
    </div>

    <div id="controls">
        <div id="zone-left" class="zone-left">
            <div id="joystick"><div id="stick"></div></div>
        </div>
        <div id="zone-right" class="zone-right">
            <div id="btn-jump" class="btn-action">SALTAR</div>
            <div id="btn-fire" class="btn-action">ATIRAR</div>
            <div id="btn-ads" class="btn-action">MIRA</div>
        </div>
    </div>

    <script>
        let scene, camera, renderer;
        let bots = [];
        let moveDir = { x: 0, z: 0 };
        let lockedTarget = null;
        let playerArms, weaponMesh;
        let walkTime = 0;

        // Estados do Battle Royale (0: No Avião, 1: Queda Livre, 2: De Paraquedas, 3: Combate em Solo)
        let gameState = 0; 
        
        // Dados do Jogador no Salto
        let skydivePlayer = {
            x: 0, y: 150, z: 0,
            speedY: 0,
            horizontalSpeed: 0.6,
            rotY: 0,
            hp: 100,
            kills: 0,
            isADS: false
        };

        // Avião de Transporte
        let transportPlane;

        window.addEventListener('DOMContentLoaded', () => {
            try {
                initGame();
            } catch (err) {
                console.error("Erro ao iniciar jogo:", err);
            }
        });

        function initGame() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xd4bc8e);
            scene.fog = new THREE.FogExp2(0xd4bc8e, 0.012);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            scene.add(camera);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            
            const container = document.getElementById('canvas-container');
            container.appendChild(renderer.domElement);

            // Luzes
            scene.add(new THREE.AmbientLight(0xffeedd, 0.8));
