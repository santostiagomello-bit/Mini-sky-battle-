
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>MINI SKY BATTLE</title>

<style>
*{
 box-sizing:border-box;
 touch-action:manipulation;
}
html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
 font-family:Arial,sans-serif;
 background:#101522;
 color:white;
}
button{cursor:pointer}

/* LOBBY */
#lobby{
 position:fixed;
 inset:0;
 overflow:hidden;
 background:
 radial-gradient(ellipse at 60% 55%,#49516b 0%,transparent 48%),
 linear-gradient(115deg,#101827,#28334a 60%,#111725);
}
#lobby:before{
 content:"";
 position:absolute;
 inset:0;
 background:linear-gradient(90deg,#101827dd 0%,transparent 75%);
}
.logo{
 position:absolute;
 top:7%;
 left:5%;
 z-index:3;
 font-size:clamp(23px,4vw,43px);
 font-weight:1000;
 letter-spacing:2px;
 text-shadow:0 0 15px #8e4cff;
}
.logo span{color:#ae79ff}
.subtitle{
 position:absolute;
 top:17%;
 left:5%;
 z-index:3;
 font-size:clamp(9px,1.5vw,14px);
 letter-spacing:3px;
 color:#c4c8d5;
}
#play{
 position:absolute;
 z-index:5;
 top:5%;
 left:5%;
 margin-top:65px;
 padding:14px 35px;
 border:2px solid #d6baff;
 border-radius:7px;
 background:linear-gradient(100deg,#7138cf,#a34bff);
 color:white;
 font-size:17px;
 font-weight:bold;
 box-shadow:0 0 22px #8d43ff88;
}
#play:active{transform:scale(.95)}

#character{
 position:absolute;
 z-index:2;
 left:52%;
 bottom:-5%;
 width:clamp(180px,32vw,330px);
 height:88%;
 transform:translateX(-50%);
 filter:drop-shadow(0 0 20px #9b4dff33);
}
.glow{
 position:absolute;
 bottom:0;
 left:-25%;
 width:150%;
 height:30%;
 background:radial-gradient(ellipse,#9b4dff55,transparent 70%);
}
.body{
 position:absolute;
 left:16%;
 bottom:0;
 width:68%;
 height:65%;
 border-radius:35% 35% 12% 12%;
 background:linear-gradient(100deg,#10111a,#292636,#10111a);
 border:3px solid #393046;
}
.body:after{
 content:"";
 position:absolute;
 top:25%;
 left:-9%;
 width:118%;
 height:12%;
 background:#171521;
 border:2px solid #8b43ed;
 border-radius:14px;
 box-shadow:0 0 12px #9d4cff;
}
.head{
 position:absolute;
 z-index:3;
 left:24%;
 top:7%;
 width:52%;
 height:34%;
 border-radius:48% 48% 42% 42%;
 background:#17151f;
 border:4px solid #8e43ef;
 box-shadow:0 0 20px #8e43ef;
}
.hood{
 position:absolute;
 z-index:2;
 left:15%;
 top:0;
 width:70%;
 height:40%;
 border:9px solid #292131;
 border-radius:50% 50% 35% 35%;
}
.face{
 position:absolute;
 z-index:4;
 left:12%;
 top:48%;
 width:76%;
 height:20%;
 border-radius:50%;
 background:linear-gradient(90deg,#6e31bd,#d0a4ff,#6e31bd);
 box-shadow:0 0 14px #a95aff;
}
.arm{
 position:absolute;
 top:42%;
 width:25%;
 height:42%;
 background:#17151f;
 border:3px solid #55406d;
 border-radius:30px;
}
.arm.left{left:0;transform:rotate(12deg)}
.arm.right{right:0;transform:rotate(-12deg)}
.leg{
 position:absolute;
 bottom:-2%;
 width:29%;
 height:31%;
 background:#17151f;
 border:3px solid #44334f;
 border-radius:10px;
}
.leg.left{left:18%}
.leg.right{right:18%}
.stripe{
 position:absolute;
 z-index:5;
 left:15%;
 top:46%;
 width:70%;
 height:5px;
 background:#a64cff;
 box-shadow:0 0 12px #a64cff;
}
.info{
 position:absolute;
 z-index:3;
 right:6%;
 bottom:17%;
 width:28%;
 text-align:right;
}
.info h2{
 font-size:clamp(17px,3vw,30px);
 margin:0 0 8px;
}
.info p{
 color:#c3c5d0;
 font-size:clamp(10px,1.5vw,15px);
 line-height:1.5;
}
.tag{
 display:inline-block;
 padding:7px 12px;
 border:1px solid #a56aff;
 color:#d9bdff;
 border-radius:5px;
 font-size:11px;
}
.bottom{
 position:absolute;
 z-index:3;
 bottom:4%;
 left:5%;
 right:5%;
 display:flex;
 justify-content:space-between;
 color:#aaa;
 font-size:11px;
}

/* PARTIDA */
#match{
 display:none;
 position:fixed;
 inset:0;
 overflow:hidden;
 background:linear-gradient(#83c9ed,#c5e5d9 55%,#477a48);
}
#match h1{
 position:absolute;
 top:5%;
 width:100%;
 text-align:center;
 text-shadow:0 2px 8px #333;
 font-size:clamp(20px,3vw,30px);
}
#island{
 position:absolute;
 width:70vw;
 height:65vh;
 left:50%;
 top:57%;
 transform:translate(-50%,-50%);
 border-radius:48%;
 background:radial-gradient(ellipse,#6eaa50,#39763d 70%);
 box-shadow:inset 0 0 45px #285c31,0 20px 45px #294c55;
}
.tree{
 position:absolute;
 width:24px;
 height:35px;
 border-radius:50%;
 background:#205b31;
 box-shadow:0 0 5px #174b29;
}
#plane{
 position:absolute;
 left:-20%;
 top:35%;
 width:130px;
 height:38px;
 border-radius:45%;
 background:#343e52;
 border:2px solid #a6aabb;
 transform:rotate(8deg);
 box-shadow:0 0 12px #2228;
}
#plane:before{
 content:"";
 position:absolute;
 left:-20px;
 top:12px;
 width:170px;
 height:12px;
 background:#b5bac8;
 border-radius:50%;
}
#plane:after{
 content:"";
 position:absolute;
 right:5px;
 top:-13px;
 width:35px;
 height:28px;
 background:#7545c6;
 clip-path:polygon(0 50%,100% 0,100% 100%);
}
#return{
 position:absolute;
 top:18px;
 left:18px;
 padding:12px 20px;
 background:#7138cf;
 color:white;
 border:0;
 border-radius:8px;
 font-weight:bold;
}
#status{
 position:absolute;
 bottom:8%;
 width:100%;
 text-align:center;
 font-weight:bold;
 text-shadow:0 2px 5px black;
}
#jump{
 display:none;
 position:absolute;
 bottom:18%;
 left:50%;
 transform:translateX(-50%);
 padding:15px 30px;
 border:0;
 border-radius:10px;
 background:#783ce0;
 color:white;
 font-weight:bold;
 font-size:18px;
}
#player{
 display:none;
 position:absolute;
 left:50%;
 top:45%;
 width:35px;
 height:55px;
 transform:translate(-50%,-50%);
 border-radius:12px 12px 5px 5px;
 background:#17151f;
 border:2px solid #9d4cff;
 box-shadow:0 0 15px #a64cff;
}
#player:before{
 content:"";
 position:absolute;
 width:23px;
 height:23px;
 border-radius:50%;
 background:#292131;
 border:2px solid #a64cff;
 left:4px;
 top:-17px;
}
#rotate{
 display:none;
 position:fixed;
 inset:0;
 z-index:20;
 background:#101622;
 align-items:center;
 justify-content:center;
 text-align:center;
 font-size:20px;
 font-weight:bold;
 padding:25px;
}
@media(orientation:portrait){
 #rotate{display:flex}
}
</style>
</head>

<body>

<div id="rotate">
 GIRE O CELULAR PARA JOGAR MINI SKY BATTLE
</div>

<!-- LOBBY -->
<section id="lobby">

 <div class="logo">
  MINI <span>SKY</span> BATTLE
 </div>

 <div class="subtitle">
  UMA PEQUENA IDEIA, UM GRANDE MUNDO.
 </div>

 <button id="play">
  JOGAR ▶
 </button>

 <div id="character">
  <div class="glow"></div>
  <div class="body"></div>
  <div class="arm left"></div>
  <div class="arm right"></div>
  <div class="leg left"></div>
  <div class="leg right"></div>
  <div class="hood"></div>
  <div class="head"></div>
  <div class="face"></div>
  <div class="stripe"></div>
 </div>

 <div class="info">
  <span class="tag">PERSONAGEM PRINCIPAL</span>
  <h2>SHADOW ROXO</h2>
  <p>
   Prepare-se para entrar na batalha.
   Explore a ilha e seja o último sobrevivente!
  </p>
 </div>

 <div class="bottom">
  <span>MINI SKY BATTLE</span>
  <span>VERSÃO DE TESTE</span>
 </div>

</section>

<!-- PARTIDA -->
<section id="match">

 <button id="return">← LOBBY</button>

 <h1>MINI SKY BATTLE</h1>

 <div id="island"></div>

 <div id="plane"></div>

 <div id="player"></div>

 <button id="jump">🪂 SALTAR</button>

 <div id="status">AVIÃO EM PREPARAÇÃO...</div>

</section>

<script>
const lobby=document.getElementById("lobby");
const match=document.getElementById("match");
const play=document.getElementById("play");
const returnButton=document.getElementById("return");
const plane=document.getElementById("plane");
const jump=document.getElementById("jump");
const statusText=document.getElementById("status");
const player=document.getElementById("player");

let started=false;
let jumped=false;
let planePosition=-20;

function startGame(){
 if(started)return;

 started=true;
 jumped=false;

 lobby.style.display="none";
 match.style.display="block";

 planePosition=-20;
 plane.style.left=planePosition+"%";

 jump.style.display="block";
 player.style.display="none";

 statusText.textContent="AVIÃO EM PREPARAÇÃO...";
}

function returnLobby(){
 started=false;
 jumped=false;

 match.style.display="none";
 lobby.style.display="block";

 jump.style.display="none";
 player.style.display="none";

 statusText.textContent="AVIÃO EM PREPARAÇÃO...";
}

function jumpFromPlane(){
 if(!started||jumped)return;

 jumped=true;
 jump.style.display="none";
 player.style.display="block";

 statusText.textContent="VOCÊ SALTOU!";

 setTimeout(()=>{
  statusText.textContent="VOCÊ ESTÁ NA ILHA!";
 },2500);
}

play.addEventListener("click",startGame);
returnButton.addEventListener("click",returnLobby);
jump.addEventListener("click",jumpFromPlane);

// Movimento visual do avião
let lastTime=0;

function animate(time){
 requestAnimationFrame(animate);

 if(!started||jumped)return;

 if(time-lastTime>35){
  lastTime=time;

  planePosition+=0.12;

  if(planePosition>110){
   planePosition=-20;
  }

  plane.style.left=planePosition+"%";
 }
}

requestAnimationFrame(animate);

// Árvores decorativas na ilha
const island=document.getElementById("island");

for(let i=0;i<25;i++){
 const tree=document.createElement("div");
 tree.className="tree";
 tree.style.left=(Math.random()*90+5)+"%";
 tree.style.top=(Math.random()*80+10)+"%";
 island.appendChild(tree);
}
</script>

</body>
</html>
