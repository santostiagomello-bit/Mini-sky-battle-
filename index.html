<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Free Fire - Fixed Camera & Speed</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030712;color:#fff;font-family:'Segoe UI',Arial,sans-serif;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:1}

/* Lobby */
#lobby{position:fixed;inset:0;z-index:9999;background:radial-gradient(circle at center, #1e293b 0%, #090d16 100%);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:25px}
.lobby-header{font-size:clamp(20px, 4vw, 34px);font-weight:900;color:#facc15;text-shadow:3px 3px 0 #b91c1c;letter-spacing:2px;margin-top:10px;text-align:center}
.char-container{display:flex;gap:12px;margin:10px 0}
.char-card{padding:12px 20px;background:rgba(255,255,255,0.08);border:2px solid #facc15;border-radius:12px;font-weight:bold;font-size:15px;cursor:pointer}
.char-card.active{background:#facc15;color:#000;box-shadow:0 0 15px rgba(250,204,21,0.6)}

.settings-panel{background:rgba(15,23,42,0.85);border:2px solid rgba(250,204,21,0.4);padding:15px 20px;border-radius:14px;width:100%;max-width:320px;display:flex;flex-direction:column;gap:10px}
.settings-panel label{font-size:13px;font-weight:bold;color:#facc15;display:flex;justify-content:space-between}
.settings-panel input[type=range]{width:100%;accent-color:#facc15;cursor:pointer}

#playButton{width:100%;max-width:300px;padding:16px;border:none;border-radius:14px;background:linear-gradient(180deg,#f97316,#b91c1c);color:#fff;font-size:22px;font-weight:900;box-shadow:0 6px 0 #7f1d1d;cursor:pointer;text-transform:uppercase;letter-spacing:1px;pointer-events:auto;}
#playButton:active{transform:translateY(4px);box-shadow:0 2px 0 #7f1d1d}

/* HUD */
#game
