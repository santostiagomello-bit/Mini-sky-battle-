<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tactical Ops - Jogo Jogável</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; color: #fff; }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        
        #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none; display: none; flex-direction: column; justify-content: space-between; padding: 15px; }
        .hud-top { display: flex; justify-content: space-between; align-items: flex-start; width: 100%; }
        .panel { background: rgba(10, 14, 23, 0.9); border-left: 3px solid #00ff66; padding: 8px 12px; border-radius: 4px; font-size: 12px; text-transform: uppercase; }
        .stat-val { color: #00ff66; font-weight: bold; font-size: 15px; }

        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 16px; height: 16px; z-index: 4; pointer-events: none; display: none; }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background: #00ff66; }
        #crosshair::before { top: 7px; left: 0; width: 16px; height: 2px; }
        #crosshair::after { top: 0; left: 7px; width: 2px; height: 16px; }

        #controls-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: none; }
        .control-zone-left { position: absolute; bottom: 0; left: 0; width: 50%; height: 100%; pointer-events: auto; }
        .control-zone-right { position: absolute; bottom: 0; right: 0; width: 50%; height: 100%; pointer-events: auto; }
        
        #joystick-base { position: absolute; bottom: 40px; left: 40px; width: 110px; height: 110px; background: rgba(255,255,255,0.05); border: 2px solid rgba(0,255,102,0.3); border-radius: 50%; display: none; }
        #joystick-stick { position: absolute; top: 30px; left: 30px; width: 46px; height: 46px; background: rgba(0,255,102,0.4); border: 2px solid #00ff66; border-radius: 50%; }

        .btn-group { position: absolute; bottom: 20px; right: 20px; display: flex; gap: 10px; pointer-events: auto; }
        .action-btn { width: 70px; height: 70px; background: rgba(10, 18, 14, 0.85); border: 2px solid #00ff66; border-radius: 50%; color: #00ff66; font-weight: bold; font-size: 12px; display: flex; align-items: center; justify-content: center; }

        #menu-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #07090f; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; pointer-events: auto; }
        h1 { font-size: 26px; color: #00ff66; margin-bottom: 10px; text-transform: uppercase; }
        .main-btn { background: #00ff66; color: #000; border: none; padding: 15px 40px; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; text-transform: uppercase; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>
    <div id="crosshair"></div>

    <div id="hud">
        <div class="hud-top">
            <div class="panel">HP: <span id="hp-val" class="stat-val">100</span></div>
            <div class="panel">Placar 4x4: <span id="score-val" class="stat-val">0 - 0</span></div>
            <div class="panel">Kills: <span id="kills-val" class="stat-val">0</span></div>
        </div>
    </div>

    <div id="controls-layer">
        <div id="move-zone" class="control-zone-left">
            <div id="joystick-base"><div id="joystick-stick"></div></div>
        </div>
        <div id="look-zone" class="control-zone-right">
            <div class="btn-group">
                <div id="btn-fire" class="action-btn">ATIRAR</div>
            </div>
        </div>
    </div>

    <div id="menu-overlay">
        <h1>Tactical Ops 3D</h1>
        <p style="color:#8fa699; margin-bottom:20px; font-size:12px;">Visual Tático Neon • Pronto para Jogar</p>
        <button id="start-btn" class="main-btn">Jogar</button>
    </div>

    <script>
        let scene, camera, renderer;
        let player = { x: 0, y: 1.7, z: 20, rotX: 0, rotY: 0, hp: 100, speed: 0.12, kills: 0 };
        let bots = [];
        let scoreBlue = 0, scoreRed = 0;
        let gameActive = false;
        const clock = new THREE.Clock();

        function startGame() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x05080e);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            let dirLight = new THREE.DirectionalLight(0x00ff66, 0.8);
            dirLight.position.set(10, 30, 10);
            scene.add(dirLight);
