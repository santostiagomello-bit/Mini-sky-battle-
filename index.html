<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tactical Ops 3D - 4x4 Arena</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #07090f; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #fff; }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* UI & HUD */
        #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 15px; }
        .hud-top { display: flex; justify-content: space-between; align-items: flex-start; }
        .panel { background: rgba(10, 14, 23, 0.85); border-left: 3px solid #00f3ff; padding: 8px 14px; border-radius: 4px; backdrop-filter: blur(6px); font-size: 13px; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .stat-val { color: #00f3ff; font-weight: bold; font-size: 16px; }
        
        /* Weapon Info HUD */
        .weapon-hud { position: absolute; bottom: 30px; right: 120px; text-align: right; pointer-events: none; background: rgba(10, 14, 23, 0.8); padding: 10px 15px; border-radius: 6px; border-right: 3px solid #ffaa00; backdrop-filter: blur(4px); }
        .weapon-name { font-size: 12px; color: #ffaa00; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        .weapon-ammo { font-size: 20px; font-weight: bold; color: #fff; }

        /* Crosshair */
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 18px; height: 18px; z-index: 2; pointer-events: none; transition: transform 0.1s ease; }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background: rgba(0, 243, 255, 0.9); box-shadow: 0 0 4px #00f3ff; }
        #crosshair::before { top: 8px; left: 0; width: 18px; height: 2px; }
        #crosshair::after { top: 0; left: 8px; width: 2px; height: 18px; }
        #crosshair.ads { transform: translate(-50%, -50%) scale(0.5); }
        #crosshair.ads::before, #crosshair.ads::after { background: #ff3344; box-shadow: 0 0 6px #ff3344; }

        /* Mobile Controls */
        #controls-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; display: grid; grid-template-columns: 1fr 1fr; }
        .control-zone { pointer-events: auto; width: 100%; height: 100%; position: relative; }
        
        /* Joystick */
        #joystick-base { position: absolute; bottom: 40px; left: 40px; width: 120px; height: 120px; background: rgba(255, 255, 255, 0.04); border: 2px solid rgba(0, 243, 255, 0.2); border-radius: 50%; display: none; }
        #joystick-stick { position: absolute; top: 35px; left: 35px; width: 50px; height: 50px; background: rgba(0, 243, 255, 0.3); border: 2px solid #00f3ff; border-radius: 50%; pointer-events: none; box-shadow: 0 0 10px rgba(0,243,255,0.5); }

        /* Action Buttons */
        .btn-group { position: absolute; bottom: 25px; right: 25px; display: grid; grid-template-columns: repeat(3, 65px); gap: 12px; pointer-events: auto; }
        .action-btn { width: 65px; height: 65px; background: rgba(15, 22, 36, 0.8); border: 2px solid rgba(0, 243, 255, 0.4); border-radius: 50%; color: #00f3ff; font-weight: bold; font-size: 11px; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); transition: background 0.1s; }
        .action-btn:active { background: rgba(0, 243, 255, 0.3); color: #fff; }
        
        /* Side buttons */
        .side-btns { position: absolute; right: 25px; top: 110px; display: flex; flex-direction: column; gap: 10px; pointer-events: auto; }
        .side-btn { width: 50px; height: 50px; background: rgba(15, 22, 36, 0.8); border: 2px solid rgba(255, 255, 255, 0.2); border-radius: 50%; color: #fff; font-size: 11px; font-weight: bold; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); }

        /* Menus */
        #menu-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, #0c1322 0%, #04060b 100%); z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        h1 { font-size: 32px; color: #00f3ff; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 3px; text-shadow: 0 0 15px rgba(0, 243, 255, 0.5); }
        p { color: #7a8fa6; margin-bottom: 25px; font-size: 13px; letter-spacing: 1px; }
        .main-btn { background: linear-gradient(135deg, #00f3ff 0%, #0066ff 100%); color: #000; border: none; padding: 14px 35px; font-size: 15px; font-weight: bold; border-radius: 4px; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; box-shadow: 0 0 20px rgba(0, 243, 255, 0.4); }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>
    <div id="crosshair"></div>

    <div id="hud">
        <div class="hud-top">
            <div class="panel">HP: <span id="hp-val" class="stat-val">100</span></div>
            <div class="panel">Placar 4x4 (Azul x Vermelho): <span id="score-val" class="stat-val">0 - 0</span></div>
            <div class="panel">Kills: <span id="kills-val" class="stat-val">0</span></div>
        </div>
        <div class="weapon-hud">
            <div id=" weapon-name" class="weapon-name">F
