<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tactical Ops 3D - 4x4 Arena</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #07090f; font-family: sans-serif; color: #fff; }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* UI & HUD */
        #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 15px; }
        .hud-top { display: flex; justify-content: space-between; align-items: flex-start; width: 100%; }
        .panel { background: rgba(10, 14, 23, 0.9); border-left: 3px solid #00f3ff; padding: 8px 12px; border-radius: 4px; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
        .stat-val { color: #00f3ff; font-weight: bold; font-size: 15px; }
        
        .weapon-hud { position: absolute; bottom: 20px; right: 140px; text-align: right; pointer-events: none; background: rgba(10, 14, 23, 0.9); padding: 8px 12px; border-radius: 6px; border-right: 3px solid #ffaa00; }
        .weapon-name { font-size: 11px; color: #ffaa00; font-weight: bold; text-transform: uppercase; }
        .weapon-ammo { font-size: 18px; font-weight: bold; color: #fff; }

        /* Crosshair */
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 18px; height: 18px; z-index: 4; pointer-events: none; }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background: rgba(0, 243, 255, 0.9); box-shadow: 0 0 4px #00f3ff; }
        #crosshair::before { top: 8px; left: 0; width: 18px; height: 2px; }
        #crosshair::after { top: 0; left: 8px; width: 2px; height: 18px; }
        #crosshair.ads { transform: translate(-50%, -50%) scale(0.5); }
        #crosshair.ads::before, #crosshair.ads::after { background: #ff3344; box-shadow: 0 0 6px #ff3344; }

        /* Mobile Controls - Garantindo visibilidade absoluta */
        #controls-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: flex; }
        .control-zone-left { position: absolute; bottom: 0; left: 0; width: 50%; height: 100%; pointer-events: auto; }
        .control-zone-right { position: absolute; bottom: 0; right: 0; width: 50%; height: 100%; pointer-events: auto; }
        
        /* Joystick */
        #joystick-base { position: absolute; bottom: 40px; left: 40px; width: 110px; height: 110px; background: rgba(255, 255, 255, 0.05); border: 2px solid rgba(0, 243, 255, 0.3); border-radius: 50%; display: none; }
        #joystick-stick { position: absolute; top: 30px; left: 30px; width: 46px; height: 46px; background: rgba(0, 243, 255, 0.4); border: 2px solid #00f3ff; border-radius: 50%; pointer-events: none; }

        /* Action Buttons */
        .btn-group { position: absolute; bottom: 20px; right: 20px; display: flex; gap: 10px; pointer-events: auto; }
        .action-btn { width: 60px; height: 60px; background: rgba(15, 22, 36, 0.85); border: 2px solid rgba(0, 243, 255, 0.5); border-radius: 50%; color: #00f3ff; font-weight: bold; font-size: 10px; display: flex; align-items: center; justify-content: center; }
        .action-btn:active { background: rgba(0, 243, 255, 0.4); color: #fff; }
        
        /* Side buttons */
        .side-btns { position: absolute; right: 20px; top: 90px; display: flex; flex-direction: column; gap: 8px; pointer-events: auto; }
        .side-btn { width: 48px; height: 48px; background: rgba(15, 22, 36, 0.85); border: 2px solid rgba(255, 255, 255, 0.3); border-radius: 50%; color: #fff; font-size: 10px; font-weight: bold; display: flex; align-items: center; justify-content: center; }

        /* Menus */
        #menu-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, #0c1322 0%, #04060b 100%); z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; }
        h1 { font-size: 28px; color: #00f3ff; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 2px; }
        p { color: #7a8fa6; margin-bottom: 20px; font-size: 12px; }
        .main-btn { background: linear-gradient(135deg, #00f3ff 0%, #0066ff 100%); color: #000; border: none; padding: 12px 30px; font-size: 14px; font-weight: bold; border-radius: 4px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>
    <div id="crosshair"></div>

    <div id="hud">
        <div class="hud-top">
            <div class="panel">HP: <span id="hp-val" class="stat-val">100</span></div>
            <div class="panel">4x4: <span id="score-val" class="stat-val">0 - 0</span></div>
            <div class="panel">Kills: <span id="kills-val" class="stat-val">0</span></div>
        </div>
        <div class="weapon-hud">
            <div id="weapon-name" class="weapon-name">Fuzil M4A1</div>
            <div id="weapon-ammo" class="weapon-ammo">30/90</div>
        </div>
    </div>

    <div id="controls-layer">
        <div id="move-zone" class="control-zone-left">
            <div id="joystick-base"><div id="joystick-stick"></div></div>
        </div>
        <div id="look-zone" class="control-zone-right">
            <div class="side-btns">
                <div id="btn-weapon" class="side-btn">TROCAR</div>
                <div id="btn-reload" class="side-btn">REC</div>
                <div id="btn-ads" class="side-btn">MIRA</div>
            </div>
            <div class="btn-group">
                <div id="btn-crouch" class="action-btn">AGACH</div>
                <div id="btn-jump" class="action-btn">PULAR</div>
                <div id="btn-fire" class="action-btn" style="background: rgba(0, 243, 255, 0.3); border-color: #00f3ff; width: 68px; height: 68px;">FOGO</div>
            </div>
        </div>
    </div>

    <div id="menu-overlay">
        <h1>Tactical Ops: Arena 4x4</h1>
        <p>Modo Equipe • Controles Corrigidos para Mobile</p>
        <button id="start-btn" class="main-btn">Entrar na Batalha</button>
    </div>

    <script>
        let scene, camera, renderer;
        let player = { x: 0, y: 1.7, z: 20, rotX: 0, rotY: 0, hp: 100, maxHp: 100, speed: 0.11, isCrouching: false, isADS: false, kills: 0, team: 'blue' };

        let scoreBlue = 0, scoreRed = 0;
        const clock = new THREE.Clock();

        function init() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x07090f);
            scene.fog = new THREE.FogExp2(0x07090f, 0.022);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xddeeff, 0.45);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0x00f3ff, 0.7);
            dirLight.position.set(25, 45, 25);
            scene.add(dirLight);

            buildCompetitiveMap();
            spawnTeams4v4();

            document.getElementById('start-btn').addEventListener('click', () => {
                document.getElementById('menu-overlay').style.display = 'none';
                initTouchControls();
            });

            window.addEventListener('resize', onWindowResize);
        }

            const floorMat = new THREE.MeshStandardMaterial({ color: 0x111726, roughness: 0.7 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            const boxMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.4 });
            const mapLayout = [
                {x: 0, z: 0, w: 6, h: 5, d: 6},
                {x: -16, z: -16, w: 10, h: 6, d: 10},
                {x: 16, z: 16, w: 10, h: 6, d: 10},
                {x: -14, z: 10, w: 4, h: 3.5, d: 12},
                {x: 14, z: -10, w: 4, h: 3.5, d: 12},
                {x: 0, z: -22, w: 22, h: 4, d: 3},
                {x: 0, z: 22, w: 22, h: 4, d: 3}
            ];

            mapLayout.forEach(item => {
                const geo = new THREE.BoxGeometry(item.w, item.h, item.d);
                const mesh = new THREE.Mesh(geo, boxMat);
                mesh.position.set(item.x, item.h / 2, item.z);
                scene.add(mesh);
            });
        }
