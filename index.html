<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BATTLELANDS 3D</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#2b6cb0;color:#fff;font-family:Arial,sans-serif;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#lobby{position:fixed;inset:0;z-index:10;background:radial-gradient(circle at 50% 30%,#4299e1 0%,#1a365d 100%);display:flex;flex-direction:column;align-items:center;justify-content:center}
#logo{font-size:clamp(26px,5vw,46px);font-weight:900;color:#f6e05e;text-shadow:3px 3px 0 #9b2c2c,-2px -2px 0 #fff;margin-bottom:30px;text-align:center}
#playButton{padding:18px 40px;border:4px solid #fef08a;border-radius:20px;background:linear-gradient(180deg,#facc15,#d97706);color:#422006;font-size:24px;font-weight:900;box-shadow:0 8px 0 #92400e;cursor:pointer;pointer-events:auto}
#playButton:active{transform:translateY(4px);box-shadow:0 4px 0 #92400e}
#gameHUD{display:none;position:fixed;inset:0;z-index:5;pointer-events:none}
#health{position:absolute;top:15px;left:15px;width:180px;padding:10px 12px;border-radius:12px;background:rgba(26,54,93,0.9);border:2px solid rgba(255,255,255,0.2);font-size:12px;font-weight:bold}
#healthTrack{height:10px;margin-top:6px;border-radius:6px;background:#742a2a;overflow:hidden}
#healthFill{height:100%;width:100%;background:#48bb78}
#backButton{position:absolute;top:15px;right:15px;padding:10px 16px;border:2px solid white;border-radius:12px;background:rgba(43,108,176,0.9);color:white;font-weight:bold;pointer-events:auto}
#joystick{position:absolute;bottom:20px;left:20px;width:120px;height:120px;border:3px solid rgba(255,255,255,0.4);border-radius:50%;background:rgba(26,54,93,0.3);pointer-events:auto;touch-action:none}
#stick{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px;border:2px solid white;border-radius:50%;background:rgba(255,255,255,0.8)}
#aimPad{position:absolute;right:20px;bottom:120px;width:130px;height:130px;border:2px dashed rgba(255,255,255,0.5);border-radius:50%;background:rgba(26,54,93,0.3);pointer-events:auto;touch-action:none}
#aimDot{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px;border:2px solid white;border-radius:50%;background:#f6e05e}
#fireButton{position:absolute;right:20px;bottom:20px;width:85px;height:85px;border:3px solid white;border-radius:50%;background:linear-gradient(135deg,#f56565,#c53030);color:white;font-weight:900;pointer-events:auto;box-shadow:0 6px 0 #742a2a}
#actionButton{position:absolute;right:120px;bottom:35px;width:70px;height:70px;border:3px solid white;border-radius:50%;background:linear-gradient(135deg,#9f7aea,#6b46c1);color:white;font-weight:900;pointer-events:auto;box-shadow:0 5px 0 #44337a}
#planeNotice{position:absolute;top:20%;left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:12px;background:rgba(26,54,93,0.9);font-weight:bold;font-size:14px;border:2px solid #f6e05e;display:none;white-space:nowrap}
#dropButton{position:absolute;left:50%;top:28%;transform:translateX(-50%);padding:14px 28px;border:3px solid #fef08a;border-radius:14px;background:linear-gradient(180deg,#facc15,#d97706);color:#422006;font-weight:900;font-size:18px;pointer-events:auto;display:none;box-shadow:0 6px 0 #92400e}
#rotateMessage{display:none;position:fixed;inset:0;z-index:20;background:#1a365d;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:25px}
#rotateMessage .phone{font-size:70px;animation:turn 2s infinite}
@keyframes turn{50%{transform:rotate(90deg)}}
@media(orientation:portrait){#rotateMessage{display:flex}}
</style>
</head>
<body>
<div id="rotateMessage"><div class="phone">📱</div><h2>BATTLELANDS ROYALE</h2><p>Gire o celular para a horizontal!</p></div>

<div id="lobby">
  <div id="logo">⭐ BATTLELANDS MINI ⭐</div>
  <button id="playButton">JOGAR</button>
</div>

<div id="gameHUD">
  <div id="health">VIDA<div id="healthTrack"><div id="healthFill"></div></div></div>
  <button id="backButton">SAIR</button>
  <div id="planeNotice">✈️ SOBREVÔO NA ILHA</div>
  <button id="dropButton">🪂 SALTAR</button>
  <div id="joystick"><div id="stick"></div></div>
  <div id="aimPad"><div id="aimDot"></div></div>
  <button id="fireButton">ATIRAR</button>
  <button id="actionButton">PULAR</button>
</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xa0d2eb);
scene.fog = new THREE.Fog(0xa0d2eb, 60, 180);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 300);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x4a7c59, 1.8));
const sun = new THREE.DirectionalLight(0xfff5cc, 1.8);
sun.position.set(40, 70, 40);
sun.castShadow = true;
scene.add(sun);

const mat = (c, r = 0.8) => new THREE.MeshStandardMaterial({ color: c, roughness: r });
const world = new THREE.Group();
scene.add(world);

function addMesh(parent, geo, material, x, y, z) {
  const m = new THREE.Mesh(geo, material);
  m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  parent.add(m);
  return m;
}

const ground = addMesh(world, new THREE.PlaneGeometry(250, 250), mat(0x56ab2f), 0, 0, 0);
ground.rotation.x = -Math.PI / 2;

function stylizedTree(x, z) {
  addMesh(world, new THREE.CylinderGeometry(0.3, 0.4, 1.8, 6), mat(0x8b5a2b), x, 0.9, z);
  addMesh(world, new THREE.DodecahedronGeometry(1.4), mat(0x38a169), x, 2.4, z);
}
for(let i = -80; i <= 80; i += 25) {
  stylizedTree(i, -60); stylizedTree(i, 60);
  stylizedTree(-80, i); stylizedTree(80, i);
}

function createChibiHero() {
  const g = new THREE.Group();
  addMesh(g, new THREE.BoxGeometry(0.7, 0.8, 0.4), mat(0x1a202c), 0, 0.8, 0);
  const head = addMesh(g, new THREE.SphereGeometry(0.65, 16, 16), mat(0xf6ad55), 0, 1.8, 0);
  head.scale.set(1, 1.1, 1);
  addMesh(g, new THREE.BoxGeometry(0.7, 0.3, 0.3), mat(0x2d3748), 0, 1.85, 0.35);
  addMesh(g, new THREE.BoxGeometry(0.25, 0.6, 0.25), mat(0x2d3748), -0.5, 0.8, 0);
  addMesh(g, new THREE.BoxGeometry(0.25, 0.6, 0.25), mat(0x2d3748), 0.5, 0.8, 0);
  addMesh(g, new THREE.BoxGeometry(0.28, 0.6, 0.28), mat(0x1a202c), -0.2, 0.3, 0);
  addMesh(g, new THREE.BoxGeometry(0.28, 0.6, 0.28), mat(0x1a202c), 0.2, 0.3, 0);
  return g;
}

const player = createChibiHero();
scene.add(player);

const shots = [];
let gameStarted = false, moveX = 0, moveY = 0, jumpV = 0, isJumping = false;
let dropPhase = false, playerDropped = false, planeTime = 0, aimX = 0, aimZ = -1;

const plane = addMesh(scene, new THREE.BoxGeometry(4, 1, 1.5), mat(0x4a5568), 0, 35, 0);
plane.visible = false;

// Joystick
const joystick = document.getElementById("joystick"), stick = document.getElementById("stick");
let joyId = null, joyCenter = { x: 0, y: 0 };
joystick.addEventListener("pointerdown", e => { joyId = e.pointerId; const r = joystick.getBoundingClientRect(); joyCenter = { x: r.left + r.width/2, y: r.top + r.height/2 }; updateJoy(e); joystick.setPointerCapture(joyId); });
joystick.addEventListener("pointermove", e => { if(e.pointerId === joyId) updateJoy(e); });
joystick.addEventListener("pointerup", e => { if(e.pointerId === joyId) { joyId = null; moveX = 0; moveY = 0; stick.style.transform = `translate(0px,0px)`; } });
function updateJoy(e) {
  const dx = e.clientX - joyCenter.x, dy = e.clientY - joyCenter.y, d = Math.hypot(dx, dy), maxR = 38;
  const nx = d > maxR ? dx/d * maxR : dx, ny = d > maxR ? dy/d * maxR : dy;
  stick.style.transform = `translate(${nx}px,${ny}px)`;
  moveX = nx / maxR; moveY = ny / maxR;
}

// AimPad
const aimPad = document.getElementById("aimPad"), aimDot = document.getElementById("aimDot");
let aimId = null, aimCenter = { x: 0, y: 0 };
aimPad.addEventListener("pointerdown", e => { aimId = e.pointerId; const r = aimPad.getBoundingClientRect(); aimCenter = { x: r.left + r.width/2, y: r.top + r.height/2 }; updateAim(e); aimPad.setPointerCapture(aimId); });
aimPad.addEventListener("pointermove", e => { if(e.pointerId === aimId) updateAim(e); });
aimPad.addEventListener("pointerup", e => { if(e.pointerId === aimId) { aimId = null; aimDot.style.transform = `translate(0px,0px)`; } });
function updateAim(e) {
  const dx = e.clientX - aimCenter.x, dy = e.clientY - aimCenter.y, d = Math.hypot(dx, dy), maxR = 45;
  const nx = d > maxR ? dx/d * maxR : dx, ny = d > maxR ? dy/d * maxR : dy;
  aimDot.style.transform = `translate(${nx}px,${ny}px)`;
  if(d > 5) { aimX = nx / maxR; aimZ = ny / maxR; }
}

// Botões principais corrigidos
document.getElementById("playButton").addEventListener("click", () => {
  gameStarted = true;
  document.getElementById("lobby").style.display = "none";
  document.getElementById("gameHUD").style.display = "block";
  dropPhase = true; player.visible = false;
  document.getElementById("dropButton").style.display = "block";
  document.getElementById("planeNotice").style.display = "block";
});

document.getElementById("backButton").addEventListener("click", () => {
  gameStarted = false;
  document.getElementById("gameHUD").style.display = "none";
  document.getElementById("lobby").style.display = "flex";
});

document.getElementById("dropButton").addEventListener("click", () => {
  if(!dropPhase) return;
  dropPhase = false; playerDropped = true;
  player.visible = true; player.position.set(plane.position.x, 25, plane.position.z);
  jumpV = -0.5;
  document.getElementById("dropButton").style.display = "none";
  document.getElementById("planeNotice").style.display = "none";
});

document.getElementById("fireButton").addEventListener("click", () => {
  if(!gameStarted || dropPhase) return;
  shots.push({ x: player.position.x, z: player.position.z, dx: aimX, dz: aimZ, life: 40 });
});

document.getElementById("actionButton").addEventListener("click", () => {
  if(!gameStarted || dropPhase || isJumping) return;
  isJumping = true; jumpV = 0.35;
});

function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
  if(!gameStarted) return;

  if(dropPhase) {
    planeTime += 0.012;
    plane.position.set(Math.sin(planeTime) * 60, 25, Math.cos(planeTime * 0.8) * 60);
    camera.position.set(plane.position.x, plane.position.y + 14, plane.position.z + 16);
    camera.lookAt(plane.position);
    return;
  }

  if(playerDropped) {
    player.position.x += moveX * 0.5;
    player.position.z += moveY * 0.5;
    player.position.y += jumpV;
    jumpV -= 0.015;
    if(player.position.y <= 0) { player.position.y = 0; playerDropped = false; }
  } else {
    player.position.x += moveX * 0.4;
    player.position.z += moveY * 0.4;
    if(isJumping) {
      player.position.y += jumpV; jumpV -= 0.03;
      if(player.position.y <= 0) { player.position.y = 0; isJumping = false; }
    }
  }

  camera.position.set(player.position.x, player.position.y + 16, player.position.z + 14);
  camera.lookAt(player.position.x, player.position.y, player.position.z);
}

animate();
</script>
</body>
</html>
