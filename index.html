<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tactical FPS Mobile - 3D AAA</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b0f19; font-family: sans-serif; color: #fff; }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* UI & HUD */
        #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; }
        .hud-top { display: flex; justify-content: space-between; align-items: flex-start; }
        .panel { background: rgba(11, 15, 25, 0.85); border: 1px solid rgba(0, 243, 255, 0.3); padding: 10px 15px; border-radius: 6px; backdrop-filter: blur(5px); font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
        .stat-val { color: #00f3ff; font-weight: bold; font-size: 18px; }
        
        /* Crosshair */
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 16px; height: 16px; z-index: 2; pointer-events: none; transition: transform 0.1s ease; }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background: rgba(0, 243, 255, 0.8); }
        #crosshair::before { top: 7px; left: 0; width: 16px; height: 2px; }
        #crosshair::after { top: 0; left: 7px; width: 2px; height: 16px; }
        #crosshair.ads { transform: translate(-50%, -50%) scale(0.6); }
        #crosshair.ads::before, #crosshair.ads::after { background: #ff3333; }

        /* Mobile Controls */
        #controls-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; display: grid; grid-template-columns: 1fr 1fr; }
        .control-zone { pointer-events: auto; width: 100%; height: 100%; position: relative; }
        
        /* Joystick */
        #joystick-base { position: absolute; bottom: 40px; left: 40px; width: 120px; height: 120px; background: rgba(255, 255, 255, 0.05); border: 2px solid rgba(255, 255, 255, 0.15); border-radius: 50%; display: none; }
        #joystick-stick { position: absolute; top: 35px; left: 35px; width: 50px; height: 50px; background: rgba(0, 243, 255, 0.4); border: 2px solid #00f3ff; border-radius: 50%; pointer-events: none; }

        /* Action Buttons */
        .btn-group { position: absolute; bottom: 30px; right: 30px; display: grid; grid-template-columns: repeat(3, 70px); gap: 15px; pointer-events: auto; }
        .action-btn { width: 70px; height: 70px; background: rgba(11, 15, 25, 0.7); border: 2px solid rgba(0, 243, 255, 0.4); border-radius: 50%; color: #00f3ff; font-weight: bold; font-size: 13px; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); active: scale(0.95); transition: background 0.1s, border-color 0.1s; }
        .action-btn:active, .action-btn.active { background: rgba(0, 243, 255, 0.3); border-color: #00f3ff; color: #fff; }
        
        /* Side buttons */
        .side-btns { position: absolute; right: 30px; top: 120px; display: flex; flex-direction: column; gap: 12px; pointer-events: auto; }
        .side-btn { width: 55px; height: 55px; background: rgba(11, 15, 25, 0.7); border: 2px solid rgba(255, 255, 255, 0.2); border-radius: 50%; color: #fff; font-size: 12px; font-weight: bold; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); }

        /* Menus / Overlays */
        #menu-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 8, 15, 0.92); z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(10px); }
        h1 { font-size: 36px; color: #00f3ff; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 3px; text-shadow: 0 0 20px rgba(0, 243, 255, 0.5); }
        p { color: #8b9bb4; margin-bottom: 30px; font-size: 14px; letter-spacing: 1px; }
        .main-btn { background: linear-gradient(135deg, #00f3ff 0%, #0066ff 100%); color: #000; border: none; padding: 15px 40px; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; box-shadow: 0 0 25px rgba(0, 243, 255, 0.4); transition: transform 0.2s; }
        .main-btn:active { transform: scale(0.95); }
    </style>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>
    <div id="crosshair"></div>

    <div id="hud">
        <div class="hud-top">
            <div class="panel">HP: <span id="hp-val" class="stat-val">100</span></div>
            <div class="panel">Inimigos: <span id="kills-val" class="stat-val">0</span> / 10</div>
            <div class="panel">Munição: <span id="ammo-val" class="stat-val">30/90</span></div>
        </div>
    </div>

    <div id="controls-layer">
        <div id="move-zone" class="control-zone">
            <div id="joystick-base"><div id="joystick-stick"></div></div>
        </div>
        <div id="look-zone" class="control-zone">
            <div class="side-btns">
                <div id="btn-reload" class="side-btn">REC</div>
                <div id="btn-ads" class="side-btn">MIRA</div>
            </div>
            <div class="btn-group">
                <div id="btn-crouch" class="action-btn">AGACH</div>
                <div id="btn-jump" class="action-btn">PULAR</div>
                <div id="btn-fire" class="action-btn" style="background: rgba(0, 243, 255, 0.2); border-color: #00f3ff;">FOGO</div>
            </div>
        </div>
    </div>

    <div id="menu-overlay">
        <h1>Tactical Ops 3D</h1>
        <p>Simulador FPS Tático • Assistência de Mira & IA Avançada</p>
        <button id="start-btn" class="main-btn">Entrar na Missão</button>
    </div>

    <script>
        // Game Engine Setup
        let scene, camera, renderer;
        let player = {
            x: 0, y: 1.7, z: 0,
            rotX: 0, rotY: 0,
            hp: 100, maxHp: 100,
            speed: 0.12,
            isCrouching: false,
            isADS: false,
            ammo: 30, reserveAmmo: 90,
            kills: 0
        };

        let keys = { w: false, a: false, s: false, d: false };
        let bots = [];
        let bullets = [];
        let obstacles = [];
        
        const clock = new THREE.Clock();

        function init() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0b0f19);
            scene.fog = new THREE.FogExp2(0x0b0f19, 0.025);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(20, 40, 20);
            dirLight.castShadow = true;
            scene.add(dirLight);

            buildMap();
            spawnBots(8);

            // Event Listeners
            document.getElementById('start-btn').addEventListener('click', () => {
                document.getElementById('menu-overlay').style.display = 'none';
                initTouchControls();
            });

            window.addEventListener('resize', onWindowResize);
        }

        function buildMap() {
            // Ground
            const floorGeo = new THREE.PlaneGeometry(120, 120);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x1a2130, roughness: 0.8 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // Grid Walls / Buildings (CS Style Layout)
            const boxMat = new THREE.MeshStandardMaterial({ color: 0x2a3548, roughness: 0.5 });
            const positions = [
                {x: -15, z: -15, w: 10, h: 6, d: 10},
                {x: 15, z: -15, w: 12, h: 7, d: 8},
                {x: -15, z: 15, w: 8, h: 5, d: 12},
                {x: 15, z: 15, w: 10, h: 8, d: 10},
                {x: 0, z: -25, w: 25, h: 4, d: 4},
                {x: -25, z: 0, w: 4, h: 5, d: 20},
                {x: 25, z: 0, w: 4, h: 6, d: 20}
            ];

            positions.forEach(p => {
                const geo = new THREE.BoxGeometry(p.w, p.h, p.d);
                const mesh = new THREE.Mesh(geo, boxMat);
                mesh.position.set(p.x, p.h / 2, p.z);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                scene.add(mesh);
                obstacles.push({x: p.x, z: p.z, w: p.w, d: p.d});
            });
        }

        function spawnBots(count) {
            for(let i=0; i<count; i++) {
                const botGeo = new THREE.BoxGeometry(0.8, 1.8, 0.8);
                const botMat = new THREE.MeshStandardMaterial({ color: 0xff3344 });
                const mesh = new THREE.Mesh(botGeo, botMat);
                
                const angle = Math.random() * Math.PI * 2;
                const dist = 15 + Math.random() * 25;
                mesh.position.set(Math.cos(angle)*dist, 0.9, Math.sin(angle)*dist);
                scene.add(mesh);

                bots.push({
                    mesh: mesh,
                    hp: 100,
                    state: 'patrol',
                    targetPos: new THREE.Vector3((Math.random()-0.5)*40, 0.9, (Math.random()-0.5)*40),
                    speed: 0.04 + Math.random()*0.03
                });
            }
        }

        function initTouchControls() {
            // Look / Camera drag
            let lookZone = document.getElementById('look-zone');
            let touchId = null;
            let lastX = 0, lastY = 0;

            lookZone.addEventListener('touchstart', e => {
                if(touchId === null) {
                    let touch = e.changedTouches[0];
                    touchId = touch.identifier;
                    lastX = touch.clientX;
                    lastY = touch.clientY;
                }
            });

            lookZone.addEventListener('touchmove', e => {
                for(let i=0; i<e.changedTouches.length; i++) {
                    let touch = e.changedTouches[i];
                    if(touch.identifier === touchId) {
                        let dx = touch.clientX - lastX;
                        let dy = touch.clientY - lastY;
                        
                        let sens = player.isADS ? 0.002 : 0.004;
                        player.rotY -= dx * sens;
                        player.rotX -= dy * sens;
                        player.rotX = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, player.rotX));

                        lastX = touch.clientX;
                        lastY = touch.clientY;
                    }
                }
            });

            lookZone.addEventListener('touchend', e => {
                for(let i=0; i<e.changedTouches.length; i++) {
                    if(e.changedTouches[i].identifier === touchId) {
                        touchId = null;
                    }
                }
            });

            // Virtual Joystick for Movement
            let moveZone = document.getElementById('move-zone');
            let joyBase = document.getElementById('joystick-base');
            let joyStick = document.getElementById('joystick-stick');
            let moveTouchId = null;
            let joyCenter = {x: 0, y: 0};
            let moveDir = {x: 0, z: 0};

            moveZone.addEventListener('touchstart', e => {
                if(moveTouchId === null) {
                    let touch = e.changedTouches[0];
                    moveTouchId = touch.identifier;
                    joyCenter.x = touch.clientX;
                    joyCenter.y = touch.clientY;
                    joyBase.style.display = 'block';
                    joyBase.style.left = (touch.clientX - 60) + 'px';
                    joyBase.style.top = (touch.clientY - 60) + 'px';
                    joyStick.style.transform = `translate(0px, 0px)`;
                }
            });

            moveZone.addEventListener('touchmove', e => {
                for(let i=0; i<e.changedTouches.length; i++) {
                    let touch = e.changedTouches[i];
                    if(touch.identifier === moveTouchId) {
                        let dx = touch.clientX - joyCenter.x;
                        let dy = touch.clientY - joyCenter.y;
                        let dist = Math.sqrt(dx*dx + dy*dy);
                        let maxDist = 40;

                        if(dist > maxDist) {
                            dx = (dx / dist) * maxDist;
                            dy = (dy / dist) * maxDist;
                        }

                        joyStick.style.transform = `translate(${dx}px, ${dy}px)`;
                        moveDir.x = dx / maxDist;
                        moveDir.z = dy / maxDist;
                    }
                }
            });

            moveZone.addEventListener('touchend', e => {
                for(let i=0; i<e.changedTouches.length; i++) {
                    if(e.changedTouches[i].identifier === moveTouchId) {
                        moveTouchId = null;
                        joyBase.style.display = 'none';
                        moveDir.x = 0;
                        moveDir.z = 0;
                    }
                }
            });

            // Action Buttons
            document.getElementById('btn-fire').addEventListener('touchstart', () => fireWeapon());
            document.getElementById('btn-ads').addEventListener('touchstart', () => {
                player.isADS = !player.isADS;
                document.getElementById('crosshair').classList.toggle('ads', player.isADS);
            });
            document.getElementById('btn-reload').addEventListener('touchstart', () => reloadWeapon());
            document.getElementById('btn-crouch').addEventListener('touchstart', () => {
                player.isCrouching = !player.isCrouching;
                player.y = player.isCrouching ? 1.2 : 1.7;
            });

            // Assign continuous movement loop
            window.playerMoveDir = moveDir;
        }

        function fireWeapon() {
            if(player.ammo <= 0) return;
            player.ammo--;
            updateHUD();

            // Aim Assist / Raycast check
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            
            let botMeshes = bots.map(b => b.mesh);
            let intersects = raycaster.intersectObjects(botMeshes);

            if(intersects.length > 0) {
                let hitMesh = intersects[0].object;
                let bot = bots.find(b => b.mesh === hitMesh);
                if(bot) {
                    bot.hp -= 35;
                    if(bot.hp <= 0) {
                        scene.remove(bot.mesh);
                        bots = bots.filter(b => b !== bot);
                        player.kills++;
                        updateHUD();
                        if(bots.length === 0) {
                            setTimeout(() => alert('Missão Concluída! Todos os alvos eliminados.'), 200);
                        }
                    }
                }
            }
        }

        function reloadWeapon() {
            let needed = 30 - player.ammo;
            if(needed > 0 && player.reserveAmmo > 0) {
                let reloadCount = Math.min(needed, player.reserveAmmo);
                player.ammo += reloadCount;
                player.reserveAmmo -= reloadCount;
                updateHUD();
            }
        }

        function updateHUD() {
            document.getElementById('hp-val').innerText = player.hp;
            document.getElementById('kills-val').innerText = player.kills;
            document.getElementById('ammo-val').innerText = `${player.ammo}/${player.reserveAmmo}`;
        }

        function updateGame(delta) {
            // Player Movement via Virtual Joystick
            if(window.playerMoveDir) {
                let speed = player.isCrouching ? player.speed * 0.6 : player.speed;
                let forward = window.playerMoveDir.z;
                let strafe = window.playerMoveDir.x;

                let cos = Math.cos(player.rotY);
                let sin = Math.sin(player.rotY);

                let dx = (sin * forward + cos * strafe) * speed;
                let dz = (cos * forward - sin * strafe) * speed;

                player.x += dx;
                player.z += dz;
            }

            camera.position.set(player.x, player.y, player.z);
            camera.rotation.order = 'YXZ';
            camera.rotation.y = player.rotY;
            camera.rotation.x = player.rotX;

            // Bot AI Behavior
            bots.forEach(bot => {
                let distToPlayer = bot.mesh.position.distanceTo(camera.position);
                
                if(distToPlayer < 25) {
                    // Attack / Chase player
                    bot.mesh.lookAt(camera.position.x, bot.mesh.position.y, camera.position.z);
                    bot.mesh.translateZ(bot.speed * 0.8);

                    // Bot shooting player logic
                    if(distToPlayer < 15 && Math.random() < 0.03) {
                        player.hp -= 5;
                        updateHUD();
                        if(player.hp <= 0) {
                            alert('Você foi eliminado!');
                            window.location.reload();
                        }
                    }
                } else {
                    // Patrol mode
                    bot.mesh.lookAt(bot.targetPos);
                    bot.mesh.translateZ(bot.speed * 0.5);
                    if(bot.mesh.position.distanceTo(bot.targetPos) < 2) {
                        bot.targetPos.set((Math.random()-0.5)*40, 0.9, (Math.random()-0.5)*40);
                    }
                }
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            let delta = clock.getDelta();
            updateGame(delta);
            renderer.render(scene, camera);
        }

        window.onload = () => {
            init();
            animate();
        };
    </script>
</body>
</html>
