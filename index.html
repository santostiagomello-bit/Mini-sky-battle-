<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>MINI ROYALE 3.0 — NEXT GENERATION</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#84979a;font-family:Arial,sans-serif;color:#fff;touch-action:none}
#game{position:fixed;inset:0}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;z-index:15}
.panel{background:rgba(12,24,30,.82);border:2px solid #ff7a16;border-radius:9px;padding:8px 12px;font-weight:700;text-shadow:0 1px 2px #000}
#topbar{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px}
#topbar .panel{font-size:13px}
#jumpInfo{position:absolute;top:12%;left:50%;transform:translateX(-50%);min-width:65%;text-align:center;font-size:17px}
#speed{position:absolute;bottom:12%;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:15px;background:rgba(12,24,30,.78);padding:8px 12px;border-radius:8px}
#crosshair{display:none;position:absolute;left:50%;top:50%;width:24px;height:24px;transform:translate(-50%,-50%)}
#crosshair:before,#crosshair:after{content:"";position:absolute;background:var(--crosshairColor,#fff);box-shadow:0 0 3px #000}
#crosshair:before{width:2px;height:22px;left:11px;top:1px}
#crosshair:after{height:2px;width:22px;top:11px;left:1px}
#crosshair.locked:before,#crosshair.locked:after{background:#ff2828}
#controls{position:fixed;inset:0;z-index:8;pointer-events:none}
#lookZone{position:absolute;right:0;top:0;width:58%;height:100%;pointer-events:auto;touch-action:none}
#moveZone{position:absolute;left:0;bottom:0;width:48%;height:52%;pointer-events:auto;touch-action:none}
#joystick{display:none;position:absolute;width:112px;height:112px;border:2px solid rgba(255,255,255,.75);background:rgba(20,30,35,.25);border-radius:50%;pointer-events:none}
#stick{position:absolute;width:48px;height:48px;left:30px;top:30px;border-radius:50%;background:rgba(255,122,22,.9);border:2px solid #ffc078}
.btn{position:absolute;pointer-events:auto;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;color:white;background:rgba(255,130,0,.92);border:4px solid #ffb52e;box-shadow:0 4px 12px #0006;text-shadow:0 1px 2px #000}
#action{right:22px;bottom:7%;width:104px;height:104px;font-size:16px}
#fire{display:none;right:22px;bottom:7%;width:82px;height:82px;background:#d94137;border-color:#ff8177;font-size:13px}
#aim{display:none;right:116px;bottom:9%;width:62px;height:62px;font-size:12px}
#jump{display:none;right:22px;bottom:25%;width:68px;height:68px;font-size:12px;background:rgba(45,135,210,.94);border-color:#83caff}
#mapButton{position:absolute;right:14px;top:68px;pointer-events:auto;border:1px solid #fff;background:#17252dcc;border-radius:8px;padding:8px 10px;font-weight:bold;color:white}
#mapPanel{display:none;position:fixed;z-index:20;inset:8% 5%;background:#14232aee;border:2px solid #ff7a16;border-radius:12px;padding:12px;pointer-events:auto}
#mapPanel h3{margin:0 0 8px;text-align:center}
#mapCanvas{width:100%;height:calc(100% - 40px);background:#6eaa68;border-radius:8px}
#mapClose{position:absolute;right:10px;top:8px;background:#ff7a16;color:white;border:0;border-radius:6px;padding:7px 10px;font-weight:bold}
#message{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);padding:10px 14px;background:#14232add;border:2px solid #ff7a16;border-radius:8px;display:none;text-align:center}
@media (orientation:portrait){#jumpInfo{top:12%;}#speed{bottom:13%}}

/* ===== LOBBY HORIZONTAL MINI ROYALE ===== */
#lobby{position:fixed;inset:0;z-index:30;overflow:hidden;color:#eef5ff;background:radial-gradient(ellipse at 52% 42%,#293d52 0%,#111c2b 52%,#080e18 100%);font-family:Arial,sans-serif;touch-action:pan-y}
#lobby *{box-sizing:border-box}
.lobby-wrap{width:100%;height:100%;max-width:1500px;margin:auto;padding:clamp(7px,1.3vw,16px);display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:clamp(6px,1vh,12px)}
.lobby-header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 12px;background:#0b1422e8;border:1px solid #35465c;border-radius:12px;min-height:48px}
.brand{font-weight:1000;letter-spacing:2px;color:#ffb34d;font-size:clamp(15px,2vw,25px);white-space:nowrap;text-shadow:0 0 16px #ff8a263d}
.header-right{display:flex;align-items:center;justify-content:flex-end;gap:6px;flex-wrap:nowrap}
.currency,.head-btn,.level{background:#172538;border:1px solid #3b506a;border-radius:8px;padding:6px 9px;font-weight:800;font-size:clamp(9px,1vw,12px);white-space:nowrap}
.currency b{color:#ffc15c;margin-left:3px}.head-btn{color:#eaf3ff;cursor:pointer}
.level{min-width:95px}.level small{display:block;color:#aebdd0;margin-bottom:3px;font-size:9px}
.level-bar{height:4px;background:#34465c;border-radius:9px;overflow:hidden}.level-bar i{display:block;width:62%;height:100%;background:linear-gradient(90deg,#ff8a26,#ffd16c)}
.lobby-layout{display:grid;grid-template-columns:clamp(105px,13vw,165px) minmax(0,1fr) clamp(145px,19vw,235px);gap:clamp(6px,1vw,12px);min-height:0}
.lobby-nav,.lobby-character,.weapon-card,.lobby-content{background:#0d1725df;border:1px solid #33475e;border-radius:13px;box-shadow:0 10px 24px #0004}
.lobby-nav{padding:7px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.nav-btn{width:100%;padding:clamp(8px,1.4vh,13px) 7px;border:1px solid transparent;border-radius:8px;text-align:left;color:#c6d4e5;background:#172538;font-weight:800;font-size:clamp(9px,1vw,12px);cursor:pointer}
.nav-btn.active{color:#fff;background:linear-gradient(100deg,#a94e1b,#e58a2d);border-color:#ffbd67;box-shadow:0 0 16px #ff8a2638}
.lobby-center{display:grid;grid-template-rows:auto minmax(0,1fr);gap:7px;min-width:0;min-height:0}
.lobby-content{padding:8px 11px;min-height:50px;max-height:105px;overflow:auto}
.lobby-content h2{margin:0 0 4px;color:#ffc16a;font-size:clamp(12px,1.4vw,17px)}
.lobby-content p{margin:0;color:#b8c7d8;font-size:clamp(9px,1vw,12px);line-height:1.35}
.lobby-character{position:relative;overflow:hidden;min-height:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 72%,#34475a 0%,#182638 45%,#0d1725 78%)}
.character-glow{position:absolute;width:min(28vh,220px);height:min(28vh,220px);border-radius:50%;background:#ff8b2420;filter:blur(18px);bottom:5px}
.character-placeholder{position:relative;width:110px;height:205px;transform:scale(clamp(.65, .23 + 0.0012 * 100vh, 1));filter:drop-shadow(0 10px 14px #0009)}
.char-head{position:absolute;top:15px;left:36px;width:38px;height:42px;border-radius:42% 42% 35% 35%;background:linear-gradient(135deg,#b9c5d0,#596b7c);border:3px solid #26384a}
.char-hood{position:absolute;top:4px;left:26px;width:58px;height:62px;border:7px solid #111923;border-radius:48% 48% 35% 35%;box-shadow:inset 0 0 0 2px #a35cff}
.char-body{position:absolute;top:60px;left:20px;width:70px;height:85px;background:linear-gradient(110deg,#121a27,#344357 55%,#111923);clip-path:polygon(20% 0,80% 0,100% 100%,0 100%);border-bottom:4px solid #a35cff}
.char-arm{position:absolute;top:68px;width:21px;height:78px;background:#202d3d;border-radius:12px}.char-arm.left{left:8px;transform:rotate(9deg)}.char-arm.right{right:8px;transform:rotate(-9deg)}
.char-leg{position:absolute;top:138px;width:27px;height:64px;background:linear-gradient(#29394b,#111923);border-radius:8px}.char-leg.left{left:25px}.char-leg.right{right:25px}
.character-label{position:absolute;bottom:7px;left:8px;right:8px;text-align:center;font-size:9px;color:#b8c9dc;letter-spacing:1px}
.weapon-card{padding:9px;display:flex;flex-direction:column;justify-content:center;gap:7px;min-height:0}
.weapon-card h3{margin:0;color:#ffc16a;font-size:clamp(11px,1.2vw,15px)}
 .weapon-visual{height:clamp(45px,10vh,95px);border-radius:9px;background:linear-gradient(135deg,#1d3045,#101a29);display:flex;align-items:center;justify-content:center;color:#e7edf5;font-size:30px;text-shadow:0 0 18px #64cfff}
.weapon-name{font-weight:900;font-size:clamp(10px,1.1vw,14px)}.weapon-skin{font-size:clamp(8px,.9vw,11px);color:#aebed0}
.stat{font-size:clamp(8px,.9vw,11px);color:#c6d4e5}.stat-line{height:4px;background:#293b50;border-radius:8px;margin-top:3px;overflow:hidden}.stat-line i{display:block;height:100%;background:linear-gradient(90deg,#ff8428,#ffd36d)}
.lobby-footer{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 10px;background:#0b1422e8;border:1px solid #35465c;border-radius:12px;min-height:48px}
.mode-area{display:flex;align-items:center;gap:10px;min-width:0}.mode-label{font-size:9px;color:#9fb0c4;letter-spacing:1px}#modeName{font-size:clamp(10px,1.2vw,14px);font-weight:900;color:#fff}
.mode-change,.start-match{border:0;border-radius:9px;padding:10px 13px;font-weight:1000;cursor:pointer;white-space:nowrap;font-size:clamp(9px,1vw,12px)}
.mode-change{background:#24364c;color:#dce9f8;border:1px solid #4a607a}
.start-match{min-width:clamp(145px,20vw,220px);color:#201407;background:linear-gradient(110deg,#ff8a26,#ffd16c);box-shadow:0 0 22px #ff982b55;animation:lobbyPulse 2s infinite}
@keyframes lobbyPulse{50%{box-shadow:0 0 26px #ff982b99;transform:translateY(-1px)}}
.lobby-toast{position:fixed;z-index:50;left:50%;bottom:16%;transform:translate(-50%,12px);padding:10px 14px;border-radius:9px;background:#102b25;border:1px solid #39c78a;color:#bfffe1;font-weight:800;font-size:11px;opacity:0;pointer-events:none;transition:.2s}
.lobby-toast.show{opacity:1;transform:translate(-50%,0)}
.arsenal-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:7px}
.arsenal-item{padding:7px;border:1px solid #344a62;border-radius:8px;background:#142235;min-width:0}
.arsenal-item strong{display:block;font-size:clamp(8px,.9vw,11px);margin-bottom:4px}.arsenal-item span{display:block;color:#aebed0;font-size:8px;margin-bottom:6px}
.arsenal-item button{width:100%;padding:6px;border:0;border-radius:6px;background:#e88a32;color:#1b1209;font-weight:900;font-size:9px;cursor:pointer}
#lobbyPortraitHint{display:none}
@media (orientation:portrait){
 #lobbyPortraitHint{display:flex;position:absolute;inset:0;z-index:99;background:#080e18;color:#fff;align-items:center;justify-content:center;text-align:center;padding:24px;font-weight:900}
 .lobby-wrap{visibility:hidden}
}
@media (max-height:420px) and (orientation:landscape){
 .lobby-wrap{padding:5px;gap:5px}.lobby-header{min-height:38px;padding:4px 8px}.lobby-footer{min-height:39px;padding:4px 8px}
 .nav-btn{padding:6px}.lobby-content{min-height:38px;padding:5px 8px}.lobby-content h2{font-size:12px}.lobby-content p{font-size:9px}
 .weapon-card{gap:4px;padding:6px}.weapon-visual{height:42px}.character-label{font-size:8px}
}


/* ===== SISTEMAS MEGAMAPA / LOOT / ZONA ===== */
#matchInfo{position:absolute;left:12px;top:66px;display:none;gap:6px;flex-direction:column;max-width:220px}
#matchInfo .panel{font-size:11px;padding:6px 9px}
#aliveHud{position:absolute;right:12px;top:112px;background:linear-gradient(135deg,#0a1a2beF,#152d45eF);border:1px solid #55d8f4;border-radius:10px;padding:8px 12px;font-weight:1000;box-shadow:0 0 18px #25c9f455;text-shadow:0 2px 3px #000;font-size:13px;z-index:13}
#endMatchPanel{display:none;position:fixed;inset:0;z-index:150;background:#030914d9;align-items:center;justify-content:center;padding:18px;text-align:center}
#endMatchCard{width:min(430px,92vw);padding:26px 20px;border:2px solid #55d8f4;border-radius:18px;background:linear-gradient(145deg,#102c47,#071321);box-shadow:0 0 45px #25c9f455}
#endMatchCard h2{font-size:clamp(26px,5vw,42px);margin:0 0 8px;color:#ffe16b;text-shadow:0 0 18px #ffb52e66}
#endMatchCard p{color:#d4e7f7}#returnLobby{border:0;border-radius:10px;padding:13px 22px;background:linear-gradient(100deg,#ff9a27,#ffe16b);font-weight:1000;color:#172638}
#lootHint{position:absolute;left:50%;bottom:22%;transform:translateX(-50%);display:none;background:#122436eF;border:1px solid #ffc15c;border-radius:8px;padding:8px 12px;font-size:12px;font-weight:bold;white-space:nowrap}
#inventoryPanel{width:min(94vw,700px);background:linear-gradient(145deg,#172c43f5,#081522f8);border:2px solid #4acbe9}
#inventoryPanel .bag-layout{display:grid;grid-template-columns:1.1fr 1fr;gap:10px;margin-top:12px}
.bag-section{background:#0a1929;border:1px solid #34516b;border-radius:10px;padding:10px;min-width:0}
.bag-section h4{margin:0 0 8px;color:#62dcf4;font-size:12px;letter-spacing:1px}
.bag-weapon{display:flex;align-items:center;gap:9px;background:linear-gradient(100deg,#1a3853,#102237);border:1px solid #42647d;border-radius:8px;padding:9px;margin:6px 0;font-size:11px}
.bag-weapon .bag-gun-icon{font-size:23px;color:#ffd76a}
.bag-weapon small{display:block;color:#a9c0d5;margin-top:3px}
.bag-item{background:#152b40;border:1px solid #34516b;border-radius:7px;padding:8px;font-size:10px;margin:5px 0}
.bag-item button{float:right;background:#1c9bb7;color:#fff;border:0;border-radius:5px;padding:5px;font-size:9px;font-weight:900}
@media(max-width:560px){#inventoryPanel .bag-layout{grid-template-columns:1fr}#aliveHud{top:105px;right:7px;font-size:10px;padding:6px 8px}}
#inventoryPanel,#buyPanel{display:none;position:fixed;z-index:22;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,520px);max-height:82vh;overflow:auto;background:#101c2bea;border:2px solid #f2a343;border-radius:13px;padding:14px;color:#eef5ff;pointer-events:auto;box-shadow:0 15px 50px #0009}
#inventoryPanel h3,#buyPanel h3{margin:0 0 10px;color:#ffc15c}
.panel-close{float:right;background:#e88a32;color:#201407;border:0;border-radius:6px;padding:6px 10px;font-weight:bold}
#inventoryList,.shop-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.skin-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.skin-card{background:linear-gradient(145deg,#203650,#101b2b);border:1px solid #49627c;border-radius:10px;padding:8px;text-align:center;min-width:0}
.skin-preview{height:92px;border-radius:8px;margin-bottom:7px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;font-size:39px;text-shadow:0 3px 8px #0009}
.skin-card b{display:block;font-size:10px;color:#fff;margin-bottom:4px}.skin-card small{display:block;color:#b9c9dc;font-size:8px;min-height:25px}
.skin-card button{margin-top:7px;width:100%;padding:7px 3px;border:0;border-radius:6px;background:#f0a13e;color:#201407;font-weight:900;font-size:9px}
.skin-card.equipped{border-color:#52e0a0;box-shadow:0 0 12px #35d99545}
@media(max-width:650px){.skin-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.inv-item,.shop-item{background:#1a2b40;border:1px solid #40536a;border-radius:8px;padding:8px;font-size:11px}
.inv-item b,.shop-item b{display:block;margin-bottom:3px}
.shop-item button{margin-top:6px;width:100%;padding:7px;border:0;border-radius:6px;background:#f0a13e;color:#201407;font-weight:bold}
#zoneNotice{position:absolute;top:56px;left:50%;transform:translateX(-50%);display:none;background:#172435eF;border:1px solid #79c9ff;border-radius:8px;padding:7px 12px;font-size:11px;font-weight:bold;white-space:nowrap}
#mapLegend{position:absolute;bottom:10px;left:10px;background:#102033df;padding:7px 9px;border-radius:7px;font-size:10px;line-height:1.6}
@media(max-width:650px){#matchInfo{top:60px;max-width:165px}#matchInfo .panel{font-size:9px}#inventoryList,.shop-list{grid-template-columns:1fr}}


/* Skins visíveis no lobby, com silhuetas e paletas distintas */
.character-placeholder{animation:lobbyIdle 2.7s ease-in-out infinite;transform-origin:50% 100%}
@keyframes lobbyIdle{0%,100%{translate:0 0}50%{translate:0 -4px}}
#characterStage[data-skin="detective"] .char-body{background:linear-gradient(110deg,#080d16,#202a39 58%,#087fc1);clip-path:polygon(12% 0,88% 0,100% 100%,0 100%);border-bottom:5px solid #19bfff}
#characterStage[data-skin="detective"] .char-hood{border-color:#19bfff;box-shadow:inset 0 0 0 2px #19bfff,0 0 13px #19bfff66}
#characterStage[data-skin="bounty"] .char-body{background:linear-gradient(110deg,#0754b8,#1676d2 55%,#ff8b22);clip-path:none;border-radius:15px;border-bottom:5px solid #ff9a24}
#characterStage[data-skin="bounty"] .char-hood{border-color:#ff8b22;box-shadow:inset 0 0 0 2px #8deaff,0 0 13px #ff8b2266}
#characterStage[data-skin="bounty"] .char-head{background:#8deaff;border-radius:45%}
#characterStage[data-skin="casual"] .char-body{background:linear-gradient(110deg,#54218b,#8a43cf 55%,#17a9a0);clip-path:none;border-radius:18px;border-bottom:5px solid #4de0d0}
#characterStage[data-skin="casual"] .char-hood{border-color:#4de0d0;box-shadow:inset 0 0 0 2px #4de0d0,0 0 13px #4de0d066}
#characterStage[data-skin="casual"] .char-head:before{content:"";position:absolute;left:-10px;top:-7px;width:12px;height:23px;background:#252b3b;clip-path:polygon(50% 0,100% 100%,0 100%)}
#characterStage[data-skin="bounty"] .char-arm,#characterStage[data-skin="bounty"] .char-leg{background:#1676d2}
#characterStage[data-skin="casual"] .char-arm,#characterStage[data-skin="casual"] .char-leg{background:#8a43cf}
#characterStage[data-skin="detective"] .char-arm,#characterStage[data-skin="detective"] .char-leg{background:#172331}


/* ===== MINI ROYALE 2.0 — HUD CARTOON VIBRANTE ===== */
:root{--mr-orange:#ff8a00;--mr-yellow:#ffe16b;--mr-cyan:#38dcff;--mr-red:#ff4058;--mr-green:#42f59b}
.panel{background:linear-gradient(135deg,rgba(13,28,43,.94),rgba(27,48,65,.88));border:2px solid var(--mr-yellow);border-radius:11px;padding:8px 12px;font-weight:900;text-shadow:0 2px 0 #07111b,0 0 7px #000;box-shadow:0 4px 0 #07111b,0 0 13px #ff9a2733}
#topbar{gap:7px;align-items:flex-start}
#topbar .panel{font-size:clamp(10px,1.3vw,14px);border-color:var(--mr-cyan);background:linear-gradient(135deg,#102c45ed,#1c4058ed);clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px)}
#topbar .panel:nth-child(2){border-color:var(--mr-yellow)}
#topbar .panel:nth-child(3){border-color:#a66cff;color:#d8c2ff}
#jumpInfo{border-color:var(--mr-yellow);background:linear-gradient(110deg,#162b43f2,#28435bf2);font-size:clamp(12px,1.6vw,18px);box-shadow:0 4px 0 #07111b,0 0 18px #ffb52e55}
#speed{border:2px solid var(--mr-orange);background:#142b40ed;font-weight:1000;box-shadow:0 4px 0 #07111b}
#crosshair{width:34px;height:34px;filter:drop-shadow(0 1px 2px #000)}
#crosshair:before{width:3px;height:30px;left:15px;top:2px;background:#fff;border:1px solid #17202a;transform:none}
#crosshair:after{height:3px;width:30px;top:15px;left:2px;background:#fff;border:1px solid #17202a;transform:none}
#crosshair.locked:before,#crosshair.locked:after{background:var(--mr-red);box-shadow:0 0 10px var(--mr-red)}
#controls{z-index:9}
#lookZone{width:55%;}
#moveZone{width:47%;height:56%;}
#joystick{width:120px;height:120px;border:3px solid #ffffffd9;background:radial-gradient(circle,#ffffff18,#0b1d2c66);box-shadow:0 0 18px #38dcff44}
#stick{width:52px;height:52px;left:31px;top:31px;background:linear-gradient(145deg,#ffbd39,#ff7600);border:3px solid #fff0ad;box-shadow:0 4px 0 #713600,0 0 14px #ff9a00aa}
.btn{font-weight:1000;border:4px solid #ffe08a;background:linear-gradient(145deg,#ffb52e,#ff7600);box-shadow:0 6px 0 #713600,0 0 16px #ff9a0044;text-shadow:0 2px 0 #713600;touch-action:none}
#action{width:clamp(78px,12vw,108px);height:clamp(78px,12vw,108px);font-size:clamp(12px,1.5vw,16px)}
