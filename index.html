
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MINI ROYALE</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  touch-action: none;
}

body {
  overflow: hidden;
  background: #8bc8e8;
  font-family: Arial, sans-serif;
}

canvas {
  display: block;
}

#hud {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 5;
}

#crosshair {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 12px;
  height: 12px;
  border: 2px solid white;
  border-radius: 50%;
  transform: translate(-50%, -50%);
}

#crosshair.locked {
  border-color: #ff3535;
}

#status {
  position: absolute;
  top: 15px;
  left: 15px;
  color: white;
  font-weight: bold;
  text-shadow: 1px 2px 3px black;
}

#controls {
  position: fixed;
  inset: 0;
  z-index: 10;
  pointer-events: none;
}

#joystick {
  position: absolute;
  left: 35px;
  bottom: 45px;
  width: 125px;
  height: 125px;
  border-radius: 50%;
  background: #ffffff35;
  border: 2px solid #ffffff80;
  pointer-events: auto;
}

#stick {
  position: absolute;
  width: 52px;
  height: 52px;
  left: 35px;
  top: 35px;
  border-radius: 50%;
  background: #ffffffb0;
}

.action {
  position: absolute;
  right: 35px;
  bottom: 55px;
  width: 75px;
  height: 75px;
  border-radius: 50%;
  border: 2px solid white;
  background: #d93636bb;
  color: white;
  font-weight: bold;
  pointer-events: auto;
}

#startScreen {
  position: fixed;
  inset: 0;
  background: linear-gradient(#0007,#000b);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  color: white;
  z-index: 20;
  gap: 20px;
}

#startScreen h1 {
  font-size: 38px;
  letter-spacing: 3px;
}

#startButton {
  padding: 16px 45px;
  border: none;
  border-radius: 12px;
  background: #f2b52c;
  color: #222;
  font-size: 20px;
  font-weight: bold;
}
</style>
</head>

<body>

<div id="startScreen">
  <h1>MINI ROYALE</h1>
  <p>Uma pequena ideia, um grande mundo.</p>
  <button id="startButton">JOGAR</button>
</div>

<div id="hud">
  <div id="status">MINI ROYALE</div>
  <div id="crosshair"></div>
</div>

<div id="controls">
  <div id="joystick">
    <div id="stick"></div>
  </div>

  <button class="action" id="shootButton">
    ATIRAR
  </button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

<script>
(() => {
"use strict";

// =================================
// CONFIGURAÇÃO PRINCIPAL
// =================================

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8bc8e8);
scene.fog = new THREE.Fog(0x8bc8e8, 180, 650);

const camera = new THREE.PerspectiveCamera(
  70,
  innerWidth / innerHeight,
  0.1,
  1000
);

const renderer = new THREE.WebGLRenderer({
  antialias: false,
  powerPreference: "high-performance"
});

renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.25));
renderer.outputEncoding = THREE.sRGBEncoding;

renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

document.body.appendChild(renderer.domElement);

// =================================
// ILUMINAÇÃO
// =================================

scene.add(
  new THREE.HemisphereLight(
    0xffffff,
    0x66804b,
    1.15
  )
);

const sun = new THREE.DirectionalLight(0xffffff, 1.1);

sun.position.set(100, 180, 100);
sun.castShadow = true;

sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -180;
sun.shadow.camera.right = 180;
sun.shadow.camera.top = 180;
sun.shadow.camera.bottom = -180;
sun.shadow.camera.far = 500;
sun.shadow.bias = -0.0005;

scene.add(sun);

// =================================
// MATERIAIS CARTOON
// =================================

function mat(color) {
  return new THREE.MeshLambertMaterial({
    color: color,
    flatShading: true
  });
}

// =================================
// VARIÁVEIS DO JOGO
// =================================

let gameStarted = false;
let state = "ground";

const player = {
  x: 0,
  y: 0,
  z: 0,
  speed: 10,
  rotation: 0
};

let velocity = new THREE.Vector3();
let moveInput = new THREE.Vector2();

const worldColliders = [];
const PLAYER_RADIUS = 0.75;

const clock = new THREE.Clock();

// =====================================
// SISTEMA DE COLISÃO
// =====================================

function addWorldCollider(x, z, width, depth) {
  worldColliders.push({
    minX: x - width / 2,
    maxX: x + width / 2,
    minZ: z - depth / 2,
    maxZ: z + depth / 2
  });
}

function collidesAt(x, z) {
  const r = PLAYER_RADIUS;

  for (const b of worldColliders) {
    if (
      x + r > b.minX &&
      x - r < b.maxX &&
      z + r > b.minZ &&
      z - r < b.maxZ
    ) {
      return true;
    }
  }

  return false;
}

function moveWithCollision(nextX, nextZ) {
  let x = player.x;
  let z = player.z;

  if (!collidesAt(nextX, z)) x = nextX;
  if (!collidesAt(x, nextZ)) z = nextZ;

  player.x = x;
  player.z = z;
}

// =====================================
// OBJETOS DO MAPA
// =====================================

function box(w, h, d, material, x, y, z) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    material
  );

  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;

  scene.add(mesh);
  return mesh;
}

function terrainHeight(x, z) {
  return Math.sin(x * 0.012) * 1.5 +
         Math.cos(z * 0.014) * 1.2;
}

// =====================================
// TERRENO
// =====================================

function buildGround() {
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(1200, 1200, 80, 80),
    mat(0x69a957)
  );

  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;

  const positions = ground.geometry.attributes.position;

  for (let i = 0; i < positions.count; i++) {
    const x = positions.getX(i);
    const z = -positions.getY(i);

    positions.setZ(i, terrainHeight(x, z));
  }

  ground.geometry.computeVertexNormals();
  scene.add(ground);

  // Água decorativa.
  const water = new THREE.Mesh(
    new THREE.PlaneGeometry(1200, 1200),
    mat(0x4aadd0)
  );

  water.rotation.x = -Math.PI / 2;
  water.position.y = -5;
  scene.add(water);
}

// =====================================
// PRÉDIOS
// =====================================

function district(x, z, w, d, h, color) {
  const baseY = terrainHeight(x, z);

  const wall = mat(color);
  const roofMat = mat(0x704b3d);

  const building = box(
    w, h, d,
    wall,
    x, baseY + h / 2, z
  );

  const roof = box(
    w + 0.5, 0.8, d + 0.5,
    roofMat,
    x, baseY + h + 0.4, z
  );

  addWorldCollider(x, z, w + 1.2, d + 1.2);

  // Janelas decorativas.
  const windowMat = mat(0x85c9dc);

  for (let side = -1; side <= 1; side += 2) {
    for (let row = 0; row < 2; row++) {
      box(
        1.3, 1.2, 0.12,
        windowMat,
        x + side * (w / 2 + 0.07),
        baseY + 2 + row * 2.3,
        z
      );
    }
  }

  return building;
}

function smallHouse(x, z) {
  const w = 8;
  const d = 8;
  const h = 5;
  const y = terrainHeight(x, z);

  box(
    w, h, d,
    mat(0xc5b28c),
    x, y + h / 2, z
  );

  box(
    w + 1, 1, d + 1,
    mat(0x875b45),
    x, y + h + 0.5, z
  );

  addWorldCollider(x, z, w + 1.2, d + 1.2);
}

// =====================================
// ÁRVORES
// =====================================

function tree(x, z) {
  const y = terrainHeight(x, z);

  box(
    1.2, 4, 1.2,
    mat(0x79502f),
    x, y + 2, z
  );

  const crown = new THREE.Mesh(
    new THREE.IcosahedronGeometry(3.2, 1),
    mat(0x278744)
  );

  crown.position.set(x, y + 5, z);
  crown.castShadow = true;
  scene.add(crown);

  addWorldCollider(x, z, 1.8, 1.8);
}

// =====================================
// ROCHAS
// =====================================

function rock(x, z, size) {
  const y = terrainHeight(x, z);

  const mesh = new THREE.Mesh(
    new THREE.DodecahedronGeometry(size, 0),
    mat(0x777b72)
  );

  mesh.position.set(x, y + size * 0.5, z);
  mesh.scale.y = 0.65;
  mesh.castShadow = true;

  scene.add(mesh);

  addWorldCollider(x, z, size * 1.8, size * 1.8);
}

// =====================================
// CONSTRUÇÃO DO MAPA
// =====================================

function buildMap() {
  buildGround();

  // Cidade principal.
  for (let x = -55; x <= 55; x += 25) {
    for (let z = -55; z <= 55; z += 25) {
      if (Math.abs(x) < 10 && Math.abs(z) < 10) continue;

      district(
        x, z,
        12, 12,
        9 + Math.random() * 8,
        [0xc5b28c, 0xd18b64, 0xb6c5ce][
          Math.floor(Math.random() * 3)
        ]
      );
    }
  }

  // Vila.
  for (let i = 0; i < 18; i++) {
    const x = 130 + Math.random() * 100;
    const z = -150 + Math.random() * 100;
    smallHouse(x, z);
  }

  // Área industrial.
  for (let i = 0; i < 8; i++) {
    district(
      -200 + i * 28,
      150,
      20, 24, 12,
      0x89949b
    );
  }

  // Florestas.
  for (let i = 0; i < 180; i++) {
    const x = (Math.random() - 0.5) * 1000;
    const z = (Math.random() - 0.5) * 1000;

    if (Math.abs(x) < 90 && Math.abs(z) < 90) continue;

    tree(x, z);
  }

  // Rochas.
  for (let i = 0; i < 60; i++) {
    const x = (Math.random() - 0.5) * 1000;
    const z = (Math.random() - 0.5) * 1000;

    rock(x, z, 1.5 + Math.random() * 2);
  }
}

// =====================================
// PERSONAGEM
// =====================================

const playerGroup = new THREE.Group();

const body = new THREE.Mesh(
  new THREE.CapsuleGeometry(0.65, 1.2, 4, 8),
  mat(0x252538)
);

body.position.y = 1.1;
body.castShadow = true;
playerGroup.add(body);

const head = new THREE.Mesh(
  new THREE.SphereGeometry(0.42, 12, 10),
  mat(0xd9a47c)
);

head.position.y = 2.1;
head.castShadow = true;
playerGroup.add(head);

scene.add(playerGroup);

// =====================================
// CÂMERA EM TERCEIRA PESSOA
// =====================================

let cameraYaw = 0;
let cameraPitch = 0.18;

function updateCamera() {
  const distance = 8;

  const targetX = player.x - Math.sin(cameraYaw) * distance;
  const targetZ = player.z - Math.cos(cameraYaw) * distance;
  const targetY = player.y + 4;

  camera.position.set(
    targetX,
    targetY + cameraPitch * 5,
    targetZ
  );

  camera.lookAt(
    player.x,
    player.y + 1.5,
    player.z
  );
}

// =====================================
// JOYSTICK
// =====================================

const joystick = document.getElementById("joystick");
const stick = document.getElementById("stick");

let joystickPointer = null;

function resetJoystick() {
  moveInput.set(0, 0);
  stick.style.left = "35px";
  stick.style.top = "35px";
}

joystick.addEventListener("pointerdown", e => {
  joystickPointer = e.pointerId;
  joystick.setPointerCapture(e.pointerId);
  updateJoystick(e);
});

joystick.addEventListener("pointermove", e => {
  if (e.pointerId !== joystickPointer) return;
  updateJoystick(e);
});

joystick.addEventListener("pointerup", e => {
  if (e.pointerId !== joystickPointer) return;
  joystickPointer = null;
  resetJoystick();
});

joystick.addEventListener("pointercancel", resetJoystick);

function updateJoystick(e) {
  const rect = joystick.getBoundingClientRect();

  let dx = e.clientX - (rect.left + rect.width / 2);
  let dy = e.clientY - (rect.top + rect.height / 2);

  const max = 38;
  const length = Math.hypot(dx, dy);

  if (length > max) {
    dx = dx / length * max;
    dy = dy / length * max;
  }

  moveInput.set(dx / max, dy / max);

  stick.style.left = (35 + dx) + "px";
  stick.style.top = (35 + dy) + "px";
}

// =====================================
// CONTROLE DA CÂMERA PELO TOQUE
// =====================================

let lookPointer = null;
let lastLookX = 0;
let lastLookY = 0;

renderer.domElement.addEventListener("pointerdown", e => {
  if (e.clientX < innerWidth * 0.4) return;

  lookPointer = e.pointerId;
  lastLookX = e.clientX;
  lastLookY = e.clientY;

  renderer.domElement.setPointerCapture(e.pointerId);
});

renderer.domElement.addEventListener("pointermove", e => {
  if (e.pointerId !== lookPointer) return;

  const dx = e.clientX - lastLookX;
  const dy = e.clientY - lastLookY;

  cameraYaw -= dx * 0.005;
  cameraPitch -= dy * 0.002;

  cameraPitch = THREE.MathUtils.clamp(
    cameraPitch,
    -0.25,
    0.8
  );

  lastLookX = e.clientX;
  lastLookY = e.clientY;
});

renderer.domElement.addEventListener("pointerup", e => {
  if (e.pointerId === lookPointer) lookPointer = null;
});

renderer.domElement.addEventListener("pointercancel", () => {
  lookPointer = null;
});

// =====================================
// TIRO SIMPLES
// =====================================

const bullets = [];

function shoot() {
  if (!gameStarted) return;

  const direction = new THREE.Vector3();
  camera.getWorldDirection(direction);

  const bullet = new THREE.Mesh(
    new THREE.SphereGeometry(0.12, 6, 6),
    mat(0xffd54a)
  );

  bullet.position.copy(camera.position);
  bullet.userData.velocity = direction.multiplyScalar(65);
  bullet.userData.life = 1.5;

  scene.add(bullet);
  bullets.push(bullet);
}

document.getElementById("shootButton")
  .addEventListener("pointerdown", e => {
    e.preventDefault();
    shoot();
  });

// =====================================
// ATUALIZAÇÃO DOS PROJÉTEIS
// =====================================

function updateBullets(dt) {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];

    b.position.addScaledVector(b.userData.velocity, dt);
    b.userData.life -= dt;

    if (b.userData.life <= 0) {
      scene.remove(b);
      b.geometry.dispose();
      b.material.dispose();
      bullets.splice(i, 1);
    }
  }
}

// =====================================
// MOVIMENTAÇÃO
// =====================================

function updatePlayer(dt) {
  const forward = new THREE.Vector3(
    -Math.sin(cameraYaw),
    0,
    -Math.cos(cameraYaw)
  );

  const right = new THREE.Vector3(
    Math.cos(cameraYaw),
    0,
    -Math.sin(cameraYaw)
  );

  velocity.set(0, 0, 0);

  velocity.addScaledVector(forward, -moveInput.y);
  velocity.addScaledVector(right, moveInput.x);

  if (velocity.lengthSq() > 0) {
    velocity.normalize();

    const speed = player.speed * dt;

    moveWithCollision(
      player.x + velocity.x * speed,
      player.z + velocity.z * speed
    );

    playerGroup.rotation.y = Math.atan2(
      velocity.x,
      velocity.z
    );
  }

  playerGroup.position.set(
    player.x,
    terrainHeight(player.x, player.z),
    player.z
  );

  player.y = terrainHeight(player.x, player.z);
}

// =====================================
// INÍCIO DA PARTIDA
// =====================================

function startGame() {
  if (gameStarted) return;

  gameStarted = true;

  document.getElementById("startScreen").style.display = "none";

  player.x = 0;
  player.z = 0;

  updateCamera();
}

document.getElementById("startButton")
  .addEventListener("click", startGame);

// =====================================
// REDIMENSIONAMENTO
// =====================================

window.addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();

  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.25));
});

// =====================================
// LOOP PRINCIPAL
// =====================================

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);

  if (gameStarted) {
    updatePlayer(dt);
    updateCamera();
    updateBullets(dt);
  }

  renderer.render(scene, camera);
}

// =====================================
// CONSTRUÇÃO DO MUNDO
// =====================================

buildMap();
updateCamera();
animate();

})();
</script>
</body>
</html>
