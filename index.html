<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Free Fire 2020 - Web Edition</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030712;color:#fff;font-family:'Segoe UI',Arial,sans-serif;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:1}

/* Lobby Clássico 2020 */
#lobby{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at center, #1e293b 0%, #090d16 100%);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:30px}
.lobby-header{font-size:clamp(22px, 5vw, 38px);font-weight:900;color:#facc15;text-shadow:3px 3px 0 #b91c1c;letter-spacing:2px;margin-top:20px}
.char-container{display:flex;gap:15px;margin:20px 0}
.char-card{padding:14px 24px;background:rgba(255,255,255,0.08);border:2px solid #facc15;border-radius:12px;font-weight:bold;font-size:16px;cursor:pointer}
.char-card.active{background:#facc15;color:#000;box-shadow:0 0 15px rgba(250,204,21,0.6)}
#playButton{width:100%;max-width:300px;padding:18px;border:none;border-radius:14px;background:linear-gradient(180deg,#f97316,#b91c1c);color:#fff;font-size:24px;font-weight:900;box-shadow:0 6px 0 #7f1d1d;cursor:pointer;margin-bottom:30px;text-transform:uppercase;letter-spacing:1px}
#playButton:active{transform:translateY(4px);box-shadow:0 2px 0 #7f1d1d}

/* HUD Clássica Free Fire 2020 */
#gameHUD{display:none;position:fixed;inset:0;z-index:50;pointer-events:none}
#topBar{position:absolute;top:15px;left:15px;display:flex;gap:8px;pointer-events:auto}
.badge{background:rgba(0,0,0,0.65);border:1px solid rgba(255,255,255,0.2);padding:6px 12px;border-radius:6px;font-size:12px;font-weight:bold}
#killCount{color:#ef4444}
#aliveCount{color:#facc15}

/* Minimapa Circular 2020 */
#minimap{position:absolute;top:15px;right:15px;width:90px;height:90px;border-radius:50%;background:rgba(15,23,42,0.8);border:2px solid #facc15;overflow:hidden;pointer-events:auto;box-shadow:0 4px 10px rgba(0,0,0,0.5)}
#minimapPlayer{position:absolute;top:50%;left:50%;width:8px;height:8px;margin:-4px;background:#3b82f6;border-radius:50%;border:1px solid #fff}

/* Joystick Esquerdo (Movimento) */
#joystick{position:absolute;bottom:30px;left:30px;width:120px;height:120px;border:2px solid rgba(255,255,255,0.25);border-radius:50%;background:rgba(0,0,0,0.25);pointer-events:auto;touch-action:none}
#stick{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px;border:2px solid #fff;border-radius:50%;background:rgba(255,255,255,0.65);box-shadow:0 2px 5px rgba(0,0,0,0.3)}

#cameraTouchArea{position:absolute;right:0;top:0;width:55%;height:100
