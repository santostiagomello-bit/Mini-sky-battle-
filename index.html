<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MINI ROYALE - Jogável</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #87CEEB; font-family: sans-serif; color: #fff; }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* HUD Superior */
        #hud { position: absolute; top: 0; left: 0; width: 100%; z-index: 5; pointer-events: none; display: none; justify-content: space-between; padding: 15px; }
        .panel { background: rgba(0, 0, 0, 0.8); border: 2px solid #ff6600; padding: 8px 14px; border-radius: 6px; font-size: 13px; font-weight: bold; color: #ffdfba; }

        /* HUD do Salto */
        #skydive-hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 8; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 25px; }
        .skydive-info { background: rgba(0,0,0,0.85); border: 2px solid #ff6600; padding: 10px 18px; border-radius: 8px; font-size: 15px; font-weight: bold; text-align: center; width: 260px; margin: 0 auto; color: #fff; }
        
        /* Mira */
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 22px; height: 22px; z-index: 4; pointer-events: none; display: none; }
        .cross-line { position: absolute; background: #ffffff; box-shadow: 0 0 4px rgba(0,0,0,0.9); }
        #c-top { top: 0; left: 10px; width: 2px; height: 8px; }
        #c-bottom { bottom: 0; left: 10px; width: 2px; height: 8px; }
        #c-left { top: 10px; left: 0; width: 8px; height: 2px; }
        #c-right { top: 10px; right: 0; width: 8px; height: 2px; }
        #crosshair.locked .cross-line { background: #ff1e1e; box-shadow: 0 0 8px #ff1e1e; }

        /* Controles Mobile */
        #controls { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        .zone-left { position: absolute; bottom: 0; left: 0; width: 50%; height: 100%; pointer-events: auto; }
        .zone-right { position: absolute; bottom: 0; right: 0; width: 50%; height: 100%; pointer-events: auto; }

        #joystick { position: absolute; bottom: 40px; left: 40px; width: 100px; height: 100px; background: rgba(255,255,255,0.2); border: 2px solid #ff6600; border-radius: 50%; display: none; }
        #stick { position: absolute; top: 25px; left: 25px; width: 50px; height: 50px; background: #ff6600; border-radius: 50%; }

        .btn-action { position: absolute; border-radius: 50%; color: #fff; font-weight: bold; display: flex; align-items: center; justify-content: center; pointer-events: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.4); text-transform: uppercase; z-index: 20; }
        #btn-jump { right: 40px; bottom: 40px; width: 95px; height: 95px; background: rgba(255, 130, 0, 0.9); border: 4px solid #ffaa00; font-size: 16px; }
        #btn-fire { right: 30px; bottom: 35px; width: 78px; height: 78px; background: rgba(255, 50, 50, 0.6); border: 3px solid #ff3333; font-size: 13px; display: none; }
        #btn-ads { right: 120px; bottom: 45px; width: 58px; height: 58px; background: rgba(255, 102, 0, 0.6); border: 2px solid #ff6600; font-size: 11px; display: none; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>
    
    <div id="crosshair">
        <div id="c-top" class="cross-line"></div>
        <div id="c-bottom" class="cross-line"></div>
        <div id="c-left" class="cross-line"></div>
        <div id="c-right" class="cross-line"></div>
    </div>

    <div id="hud">
        <div class="panel">HP: <span id="hp">100</span></div>
        <div class="panel">ABATES: <span id="kills">0</span></div>
    </div>

    <div id="skydive-hud">
        <div class="skydive-info" id="altitude-display">ALTITUDE: 150m</div>
        <div style="text-align: center; width: 100%;">
            <div id="speed-display" style="font-size: 15px; color: #ffffff; font-weight: bold; background: rgba(0,0,0,0.7); padding: 6px 12px; border-radius: 6px; display: inline-block;">VELOCIDADE: 190 km/h</div>
        </div>
    </div>

    <div id="controls">
        <div id="zone-left" class="zone-left">
            <div id="joystick"><div id="stick"></div></div>
        </div>
        <div id="zone-right" class="zone-right">
            <div id="btn-jump" class="btn-action">SALTAR</div>
            <div id="btn-fire" class="btn-action">ATIRAR</div>
            <div id="btn-ads" class="btn-action">MIRA</div>
        </div>
    </div>

    <script>
        let scene, camera, renderer;
        let bots = [];
        let moveDir = { x: 0, z: 0 };
        let lockedTarget = null;
        let playerArms, weaponMesh;
        let walkTime = 0;

        let gameState = 0; // 0: Salto | 1: Queda | 2: Paraquedas | 3: Solo FPS
        
        let player = {
            x: 0, y: 150, z: 0,
            horizontalSpeed: 0.6,
            rotY: 0,
            rx: 0,
            hp: 100,
            kills: 0,
            isADS: false
        };

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(initGame, 100);
        });

        function initGame() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB); // Céu azul claro visível

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            scene.add(camera);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Luzes fortes para iluminar o cenário
            scene.add(new THREE.AmbientLight(0xffffff, 1.0));
            let sun = new THREE.DirectionalLight(0xffffff, 1.0);
            sun.position.set(50, 100, 50);
            scene.add(sun);

            // Chão verde/marrom bem visível
            let floor = new THREE.Mesh(
                new THREE.PlaneGeometry(400, 400),
                new THREE.MeshLambertMaterial({ color: 0x55aa55 })
            );
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            createOpenWorldMap();

            for (let i = 0; i < 6; i++) {
                spawnBarakaBot();
            }

            setupControls();
            window.addEventListener('resize', onResize);
            animate();
        }
