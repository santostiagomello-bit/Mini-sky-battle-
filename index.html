<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VANGUARD 3D - FPS Tático</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #0b0f19; font-family: system-ui, -apple-system, sans-serif; color: #fff; }
        #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        /* MENU INICIAL */
        #menu-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 10;
            background: radial-gradient(circle at center, #111827 0%, #030712 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: 20px; overflow-y: auto;
        }
        .menu-card {
            background: rgba(17, 24, 39, 0.9); border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 16px; padding: 25px; width: 100%; max-width: 600px; text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); backdrop-filter: blur(10px);
        }
        h1 { font-size: 1.8rem; font-weight: 900; letter-spacing: 2px; color: #60a5fa; margin-bottom: 8px; text-transform: uppercase; }
        p { font-size: 0.85rem; color: #9ca3af; margin-bottom: 20px; }
        .weapons-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .weapon-option {
            background: rgba(31, 41, 55, 0.8); border: 2px solid rgba(75, 85, 99, 0.4);
            border-radius: 10px; padding: 12px 8px; cursor: pointer; transition: all 0.2s;
        }
        .weapon-option.selected { border-color: #3b82f6; background: rgba(59, 130, 246, 0.15); }
        .weapon-option h3 { font-size: 0.95rem; color: #fff; margin-bottom: 4px; }
        .weapon-option span { font-size: 0.7rem; color: #9ca3af; }
        
        #start-btn {
            width: 100%; background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: white; border: none; padding: 16px; font-size: 1.1rem; font-weight: bold;
            border-radius: 10px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4); transition: transform 0.1s;
        }
        #start-btn:active { transform: scale(0.98); }

        /* HUD DE JOGO */
        #hud { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none; display: none; }
        .hud-element { pointer-events: auto; }
        
        #crosshair {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 8px; height: 8px; border: 2px solid rgba(255,255,255,0.8); border-radius: 50%;
        }
        
        #top-bar {
            position: absolute; top: 15px; left: 20px; right: 20px; display: flex; justify-content: space-between; align-items: center;
        }
        .stat-box { background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.1); padding: 8px 16px; border-radius: 8px; font-weight: bold; font-size: 0.9rem; }
        
        /* CONTROLES MOBILE */
        #joystick-zone {
            position: absolute; bottom: 30px; left: 30px; width: 120px; height: 120px;
            background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.15); border-radius: 50%;
        }
        #joystick-knob {
            position: absolute; top: 35px; left: 35px; width: 50px; height: 50px;
            background: rgba(255,255,255,0.3); border-radius: 50%; pointer-events: none;
        }
        
        #action-buttons {
            position: absolute; bottom: 30px; right: 30px; display: flex; gap: 15px; align-items: flex-end;
        }
        .action-btn {
            width: 65px; height: 65px; background: rgba(0,0,0,0.5); border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%; color: white; font-weight: bold; font-size: 0.8rem; display: flex;
            align-items: center; justify-content: center; backdrop-filter: blur(4px);
        }
        #btn-fire { width: 80px; height: 80px; background: rgba(220, 38, 38, 0.6); border-color: #ef4444; font-size: 0.9rem; }
    </style>
    <!-- Three.js Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- MENU -->
    <div id="menu-overlay">
        <div class="menu-card">
            <h1>VANGUARD 3D</h1>
            <p>Selecione seu armamento tático</p>
            <div class="weapons-grid">
                <div class="weapon-option selected" onclick="selectWeapon('m4', this)">
                    <h3>M4A1</h3><span>Assalto</span>
                </div>
                <div class="weapon-option" onclick="selectWeapon('mp5', this)">
                    <h3>MP5</h3><span>SMG Ágil</span>
                </div>
                <div class="weapon-option" onclick="selectWeapon('awp', this)">
                    <h3>AWP</h3><span>Sniper 338</span>
                </div>
            </div>
            <button id="start-btn" onclick="startGame()">▶ INICIAR MISSÃO</button>
        </div>
    </div>

    <!-- HUD -->
    <div id="hud">
        <div id="crosshair"></div>
        <div id="top-bar">
            <div class="stat-box" id="hp-display">HP: 100</div>
            <div class="stat-box" id="ammo-display">MUNIÇÃO: 30/90</div>
            <div class="stat-box" id="kills-display">ALVOS: 0/5</div>
        </div>
        
        <div id="joystick-zone" class="hud-element">
            <div id="joystick-knob"></div>
        </div>
        
        <div id="action-buttons">
            <div class="action-btn hud-element" id="btn-reload" onclick="reloadWeapon()">REC</div>
            <div class="action-btn hud-element" id="btn-jump" onclick="playerJump()">PULAR</div>
            <div class="action-btn hud-element" id="btn-fire" ontouchstart="shootWeapon()" onmousedown="shootWeapon()">ATIRAR</div>
        </div>
    </div>

    <script>
        let scene, camera, renderer, clock;
        let player = {
            pos: new THREE.Vector3(0, 1.7, 15),
            dir: new THREE.Vector3(0, 0, -1),
            speed: 0.08,
            hp: 100,
            ammo: 30,
            maxAmmo: 90,
            isJumping: false,
            vy: 0
        };
        let selectedWeaponType = 'm4';
        let gameStarted = false;
        let bots = [];
        let kills = 0;

        function selectWeapon(type, el) {
            selectedWeaponType = type;
            document.querySelectorAll('.weapon-option').forEach(o => o.classList.remove('selected'));
            el.classList.add('selected');
        }

        function startGame() {
            document.getElementById('menu-overlay').style.display = 'none';
            document.getElementById('hud').style.display = 'block';
            gameStarted = true;
            
            // Entrar em tela cheia no Android
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(() => {});
            }
            
            initGameWorld();
            animate();
        }

        function initGameWorld() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0b0f19);
            scene.fog = new THREE.FogExp2(0x0b0f19, 0.015);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.copy(player.pos);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            clock = new THREE.Clock();

            // Luzes
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);
