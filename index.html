
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MINI SKY BATTLE</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#163b57;color:white}

#background{position:fixed;inset:0;z-index:0;background-image:url("lobby-bg.png");background-size:cover;background-position:center}
#background::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,20,40,.12),transparent 55%,rgba(5,20,40,.2))}

canvas{position:fixed;inset:0;z-index:1;width:100%;height:100%;pointer-events:none}
#lobby{position:fixed;inset:0;z-index:3;pointer-events:none}

#logo{position:absolute;top:3%;left:50%;transform:translateX(-50%);font-size:clamp(22px,4vw,43px);font-weight:1000;color:#ffdb38;text-shadow:3px 4px 0 #753b13,-2px -2px 0 white,2px 3px 8px #142b49;white-space:nowrap;letter-spacing:1px}

#playArea{position:absolute;top:4%;left:2%;pointer-events:auto}
#playButton{width:clamp(125px,22vw,230px);padding:13px 8px;border:3px solid #fff2a0;border-radius:16px;background:linear-gradient(#ffe95c,#ff9e19);color:#663300;font-size:clamp(17px,2.5vw,27px);font-weight:1000;box-shadow:0 6px 0 #a85a12,0 9px 15px #0007;cursor:pointer}
#playButton:active{transform:translateY(4px);box-shadow:0 2px 0 #a85a12}

#profile{position:absolute;top:19%;left:2%;width:clamp(125px,20vw,205px);padding:10px;border:2px solid #9bcfff;border-radius:13px;background:#102f50e8;font-size:clamp(11px,1.5vw,15px);font-weight:bold}
#profile small{display:block;margin-top:5px;color:#ffdc51}

#currency{position:absolute;top:4%;right:3%;padding:10px 15px;border:2px solid #9bcfff;border-radius:13px;background:#102f50e8;font-size:clamp(12px,1.8vw,18px);font-weight:bold}

#sideButtons{position:absolute;right:2%;top:34%;display:flex;flex-direction:column;gap:9px;pointer-events:auto}
.menuButton{width:clamp(115px,19vw,195px);padding:11px 5px;border:2px solid #b6ddff;border-radius:12px;background:linear-gradient(135deg,#205d91,#102d52);color:white;font-size:clamp(11px,1.6vw,16px);font-weight:900;text-shadow:1px 2px #10243b;box-shadow:0 4px 0 #0b2037;cursor:pointer}
.menuButton:active{transform:translateY(3px)}

#subtitle{position:absolute;bottom:4%;left:50%;transform:translateX(-50%);padding:9px 20px;border:2px solid #ffffffaa;border-radius:12px;background:#102f50d9;font-size:clamp(11px,1.6vw,17px);font-weight:1000;text-align:center;white-space:nowrap;text-shadow:2px 2px #142b49}

#popup{display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(300px,75%);padding:20px;border:3px solid #ffdc51;border-radius:16px;background:#123858f5;text-align:center;pointer-events:auto}
#popup button{padding:10px 25px;border:0;border-radius:9px;background:#ffbd37;color:#573000;font-weight:bold}

#gameHUD{display:none;position:fixed;inset:0;z-index:4;pointer-events:none}
#health{position:absolute;top:15px;left:15px;width:145px;padding:10px;border-radius:10px;background:#173b58dd;font-size:13px;font-weight:bold}
#healthBar{height:9px;margin-top:6px;border-radius:8px;background:#e94a3e}
#backButton{position:absolute;top:15px;right:15px;padding:10px 14px;border:2px solid white;border-radius:10px;background:#174566e8;color:white;font-weight:bold;pointer-events:auto}

#joystick{position:absolute;bottom:20px;left:22px;width:110px;height:110px;border:3px solid #ffffff99;border-radius:50%;background:#173b5877;pointer-events:auto;touch-action:none}
#stick{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;border:2px solid white;border-radius:50%;background:#ffffffbb}

#actionButton{position:absolute;right:25px;bottom:30px;width:78px;height:78px;border:3px solid white;border-radius:50%;background:#8539d9dd;color:white;font-weight:bold;pointer-events:auto;box-shadow:0 0 15px #a64cff}

#rotateMessage{display:none;position:fixed;inset:0;z-index:20;background:linear-gradient(145deg,#102d4a,#2472a3);align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:25px}
#rotateMessage .phone{font-size:75px;animation:turn 2s infinite ease-in-out}
#rotateMessage h2{font-size:25px}
#rotateMessage p{color:#d8edff}
@keyframes turn{0%,100%{transform:rotate(0deg)}50%{transform:rotate(90deg)}}

@media(orientation:portrait){#rotateMessage{display:flex}}
</style>
</head>

<body>

<div id="background"></div>

<div id="rotateMessage">
  <div class="phone">📱</div>
  <h2>MINI SKY BATTLE</h2>
  <p>Gire o celular para jogar na horizontal!</p>
</div>

<div id="lobby">
  <div id="logo">👑 MINI SKY BATTLE</div>

  <div id="playArea">
    <button id="playButton">▶ JOGAR</button>
  </div>

  <div id="profile">
    👤 JOGADOR
    <small>NÍVEL 1</small>
  </div>

  <div id="currency">🪙 0 &nbsp; 💎 0</div>

  <div id="sideButtons">
    <button class="menuButton" onclick="openMenu('PERSONAGENS')">👤 PERSONAGENS</button>
    <button class="menuButton" onclick="openMenu('LOJA')">🛒 LOJA</button>
    <button class="menuButton" onclick="openMenu('EVENTOS')">🏆 EVENTOS</button>
    <button class="menuButton" onclick="openMenu('AJUSTES')">⚙️ AJUSTES</button>
  </div>

  <div id="subtitle">PREPARE-SE PARA A BATALHA!</div>

  <div id="popup">
    <h2 id="popupTitle">MENU</h2>
    <p>Em breve, novidades por aqui!</p>
    <button onclick="closeMenu()">FECHAR</button>
  </div>
</div>

<div id="gameHUD">
  <div id="health">
    VIDA
    <div id="healthBar"></div>
    100 / 100
  </div>

  <button id="backButton">VOLTAR AO LOBBY</button>

  <div id="joystick">
    <div id="stick"></div>
  </div>

  <button id="actionButton">PULAR</button>
</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  55, window.innerWidth/window.innerHeight, 0.1, 150
);

const renderer = new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.setClearColor(0x000000,0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x557044,2));

const sun = new THREE.DirectionalLight(0xffffff,2);
sun.position.set(-10,20,10);
sun.castShadow = true;
scene.add(sun);

function mat(color,roughness=0.85){
  return new THREE.MeshStandardMaterial({color,roughness});
}

function glow(color){
  return new THREE.MeshStandardMaterial({
    color:color,
    emissive:color,
    emissiveIntensity:1.8,
    roughness:0.35
  });
}

// CENÁRIO
const environment = new THREE.Group();
scene.add(environment);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(100,100),
  mat(0x65b94e)
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
environment.add(ground);

function box(x,y,z,sx,sy,sz,material){
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(sx,sy,sz),material
  );
  mesh.position.set(x,y,z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  environment.add(mesh);
  return mesh;
}

function tree(x,z,scale=1){
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(.22*scale,.3*scale,1.5*scale,7),
    mat(0x80502d)
  );
  trunk.position.set(x,.75*scale,z);
  trunk.castShadow = true;
  environment.add(trunk);

  const leaves = new THREE.Mesh(
    new THREE.IcosahedronGeometry(1.05*scale,1),
    mat(0x367d3b)
  );
  leaves.position.set(x,1.85*scale,z);
  leaves.castShadow = true;
  environment.add(leaves);
}

function house(x,z){
  box(x,1.3,z,4,2.6,3.5,mat(0xf0d49b));

  const roof = new THREE.Mesh(
    new THREE.ConeGeometry(3.1,1.8,4),
    mat(0xd45b3c)
  );
  roof.position.set(x,3.45,z);
  roof.rotation.y = Math.PI/4;
  roof.castShadow = true;
  environment.add(roof);
}

tree(-9,-8,1.2);
tree(10,-9,1.1);
tree(-13,9,1);
tree(13,10,1.2);
tree(-17,-1,1);
tree(18,2,1);
tree(-5,17,1.1);
tree(7,18,1);

house(-9,-15);
house(11,-16);
house(-17,13);
house(18,14);

box(-3,.6,-5,1.2,1.2,1.2,mat(0xb77a39));
box(4,.6,-7,1.2,1.2,1.2,mat(0xb77a39));
box(8,.6,5,1.2,1.2,1.2,mat(0xb77a39));

// ==================================
// SHADOW ROXO - PERSONAGEM 3D
// ==================================

const player = new THREE.Group();
scene.add(player);

const black = mat(0x101018);
const blackCloth = mat(0x191923);
const purple = glow(0x9b25ff);
const purpleDark = mat(0x54218b);
const maskMaterial = mat(0x08080d);
const skin = mat(0xb87955);
const white = mat(0xffffff);
const eyeGlow = glow(0xc77aff);

function makePart(parent,geometry,material,x,y,z){
  const mesh = new THREE.Mesh(geometry,material);
  mesh.position.set(x,y,z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

// Materiais e grupos
const body = new THREE.Group();
player.add(body);

// Tronco do moletom
makePart(
  body,
  new THREE.CapsuleGeometry(.48,.65,5,12),
  blackCloth,0,1.55,0
);

// Frente do moletom
makePart(
  body,
  new THREE.BoxGeometry(.66,.75,.08),
  black,0,1.58,.405
);

// Linhas roxas no peito
makePart(body,new THREE.BoxGeometry(.055,.72,.035),purple,-.31,1.57,.46);
makePart(body,new THREE.BoxGeometry(.055,.72,.035),purple,.31,1.57,.46);
makePart(body,new THREE.BoxGeometry(.55,.045,.035),purple,0,1.22,.46);

// Cordões do capuz
makePart(body,new THREE.CylinderGeometry(.025,.025,.38,8),purple,-.12,1.82,.47);
makePart(body,new THREE.CylinderGeometry(.025,.025,.38,8),purple,.12,1.82,.47);

// Cabeça e capuz
const head = new THREE.Group();
head.position.set(0,2.58,0);
body.add(head);

// Capuz externo
const hood = makePart(
  head,
  new THREE.SphereGeometry(.59,24,18),
  black,0,.05,-.04
);
hood.scale.set(1.05,1.08,.92);

// Rosto
makePart(
  head,
  new THREE.SphereGeometry(.39,20,16),
  skin,0,.02,.25
);

// Abertura escura do capuz
makePart(
  head,
  new THREE.SphereGeometry(.43,20,16),
  blackCloth,0,.02,.23
);

// Parte frontal do rosto
makePart(
  head,
  new THREE.SphereGeometry(.32,20,16),
  skin,0,.01,.36
);

// Máscara cobrindo a parte inferior do rosto
makePart(
  head,
  new THREE.BoxGeometry(.55,.23,.13),
  maskMaterial,0,-.16,.61
);

// Faixa roxa na máscara
makePart(
  head,
  new THREE.BoxGeometry(.56,.035,.035),
  purple,0,-.08,.69
);

// Olhos
makePart(head,new THREE.SphereGeometry(.045,10,10),eyeGlow,-.13,.06,.65);
makePart(head,new THREE.SphereGeometry(.045,10,10),eyeGlow,.13,.06,.65);

// Contorno roxo ao redor do capuz
const hoodRing = makePart(
  head,
  new THREE.TorusGeometry(.43,.035,8,32),
  purple,0,.02,.43
);
hoodRing.scale.set(1,1.13,1);

// Parte superior do capuz
makePart(
  head,
  new THREE.SphereGeometry(.16,12,10),
  black,0,.52,.02
);

// Pernas com pivôs para animação
const leftLeg = new THREE.Group();
leftLeg.position.set(-.23,1.05,0);
body.add(leftLeg);

makePart(
  leftLeg,
  new THREE.BoxGeometry(.34,.78,.38),
  blackCloth,0,-.39,0
);

makePart(
  leftLeg,
  new THREE.BoxGeometry(.37,.045,.40),
  purple,0,-.18,.01
);

makePart(
  leftLeg,
  new THREE.BoxGeometry(.40,.20,.57),
  black,0,-.82,.10
);

makePart(
  leftLeg,
  new THREE.BoxGeometry(.40,.035,.50),
  purple,0,-.74,.12
);

const rightLeg = new THREE.Group();
rightLeg.position.set(.23,1.05,0);
body.add(rightLeg);

makePart(
  rightLeg,
  new THREE.BoxGeometry(.34,.78,.38),
  blackCloth,0,-.39,0
);

makePart(
  rightLeg,
  new THREE.BoxGeometry(.37,.045,.40),
  purple,0,-.18,.01
);

makePart(
  rightLeg,
  new THREE.BoxGeometry(.40,.20,.57),
  black,0,-.82,.10
);

makePart(
  rightLeg,
  new THREE.BoxGeometry(.40,.035,.50),
  purple,0,-.74,.12
);

// Braços com pivôs
const leftArm = new THREE.Group();
leftArm.position.set(-.53,1.88,0);
body.add(leftArm);

makePart(
  leftArm,
  new THREE.CapsuleGeometry(.17,.58,5,10),
  blackCloth,0,-.38,0
);

makePart(
  leftArm,
  new THREE.BoxGeometry(.34,.055,.34),
  purple,0,-.56,.03
);

makePart(
  leftArm,
  new THREE.SphereGeometry(.17,12,10),
  black,-.01,-.78,.02
);

const rightArm = new THREE.Group();
rightArm.position.set(.53,1.88,0);
body.add(rightArm);

makePart(
  rightArm,
  new THREE.CapsuleGeometry(.17,.58,5,10),
  blackCloth,0,-.38,0
);

makePart(
  rightArm,
  new THREE.BoxGeometry(.34,.055,.34),
  purple,0,-.56,.03
);

makePart(
  rightArm,
  new THREE.SphereGeometry(.17,12,10),
  black,.01,-.78,.02
);

// Pequenos detalhes roxos nas laterais do capuz
makePart(head,new THREE.BoxGeometry(.055,.42,.06),purple,-.53,.03,.05);
makePart(head,new THREE.BoxGeometry(.055,.42,.06),purple,.53,.03,.05);

// Plataforma
const platform = new THREE.Mesh(
  new THREE.CylinderGeometry(1.35,1.5,.18,32),
  mat(0x4b8b43)
);
platform.position.y = .09;
platform.receiveShadow = true;
scene.add(platform);

player.position.set(0,0,0);
player.scale.setScalar(1.15);

camera.position.set(0,4.5,9);
camera.lookAt(0,1.5,0);

// ESTADOS DO JOGO
let gameStarted = false;
let moveX = 0;
let moveZ = 0;
let jumpVelocity = 0;
let isJumping = false;
let actionTime = 0;

const lobby = document.getElementById("lobby");
const hud = document.getElementById("gameHUD");
const background = document.getElementById("background");
const popup = document.getElementById("popup");
const stick = document.getElementById("stick");
const joystick = document.getElementById("joystick");

window.openMenu = function(name){
  document.getElementById("popupTitle").textContent = name;
  popup.style.display = "block";
};

window.closeMenu = function(){
  popup.style.display = "none";
};

async function requestLandscape(){
  try{
    if(screen.orientation && screen.orientation.lock){
      await screen.orientation.lock("landscape");
    }
  }catch(error){}
}

// INICIAR PARTIDA
document.getElementById("playButton").addEventListener("click",async()=>{
  await requestLandscape();

  gameStarted = true;
  lobby.style.display = "none";
  hud.style.display = "block";
  background.style.display = "none";

  environment.visible = true;
  platform.visible = false;

  player.scale.setScalar(1);
  player.position.set(0,0,0);
  scene.background = new THREE.Color(0x8bcf75);

  camera.position.set(0,17,20);
  camera.lookAt(0,1,0);
});

// VOLTAR AO LOBBY
document.getElementById("backButton").addEventListener("click",()=>{
  gameStarted = false;

  lobby.style.display = "block";
  hud.style.display = "none";
  background.style.display = "block";

  environment.visible = false;
  platform.visible = true;
  scene.background = null;

  player.scale.setScalar(1.15);
  player.position.set(0,0,0);
  player.rotation.set(0,0,0);

  camera.position.set(0,4.5,9);
  camera.lookAt(0,1.5,0);

  stopJoystick();
});

// JOYSTICK
let joystickActive = false;
let center = {x:0,y:0};

joystick.addEventListener("pointerdown",event=>{
  if(!gameStarted)return;

  joystickActive = true;
  joystick.setPointerCapture(event.pointerId);

  const rect = joystick.getBoundingClientRect();
  center.x = rect.left+rect.width/2;
  center.y = rect.top+rect.height/2;

  updateJoystick(event);
});

joystick.addEventListener("pointermove",event=>{
  if(joystickActive)updateJoystick(event);
});

function updateJoystick(event){
  const dx = event.clientX-center.x;
  const dy = event.clientY-center.y;
  const max = 35;
  const distance = Math.sqrt(dx*dx+dy*dy);
  const factor = distance>max?max/distance:1;

  const x = dx*factor;
  const y = dy*factor;

  moveX = x/max;
  moveZ = y/max;

  stick.style.transform = `translate(${x}px,${y}px)`;
}

function stopJoystick(){
  joystickActive = false;
  moveX = 0;
  moveZ = 0;
  stick.style.transform = "translate(0px,0px)";
}

joystick.addEventListener("pointerup",stopJoystick);
joystick.addEventListener("pointercancel",stopJoystick);
joystick.addEventListener("lostpointercapture",stopJoystick);

// PULO
function jump(){
  if(!gameStarted || isJumping)return;
  isJumping = true;
  jumpVelocity = 7;
}

document.getElementById("actionButton").addEventListener("pointerdown",jump);

// TECLADO
const keys = {};

window.addEventListener("keydown",event=>{
  keys[event.key.toLowerCase()] = true;
  if(event.code==="Space")jump();
});

window.addEventListener("keyup",event=>{
  keys[event.key.toLowerCase()] = false;
});

// ANIMAÇÕES
const clock = new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);

  const delta = Math.min(clock.getDelta(),.05);
  const time = performance.now()*.001;

  if(!gameStarted){
    // Respiração e movimento suave no lobby
    body.position.y = Math.sin(time*2)*.035;
    player.rotation.y = Math.sin(time*.65)*.12;

    leftArm.rotation.x = Math.sin(time*1.5)*.035;
    rightArm.rotation.x = -Math.sin(time*1.5)*.035;

    leftLeg.rotation.x = 0;
    rightLeg.rotation.x = 0;
  }else{
    let x = moveX;
    let z = moveZ;

    if(keys["w"] || keys["arrowup"])z -= 1;
    if(keys["s"] || keys["arrowdown"])z += 1;
    if(keys["a"] || keys["arrowleft"])x -= 1;
    if(keys["d"] || keys["arrowright"])x += 1;

    const length = Math.sqrt(x*x+z*z);

    if(length>1){
      x/=length;
      z/=length;
    }

    const moving = length>.08;
    const speed = 6;

    player.position.x += x*speed*delta;
    player.position.z += z*speed*delta;

    if(moving){
      player.rotation.y = Math.atan2(x,z);
    }

    // Movimento de caminhada e corrida
    const walkSpeed = 10;
    const swing = moving ? Math.sin(time*walkSpeed)*.65 : 0;

    leftLeg.rotation.x = swing;
    rightLeg.rotation.x = -swing;

    leftArm.rotation.x = -swing*.75;
    rightArm.rotation.x = swing*.75;

    body.position.y = moving ? Math.abs(Math.sin(time*walkSpeed*2))*.045 : Math.sin(time*2)*.025;

    // Inclinação leve ao correr
    body.rotation.x = moving ? -.06 : 0;

    // Pulo
    if(isJumping){
      player.position.y += jumpVelocity*delta;
      jumpVelocity -= 18*delta;

      if(player.position.y<=0){
        player.position.y = 0;
        jumpVelocity = 0;
        isJumping = false;
      }
    }

    // Câmera seguindo o personagem
    const target = new THREE.Vector3(
      player.position.x,1,player.position.z
    );

    const desiredCamera = new THREE.Vector3(
      player.position.x,17,player.position.z+20
    );

    camera.position.lerp(desiredCamera,.06);
    camera.lookAt(target);
  }

  renderer.render(scene,camera);
}

animate();

// REDIMENSIONAR
window.addEventListener("resize",()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});
</script>

</body>
</html>
