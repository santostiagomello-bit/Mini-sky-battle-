
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MINI SKY BATTLE</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: #163b57;
  color: white;
}

#background {
  position: fixed;
  inset: 0;
  z-index: 0;
  background-image: url("lobby-bg.png");
  background-size: cover;
  background-position: center;
}

#background::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(
    180deg,
    rgba(5,20,40,.12),
    transparent 55%,
    rgba(5,20,40,.2)
  );
}

canvas {
  position: fixed;
  inset: 0;
  z-index: 1;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

#lobby {
  position: fixed;
  inset: 0;
  z-index: 3;
  pointer-events: none;
}

#logo {
  position: absolute;
  top: 3%;
  left: 50%;
  transform: translateX(-50%);
  font-size: clamp(22px, 4vw, 43px);
  font-weight: 1000;
  color: #ffdb38;
  text-shadow:
    3px 4px 0 #753b13,
    -2px -2px 0 #ffffff,
    2px 3px 8px #142b49;
  white-space: nowrap;
  letter-spacing: 1px;
}

#playArea {
  position: absolute;
  top: 4%;
  left: 2%;
  pointer-events: auto;
}

#playButton {
  width: clamp(125px, 22vw, 230px);
  padding: 13px 8px;
  border: 3px solid #fff2a0;
  border-radius: 16px;
  background: linear-gradient(#ffe95c,#ff9e19);
  color: #663300;
  font-size: clamp(17px, 2.5vw, 27px);
  font-weight: 1000;
  box-shadow: 0 6px 0 #a85a12, 0 9px 15px #0007;
  cursor: pointer;
}

#playButton:active {
  transform: translateY(4px);
  box-shadow: 0 2px 0 #a85a12;
}

#profile {
  position: absolute;
  top: 19%;
  left: 2%;
  width: clamp(125px, 20vw, 205px);
  padding: 10px;
  border: 2px solid #9bcfff;
  border-radius: 13px;
  background: #102f50e8;
  font-size: clamp(11px, 1.5vw, 15px);
  font-weight: bold;
}

#profile small {
  display: block;
  margin-top: 5px;
  color: #ffdc51;
}

#currency {
  position: absolute;
  top: 4%;
  right: 3%;
  padding: 10px 15px;
  border: 2px solid #9bcfff;
  border-radius: 13px;
  background: #102f50e8;
  font-size: clamp(12px, 1.8vw, 18px);
  font-weight: bold;
}

#sideButtons {
  position: absolute;
  right: 2%;
  top: 34%;
  display: flex;
  flex-direction: column;
  gap: 9px;
  pointer-events: auto;
}

.menuButton {
  width: clamp(115px, 19vw, 195px);
  padding: 11px 5px;
  border: 2px solid #b6ddff;
  border-radius: 12px;
  background: linear-gradient(135deg,#205d91,#102d52);
  color: white;
  font-size: clamp(11px, 1.6vw, 16px);
  font-weight: 900;
  text-shadow: 1px 2px #10243b;
  box-shadow: 0 4px 0 #0b2037;
  cursor: pointer;
}

.menuButton:active {
  transform: translateY(3px);
}

#subtitle {
  position: absolute;
  bottom: 4%;
  left: 50%;
  transform: translateX(-50%);
  padding: 9px 20px;
  border: 2px solid #ffffffaa;
  border-radius: 12px;
  background: #102f50d9;
  font-size: clamp(11px, 1.6vw, 17px);
  font-weight: 1000;
  text-align: center;
  white-space: nowrap;
  text-shadow: 2px 2px #142b49;
}

#popup {
  display: none;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%,-50%);
  width: min(300px, 75%);
  padding: 20px;
  border: 3px solid #ffdc51;
  border-radius: 16px;
  background: #123858f5;
  text-align: center;
  pointer-events: auto;
}

#popup button {
  padding: 10px 25px;
  border: 0;
  border-radius: 9px;
  background: #ffbd37;
  color: #573000;
  font-weight: bold;
}

#gameHUD {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 4;
  pointer-events: none;
}

#health {
  position: absolute;
  top: 15px;
  left: 15px;
  width: 145px;
  padding: 10px;
  border-radius: 10px;
  background: #173b58dd;
  font-size: 13px;
  font-weight: bold;
}

#healthBar {
  height: 9px;
  margin-top: 6px;
  border-radius: 8px;
  background: #e94a3e;
}

#backButton {
  position: absolute;
  top: 15px;
  right: 15px;
  padding: 10px 14px;
  border: 2px solid white;
  border-radius: 10px;
  background: #174566e8;
  color: white;
  font-weight: bold;
  pointer-events: auto;
}

#joystick {
  position: absolute;
  bottom: 20px;
  left: 22px;
  width: 110px;
  height: 110px;
  border: 3px solid #ffffff99;
  border-radius: 50%;
  background: #173b5877;
  pointer-events: auto;
  touch-action: none;
}

#stick {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 46px;
  height: 46px;
  margin: -23px;
  border: 2px solid white;
  border-radius: 50%;
  background: #ffffffbb;
}

#actionButton {
  position: absolute;
  right: 25px;
  bottom: 30px;
  width: 75px;
  height: 75px;
  border: 3px solid white;
  border-radius: 50%;
  background: #ef9b27dd;
  color: white;
  font-weight: bold;
  pointer-events: auto;
}

#rotateMessage {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 20;
  background: linear-gradient(145deg,#102d4a,#2472a3);
  align-items: center;
  justify-content: center;
  flex-direction: column;
  text-align: center;
  padding: 25px;
}

#rotateMessage .phone {
  font-size: 75px;
  animation: turn 2s infinite ease-in-out;
}

#rotateMessage h2 {
  font-size: 25px;
}

#rotateMessage p {
  color: #d8edff;
}

@keyframes turn {
  0%,100% { transform: rotate(0deg); }
  50% { transform: rotate(90deg); }
}

@media (orientation: portrait) {
  #rotateMessage {
    display: flex;
  }
}
</style>
</head>

<body>

<div id="background"></div>

<div id="rotateMessage">
  <div class="phone">📱</div>
  <h2>MINI SKY BATTLE</h2>
  <p>Gire o celular para jogar na horizontal!</p>
</div>

<div id="lobby">

  <div id="logo">👑 MINI SKY BATTLE</div>

  <div id="playArea">
    <button id="playButton">▶ JOGAR</button>
  </div>

  <div id="profile">
    👤 JOGADOR
    <small>NÍVEL 1</small>
  </div>

  <div id="currency">🪙 0 &nbsp; 💎 0</div>

  <div id="sideButtons">
    <button class="menuButton" onclick="openMenu('PERSONAGENS')">👤 PERSONAGENS</button>
    <button class="menuButton" onclick="openMenu('LOJA')">🛒 LOJA</button>
    <button class="menuButton" onclick="openMenu('EVENTOS')">🏆 EVENTOS</button>
    <button class="menuButton" onclick="openMenu('AJUSTES')">⚙️ AJUSTES</button>
  </div>

  <div id="subtitle">PREPARE-SE PARA A BATALHA!</div>

  <div id="popup">
    <h2 id="popupTitle">MENU</h2>
    <p>Em breve, novidades por aqui!</p>
    <button onclick="closeMenu()">FECHAR</button>
  </div>

</div>

<div id="gameHUD">

  <div id="health">
    VIDA
    <div id="healthBar"></div>
    100 / 100
  </div>

  <button id="backButton">VOLTAR AO LOBBY</button>

  <div id="joystick">
    <div id="stick"></div>
  </div>

  <button id="actionButton">AÇÃO</button>

</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  55,
  window.innerWidth / window.innerHeight,
  0.1,
  150
);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  alpha: true
});

renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.setClearColor(0x000000, 0);

document.body.appendChild(renderer.domElement);

const ambient = new THREE.HemisphereLight(0xffffff,0x557044,2);
scene.add(ambient);

const sun = new THREE.DirectionalLight(0xffffff,2);
sun.position.set(-10,20,10);
sun.castShadow = true;
scene.add(sun);

function mat(color) {
  return new THREE.MeshStandardMaterial({
    color,
    roughness: 0.9
  });
}

// Grupo do cenário de batalha
const environment = new THREE.Group();
scene.add(environment);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(100,100),
  mat(0x65b94e)
);

ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
environment.add(ground);

function box(x,y,z,sx,sy,sz,material) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(sx,sy,sz),
    material
  );

  mesh.position.set(x,y,z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  environment.add(mesh);
  return mesh;
}

function tree(x,z,scale=1) {
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(.22*scale,.3*scale,1.5*scale,7),
    mat(0x80502d)
  );

  trunk.position.set(x,.75*scale,z);
  trunk.castShadow = true;
  environment.add(trunk);

  const leaves = new THREE.Mesh(
    new THREE.IcosahedronGeometry(1.05*scale,1),
    mat(0x367d3b)
  );

  leaves.position.set(x,1.85*scale,z);
  leaves.castShadow = true;
  environment.add(leaves);
}

function house(x,z) {
  box(x,1.3,z,4,2.6,3.5,mat(0xf0d49b));

  const roof = new THREE.Mesh(
    new THREE.ConeGeometry(3.1,1.8,4),
    mat(0xd45b3c)
  );

  roof.position.set(x,3.45,z);
  roof.rotation.y = Math.PI/4;
  roof.castShadow = true;
  environment.add(roof);
}

tree(-9,-8,1.2);
tree(10,-9,1.1);
tree(-13,9,1);
tree(13,10,1.2);
tree(-17,-1,1);
tree(18,2,1);
tree(-5,17,1.1);
tree(7,18,1);

house(-9,-15);
house(11,-16);
house(-17,13);
house(18,14);

box(-3,.6,-5,1.2,1.2,1.2,mat(0xb77a39));
box(4,.6,-7,1.2,1.2,1.2,mat(0xb77a39));
box(8,.6,5,1.2,1.2,1.2,mat(0xb77a39));

// Personagem 3D
const player = new THREE.Group();
scene.add(player);

const skin = mat(0xffc58c);
const shirt = mat(0x267bc1);
const pants = mat(0x263b56);
const hair = mat(0x493022);
const shoes = mat(0x303030);

function part(geometry,material,x,y,z) {
  const mesh = new THREE.Mesh(geometry,material);
  mesh.position.set(x,y,z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  player.add(mesh);
  return mesh;
}

// Corpo
part(
  new THREE.CapsuleGeometry(.48,.8,5,10),
  shirt,0,1.55,0
);

// Cabeça
part(
  new THREE.SphereGeometry(.48,18,14),
  skin,0,2.65,0
);

// Cabelo
part(
  new THREE.SphereGeometry(.49,16,10,0,Math.PI*2,0,Math.PI/2),
  hair,0,2.82,0
);

// Olhos
part(
  new THREE.SphereGeometry(.055,8,8),
  mat(0x202020),-.16,2.68,.43
);

part(
  new THREE.SphereGeometry(.055,8,8),
  mat(0x202020),.16,2.68,.43
);

// Pernas
part(
  new THREE.BoxGeometry(.32,.8,.35),
  pants,-.23,.65,0
);

part(
  new THREE.BoxGeometry(.32,.8,.35),
  pants,.23,.65,0
);

// Sapatos
part(
  new THREE.BoxGeometry(.38,.2,.55),
  shoes,-.23,.18,.08
);

part(
  new THREE.BoxGeometry(.38,.2,.55),
  shoes,.23,.18,.08
);

// Braços
part(
  new THREE.CapsuleGeometry(.14,.65,4,8),
  shirt,-.57,1.55,0
);

part(
  new THREE.CapsuleGeometry(.14,.65,4,8),
  shirt,.57,1.55,0
);

// Plataforma do personagem
const platform = new THREE.Mesh(
  new THREE.CylinderGeometry(1.35,1.5,.18,32),
  mat(0x4b8b43)
);

platform.position.y = .09;
platform.receiveShadow = true;
scene.add(platform);

player.position.set(0,0,0);
player.scale.setScalar(1.15);

camera.position.set(0,4.5,9);
camera.lookAt(0,1.5,0);

let gameStarted = false;
let moveX = 0;
let moveZ = 0;

const lobby = document.getElementById("lobby");
const hud = document.getElementById("gameHUD");
const background = document.getElementById("background");
const popup = document.getElementById("popup");
const stick = document.getElementById("stick");
const joystick = document.getElementById("joystick");

window.openMenu = function(name) {
  document.getElementById("popupTitle").textContent = name;
  popup.style.display = "block";
};

window.closeMenu = function() {
  popup.style.display = "none";
};

async function requestLandscape() {
  try {
    if (screen.orientation && screen.orientation.lock) {
      await screen.orientation.lock("landscape");
    }
  } catch(error) {
    // Alguns navegadores não permitem travar a orientação.
    // A mensagem de rotação continua funcionando.
  }
}

// Iniciar partida
document.getElementById("playButton").addEventListener("click", async () => {
  await requestLandscape();

  gameStarted = true;

  lobby.style.display = "none";
  hud.style.display = "block";
  background.style.display = "none";

  environment.visible = true;
  platform.visible = false;

  player.scale.setScalar(1);
  player.position.set(0,0,0);

  scene.background = new THREE.Color(0x8bcf75);

  camera.position.set(0,17,20);
  camera.lookAt(0,1,0);
});

// Voltar ao lobby
document.getElementById("backButton").addEventListener("click", () => {
  gameStarted = false;

  lobby.style.display = "block";
  hud.style.display = "none";
  background.style.display = "block";

  environment.visible = false;
  platform.visible = true;

  scene.background = null;

  player.scale.setScalar(1.15);
  player.position.set(0,0,0);
  player.rotation.y = 0;

  camera.position.set(0,4.5,9);
  camera.lookAt(0,1.5,0);

  stopJoystick();
});

// Joystick
let joystickActive = false;
let center = {x:0,y:0};

joystick.addEventListener("pointerdown", event => {
  if (!gameStarted) return;

  joystickActive = true;
  joystick.setPointerCapture(event.pointerId);

  const rect = joystick.getBoundingClientRect();

  center.x = rect.left + rect.width/2;
  center.y = rect.top + rect.height/2;

  updateJoystick(event);
});

joystick.addEventListener("pointermove", event => {
  if (joystickActive) updateJoystick(event);
});

function updateJoystick(event) {
  const dx = event.clientX - center.x;
  const dy = event.clientY - center.y;

  const max = 35;
  const distance = Math.sqrt(dx*dx + dy*dy);
  const factor = distance > max ? max/distance : 1;

  const x = dx*factor;
  const y = dy*factor;

  moveX = x/max;
  moveZ = y/max;

  stick.style.transform = `translate(${x}px,${y}px)`;
}

function stopJoystick() {
  joystickActive = false;
  moveX = 0;
  moveZ = 0;
  stick.style.transform = "translate(0px,0px)";
}

joystick.addEventListener("pointerup",stopJoystick);
joystick.addEventListener("pointercancel",stopJoystick);
joystick.addEventListener("lostpointercapture",stopJoystick);

// Teclado
const keys = {};

window.addEventListener("keydown",event => {
  keys[event.key.toLowerCase()] = true;
});

window.addEventListener("keyup",event => {
  keys[event.key.toLowerCase()] = false;
});

// Animação
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const delta = Math.min(clock.getDelta(),.05);
  const time = performance.now();

  if (!gameStarted) {
    player.rotation.y = Math.sin(time*.0005)*.12;
    player.position.y = Math.sin(time*.002)*.04;
    camera.lookAt(0,1.5,0);
  } else {
    let x = moveX;
    let z = moveZ;

    if (keys["w"] || keys["arrowup"]) z -= 1;
    if (keys["s"] || keys["arrowdown"]) z += 1;
    if (keys["a"] || keys["arrowleft"]) x -= 1;
    if (keys["d"] || keys["arrowright"]) x += 1;

    const length = Math.sqrt(x*x+z*z);

    if (length > 1) {
      x /= length;
      z /= length;
    }

    const speed = 6;

    player.position.x += x*speed*delta;
    player.position.z += z*speed*delta;

    if (length > .05) {
      player.rotation.y = Math.atan2(x,z);
    }

    const target = new THREE.Vector3(
      player.position.x,
      1,
      player.position.z
    );

    const desiredCamera = new THREE.Vector3(
      player.position.x,
      17,
      player.position.z+20
    );

    camera.position.lerp(desiredCamera,.06);
    camera.lookAt(target);
  }

  renderer.render(scene,camera);
}

animate();

// Ajustar a tela
window.addEventListener("resize",() => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});
</script>

</body>
</html>
