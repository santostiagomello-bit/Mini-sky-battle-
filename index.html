
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MINI SKY BATTLE</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: #8acb65;
  color: white;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
}

#lobby {
  position: fixed;
  inset: 0;
  z-index: 5;
  pointer-events: none;
  background: linear-gradient(
    180deg,
    rgba(9,35,55,.38),
    transparent 45%,
    rgba(8,30,48,.55)
  );
}

#topbar {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 65px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 14px;
  background: linear-gradient(90deg,#173b58dd,#245b6ddd);
}

#logo {
  font-size: 21px;
  font-weight: 1000;
  text-shadow: 2px 3px #173044;
  letter-spacing: 1px;
}

#currency {
  font-size: 14px;
  font-weight: bold;
  background: #173b58cc;
  padding: 9px 12px;
  border-radius: 20px;
}

#profile {
  position: absolute;
  top: 78px;
  left: 12px;
  padding: 10px 14px;
  border-radius: 12px;
  background: #173b58dd;
  font-size: 13px;
  font-weight: bold;
}

#playArea {
  position: absolute;
  top: 145px;
  left: 12px;
  pointer-events: auto;
}

#playButton {
  width: 135px;
  border: 3px solid #fff3a0;
  border-radius: 14px;
  padding: 14px 8px;
  background: linear-gradient(#ffe65b,#ff9e22);
  color: #663500;
  font-size: 19px;
  font-weight: 1000;
  box-shadow: 0 5px 0 #a85a12, 0 8px 15px #0005;
  cursor: pointer;
}

#playButton:active {
  transform: translateY(3px);
  box-shadow: 0 2px 0 #a85a12;
}

#sideButtons {
  position: absolute;
  top: 145px;
  right: 10px;
  display: flex;
  flex-direction: column;
  gap: 9px;
  pointer-events: auto;
}

.menuButton {
  width: 105px;
  padding: 11px 5px;
  border: 2px solid #ffffffaa;
  border-radius: 11px;
  color: white;
  background: #174566e8;
  font-size: 13px;
  font-weight: bold;
  text-shadow: 1px 2px #123;
  box-shadow: 0 3px 0 #102d45;
  cursor: pointer;
}

#subtitle {
  position: absolute;
  bottom: 25px;
  width: 100%;
  text-align: center;
  font-size: 13px;
  font-weight: 900;
  letter-spacing: 1px;
  text-shadow: 2px 2px 3px #123;
}

#popup {
  display: none;
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%,-50%);
  width: min(300px,85%);
  padding: 22px;
  border: 3px solid #ffe16b;
  border-radius: 17px;
  background: #173b58f5;
  text-align: center;
  pointer-events: auto;
}

#popup button {
  margin-top: 15px;
  padding: 10px 25px;
  border: 0;
  border-radius: 9px;
  background: #ffbd37;
  color: #573000;
  font-weight: bold;
}

#gameHUD {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 4;
  pointer-events: none;
}

#health {
  position: absolute;
  top: 15px;
  left: 12px;
  width: 145px;
  padding: 9px;
  border-radius: 10px;
  background: #173b58dd;
  font-weight: bold;
  font-size: 13px;
}

#healthBar {
  height: 9px;
  margin-top: 6px;
  border-radius: 8px;
  background: #e94a3e;
}

#backButton {
  position: absolute;
  top: 15px;
  right: 12px;
  padding: 10px 14px;
  border: 2px solid white;
  border-radius: 10px;
  background: #174566e8;
  color: white;
  font-weight: bold;
  pointer-events: auto;
}

#joystick {
  position: absolute;
  bottom: 25px;
  left: 22px;
  width: 115px;
  height: 115px;
  border: 3px solid #ffffff88;
  border-radius: 50%;
  background: #173b5877;
  pointer-events: auto;
  touch-action: none;
}

#stick {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 48px;
  height: 48px;
  margin-left: -24px;
  margin-top: -24px;
  border-radius: 50%;
  background: #ffffffbb;
  border: 2px solid white;
}

#actionButton {
  position: absolute;
  right: 25px;
  bottom: 38px;
  width: 75px;
  height: 75px;
  border-radius: 50%;
  border: 3px solid white;
  background: #ef9b27dd;
  color: white;
  font-size: 14px;
  font-weight: bold;
  pointer-events: auto;
}

@media (max-height: 500px) {
  #sideButtons { top: 95px; }
  #playArea { top: 95px; }
  #joystick { width: 90px; height: 90px; }
}
</style>
</head>

<body>

<div id="lobby">
  <div id="topbar">
    <div id="logo">MINI SKY BATTLE</div>
    <div id="currency">🪙 0 &nbsp; 💎 0</div>
  </div>

  <div id="profile">👤 JOGADOR</div>

  <div id="playArea">
    <button id="playButton">▶ JOGAR</button>
  </div>

  <div id="sideButtons">
    <button class="menuButton" onclick="openMenu('PERSONAGENS')">👤 PERSONAGENS</button>
    <button class="menuButton" onclick="openMenu('LOJA')">🛒 LOJA</button>
    <button class="menuButton" onclick="openMenu('EVENTOS')">🎯 EVENTOS</button>
    <button class="menuButton" onclick="openMenu('AJUSTES')">⚙️ AJUSTES</button>
  </div>

  <div id="subtitle">PREPARE-SE PARA A BATALHA!</div>

  <div id="popup">
    <h2 id="popupTitle">MENU</h2>
    <p>Em breve, novidades por aqui!</p>
    <button onclick="closeMenu()">FECHAR</button>
  </div>
</div>

<div id="gameHUD">
  <div id="health">
    VIDA
    <div id="healthBar"></div>
    100 / 100
  </div>

  <button id="backButton">VOLTAR AO LOBBY</button>

  <div id="joystick">
    <div id="stick"></div>
  </div>

  <button id="actionButton">AÇÃO</button>
</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8bcf75);
scene.fog = new THREE.Fog(0x8bcf75, 35, 90);

const camera = new THREE.PerspectiveCamera(
  55,
  window.innerWidth / window.innerHeight,
  0.1,
  150
);

const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const ambient = new THREE.HemisphereLight(0xffffff, 0x557044, 2);
scene.add(ambient);

const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(-10, 20, 10);
sun.castShadow = true;
scene.add(sun);

function material(color) {
  return new THREE.MeshStandardMaterial({
    color,
    roughness: 0.9
  });
}

const green = material(0x65b94e);
const darkGreen = material(0x367d3b);
const brown = material(0x80502d);
const roofMaterial = material(0xd45b3c);
const wallMaterial = material(0xf0d49b);
const crateMaterial = material(0xb77a39);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(120, 120),
  green
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

function makeBox(x, y, z, sx, sy, sz, mat) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(sx, sy, sz),
    mat
  );
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

function makeTree(x, z, scale = 1) {
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.22*scale, 0.3*scale, 1.5*scale, 7),
    brown
  );
  trunk.position.set(x, 0.75*scale, z);
  trunk.castShadow = true;
  scene.add(trunk);

  const leaves = new THREE.Mesh(
    new THREE.IcosahedronGeometry(1.05*scale, 1),
    darkGreen
  );
  leaves.position.set(x, 1.85*scale, z);
  leaves.castShadow = true;
  scene.add(leaves);

  const top = new THREE.Mesh(
    new THREE.IcosahedronGeometry(0.68*scale, 1),
    material(0x4b9c42)
  );
  top.position.set(x, 2.35*scale, z);
  top.castShadow = true;
  scene.add(top);
}

function makeHouse(x, z) {
  const house = new THREE.Group();

  const walls = new THREE.Mesh(
    new THREE.BoxGeometry(4, 2.6, 3.5),
    wallMaterial
  );
  walls.position.y = 1.3;
  walls.castShadow = true;
  house.add(walls);

  const roof = new THREE.Mesh(
    new THREE.ConeGeometry(3.1, 1.8, 4),
    roofMaterial
  );
  roof.position.y = 3.45;
  roof.rotation.y = Math.PI / 4;
  roof.castShadow = true;
  house.add(roof);

  const door = new THREE.Mesh(
    new THREE.BoxGeometry(0.8, 1.5, 0.12),
    brown
  );
  door.position.set(0, 0.75, 1.81);
  house.add(door);

  house.position.set(x, 0, z);
  scene.add(house);
}

function makeCrate(x, z) {
  const crate = new THREE.Mesh(
    new THREE.BoxGeometry(1.2, 1.2, 1.2),
    crateMaterial
  );
  crate.position.set(x, 0.6, z);
  crate.castShadow = true;
  crate.receiveShadow = true;
  scene.add(crate);

  const line = new THREE.Mesh(
    new THREE.BoxGeometry(1.25, 0.12, 0.12),
    brown
  );
  line.position.set(x, 0.6, z + 0.62);
  scene.add(line);
}

// Estradas
const roadMaterial = material(0x777b70);

const road1 = new THREE.Mesh(
  new THREE.BoxGeometry(12, 0.04, 120),
  roadMaterial
);
road1.position.y = 0.025;
scene.add(road1);

const road2 = new THREE.Mesh(
  new THREE.BoxGeometry(120, 0.04, 10),
  roadMaterial
);
road2.position.y = 0.03;
scene.add(road2);

// Cenário
makeTree(-9, -8, 1.2);
makeTree(10, -9, 1.1);
makeTree(-13, 9, 1);
makeTree(13, 10, 1.2);
makeTree(-17, -1, 1);
makeTree(18, 2, 1);
makeTree(-5, 17, 1.1);
makeTree(7, 18, 1);

makeHouse(-9, -15);
makeHouse(11, -16);
makeHouse(-17, 13);
makeHouse(18, 14);

makeCrate(-3, -5);
makeCrate(4, -7);
makeCrate(8, 5);
makeCrate(-8, 7);

// Plataforma de apresentação do personagem
const platform = new THREE.Mesh(
  new THREE.CylinderGeometry(1.35, 1.5, 0.18, 32),
  material(0x4b8b43)
);
platform.position.set(0, 0.09, 4);
platform.receiveShadow = true;
scene.add(platform);

// Personagem
const player = new THREE.Group();
scene.add(player);

const skin = material(0xffc58c);
const shirt = material(0x267bc1);
const pants = material(0x263b56);
const hair = material(0x493022);
const shoes = material(0x303030);

function addPlayerPart(geometry, mat, x, y, z, parent = player) {
  const mesh = new THREE.Mesh(geometry, mat);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

// Corpo
addPlayerPart(
  new THREE.CapsuleGeometry(0.48, 0.8, 5, 10),
  shirt, 0, 1.55, 0
);

// Cabeça
addPlayerPart(
  new THREE.SphereGeometry(0.48, 18, 14),
  skin, 0, 2.65, 0
);

// Cabelo
addPlayerPart(
  new THREE.SphereGeometry(0.49, 16, 10, 0, Math.PI*2, 0, Math.PI/2),
  hair, 0, 2.82, 0
);

// Olhos
addPlayerPart(
  new THREE.SphereGeometry(0.055, 8, 8),
  material(0x202020), -0.16, 2.68, 0.43
);

addPlayerPart(
  new THREE.SphereGeometry(0.055, 8, 8),
  material(0x202020), 0.16, 2.68, 0.43
);

// Pernas
addPlayerPart(
  new THREE.BoxGeometry(0.32, 0.8, 0.35),
  pants, -0.23, 0.65, 0
);

addPlayerPart(
  new THREE.BoxGeometry(0.32, 0.8, 0.35),
  pants, 0.23, 0.65, 0
);

// Sapatos
addPlayerPart(
  new THREE.BoxGeometry(0.38, 0.2, 0.55),
  shoes, -0.23, 0.18, 0.08
);

addPlayerPart(
  new THREE.BoxGeometry(0.38, 0.2, 0.55),
  shoes, 0.23, 0.18, 0.08
);

// Braços
const leftArm = addPlayerPart(
  new THREE.CapsuleGeometry(0.14, 0.65, 4, 8),
  shirt, -0.57, 1.55, 0
);

const rightArm = addPlayerPart(
  new THREE.CapsuleGeometry(0.14, 0.65, 4, 8),
  shirt, 0.57, 1.55, 0
);

player.position.set(0, 0, 4);
player.scale.setScalar(1.45);

// Câmera inicial do lobby
camera.position.set(0, 7, 15);
camera.lookAt(0, 1.2, 4);

let gameStarted = false;
let moveX = 0;
let moveZ = 0;

const lobby = document.getElementById("lobby");
const hud = document.getElementById("gameHUD");
const popup = document.getElementById("popup");
const popupTitle = document.getElementById("popupTitle");

window.openMenu = function(name) {
  popupTitle.textContent = name;
  popup.style.display = "block";
};

window.closeMenu = function() {
  popup.style.display = "none";
};

// Iniciar partida
document.getElementById("playButton").addEventListener("click", () => {
  gameStarted = true;
  lobby.style.display = "none";
  hud.style.display = "block";

  player.scale.setScalar(1);
  player.position.set(0, 0, 5);

  camera.position.set(0, 17, 25);
  camera.lookAt(0, 1, 5);
});

// Voltar ao lobby
document.getElementById("backButton").addEventListener("click", () => {
  gameStarted = false;
  lobby.style.display = "block";
  hud.style.display = "none";

  player.scale.setScalar(1.45);
  player.position.set(0, 0, 4);

  camera.position.set(0, 7, 15);
  camera.lookAt(0, 1.2, 4);

  moveX = 0;
  moveZ = 0;
  stick.style.transform = "translate(0px,0px)";
});

// Joystick
const joystick = document.getElementById("joystick");
const stick = document.getElementById("stick");

let joystickActive = false;
let joystickCenter = {x:0, y:0};

joystick.addEventListener("pointerdown", (event) => {
  if (!gameStarted) return;

  joystickActive = true;
  joystick.setPointerCapture(event.pointerId);

  const rect = joystick.getBoundingClientRect();
  joystickCenter.x = rect.left + rect.width / 2;
  joystickCenter.y = rect.top + rect.height / 2;

  updateJoystick(event);
});

joystick.addEventListener("pointermove", (event) => {
  if (joystickActive) updateJoystick(event);
});

function updateJoystick(event) {
  const dx = event.clientX - joystickCenter.x;
  const dy = event.clientY - joystickCenter.y;
  const max = 35;

  const distance = Math.sqrt(dx*dx + dy*dy);
  const scale = distance > max ? max / distance : 1;

  const x = dx * scale;
  const y = dy * scale;

  moveX = x / max;
  moveZ = y / max;

  stick.style.transform = `translate(${x}px,${y}px)`;
}

function stopJoystick() {
  joystickActive = false;
  moveX = 0;
  moveZ = 0;
  stick.style.transform = "translate(0px,0px)";
}

joystick.addEventListener("pointerup", stopJoystick);
joystick.addEventListener("pointercancel", stopJoystick);
joystick.addEventListener("lostpointercapture", stopJoystick);

// Teclado
const keys = {};

window.addEventListener("keydown", (event) => {
  keys[event.key.toLowerCase()] = true;
});

window.addEventListener("keyup", (event) => {
  keys[event.key.toLowerCase()] = false;
});

// Animação
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const delta = Math.min(clock.getDelta(), 0.05);
  const time = performance.now();

  if (!gameStarted) {
    // Personagem em destaque no lobby
    player.rotation.y = Math.sin(time * 0.0005) * 0.12;
    camera.lookAt(0, 1.2, 4);
  } else {
    let x = moveX;
    let z = moveZ;

    if (keys["w"] || keys["arrowup"]) z -= 1;
    if (keys["s"] || keys["arrowdown"]) z += 1;
    if (keys["a"] || keys["arrowleft"]) x -= 1;
    if (keys["d"] || keys["arrowright"]) x += 1;

    const length = Math.sqrt(x*x + z*z);
    if (length > 1) {
      x /= length;
      z /= length;
    }

    const speed = 6;

    player.position.x += x * speed * delta;
    player.position.z += z * speed * delta;

    if (length > 0.05) {
      player.rotation.y = Math.atan2(x, z);
    }

    const target = new THREE.Vector3(
      player.position.x,
      1,
      player.position.z
    );

    const desiredCamera = new THREE.Vector3(
      player.position.x,
      17,
      player.position.z + 20
    );

    camera.position.lerp(desiredCamera, 0.06);
    camera.lookAt(target);
  }

  renderer.render(scene, camera);
}

animate();

// Redimensionamento da tela
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
